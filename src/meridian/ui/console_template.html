<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Console</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f3f0; --surface:#fcfcfb; --surface-2:#f0efec; --line:#e2e0da; --line-strong:#cfccc4;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7a7873; --accent:#1f4e8c; --accent-ink:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --pos:#2a78d6; --neg:#eb6834; --mid:#b9b7b0;
  --good:#1a7f37; --good-bg:#e6f4ea; --warn:#9a6700; --warn-bg:#fff4d6; --crit:#b42318; --crit-bg:#fde8e6; --info:#1f4e8c; --info-bg:#e8eef8; --off-bg:#eeedea;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 1px rgba(0,0,0,.03);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --line:#2e2e2b; --line-strong:#3c3c38;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#9a998f; --accent:#7aa7e6; --accent-ink:#0b0b0b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --pos:#3987e5; --neg:#d95926; --mid:#5a5a55;
  --good:#5cc27a; --good-bg:#16301f; --warn:#e3b341; --warn-bg:#352a0e; --crit:#f2766b; --crit-bg:#3a1714; --info:#7aa7e6; --info-bg:#172338; --off-bg:#262624;
}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px} .brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
label.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:block;margin-bottom:6px}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
nav{display:flex;flex-direction:column;gap:2px}
.navh{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:12px 0 4px 10px}.navh:first-child{margin-top:0}
#nav button[data-n]::after{content:attr(data-n);display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:11px;font-weight:700;text-align:center;margin-left:4px}
nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;color:var(--text-2)}
nav button:hover{background:var(--surface-2)} nav button.active{background:var(--info-bg);color:var(--info);font-weight:600}
nav button:focus-visible{outline:2px solid var(--accent)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted)}
main{padding:20px 28px 60px;max-width:1280px}
.topbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:14px}
.topbar h1{font-size:20px;margin:0 12px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--off-bg);color:var(--text-2);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)} .chip.info{background:var(--info-bg);color:var(--info)}
.banner{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);padding:10px 14px;border-radius:var(--radius);margin-bottom:16px;font-size:13px}
.grid{display:grid;gap:14px} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1000px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}.app{grid-template-columns:1fr}aside{position:static;height:auto}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 10px} .card h3{font-size:13px;margin:14px 0 6px;color:var(--text-2)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.3px} .kpi .l{font-size:12px;color:var(--muted)} .kpi .s{font-size:12px;color:var(--text-2);margin-top:2px}
.section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:22px 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--text-2);font-size:12px;background:var(--surface-2);position:sticky;top:0} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)} tr.sel td{background:var(--info-bg)}
.scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.muted{color:var(--muted)} .small{font-size:12px} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.btn{cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600}
.btn.small{padding:4px 9px;font-size:12px}.vpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}.vchip{cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--text-2);padding:5px 11px;border-radius:999px;font-weight:600;font-size:13px}.vchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.vchip:focus-visible{outline:2px solid var(--accent,#1f4e8c);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill-list{display:flex;flex-wrap:wrap;gap:6px}
.why{border-left:3px solid var(--accent);padding:6px 12px;background:var(--surface-2);border-radius:0 8px 8px 0}
.md h1{font-size:20px}.md h2{font-size:16px;margin-top:22px}.md table{margin:8px 0}.md blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--warn);background:var(--warn-bg);color:var(--warn)}
.md code{background:var(--surface-2);padding:1px 4px;border-radius:4px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--surface-2);padding:10px;border-radius:8px;font-size:12px;max-height:420px;overflow:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:4px 0 8px} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{position:relative} .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;z-index:5;min-width:150px}
.tip b{display:block;margin-bottom:4px}
svg text{fill:var(--muted);font-size:11px}
.vt-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.vt-tabs button{cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600}
.vt-tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--text);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:13px;display:none}
.caret{all:unset;cursor:pointer;width:16px;display:inline-block;color:var(--text-2)}.caret-sp{display:inline-block;width:16px}
tr.lvl0 td{font-weight:600}.up{color:var(--pos)}.down{color:var(--neg)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.filters>*{width:auto;min-width:160px}
.why-btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--accent);border-radius:999px;font-size:11px;padding:1px 8px;cursor:pointer;margin-left:6px;vertical-align:middle}
.why-btn:hover{background:var(--surface-2)}
#whyModal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
#whyModal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:860px;width:100%;padding:18px 20px}
.dr-item{border-left:3px solid var(--line-strong);padding:6px 10px;margin:8px 0}.dr-item.human{border-left-color:var(--accent)}
tr.overdue td{background:var(--crit-bg)}
.att{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.att:last-child{border-bottom:0}.att>div{flex:1;min-width:0}.att .btn{flex:none}
.approve-box{border-left:4px solid var(--accent)}
ol.story{margin:0;padding-left:20px}ol.story li{margin:6px 0}
.rbrow{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer}.rbrow:hover{background:var(--surface-2)}.rbv{width:44px;font-weight:600}.rbpct{width:44px;text-align:right;font-variant-numeric:tabular-nums}.rbte{width:110px}
.rbtrack{position:relative;flex:1;height:12px;background:var(--surface-2);border-radius:6px}.rbfill{height:100%;border-radius:6px;background:var(--good)}.rbfill.warn{background:var(--warn)}.rbfill.crit{background:var(--crit)}
.rbtrack i{position:absolute;top:-3px;bottom:-3px;border-left:2px dotted var(--text-2)}.rbtrack i.lim{border-left:2px solid var(--text)}.rbtrack b{position:absolute;top:1px;width:9px;height:9px;margin-left:-5px;transform:rotate(45deg);background:var(--info);border:1px solid var(--surface)}
.choice{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.ltsearch{position:relative;flex:1;min-width:300px;max-width:560px}
.ltsug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;max-height:360px;overflow:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.ltsug div{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}.ltsug div.act,.ltsug div:hover{background:var(--info-bg)}
.selbar{display:flex;gap:10px;align-items:center;margin:10px 0 4px;padding:8px 10px;border:1px solid var(--accent);border-radius:8px;background:var(--info-bg)}
details.card>summary{cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Meridian<small>Agentic Portfolio Management</small></div>
    <div>
      <label class="lbl" for="role">Workspace</label>
      <select id="role" aria-label="Role"></select>
      <div class="small muted" style="margin-top:6px" id="roleHelp">Prototype: choose a role to preview its workspace. In production the role comes from single sign-on.</div>
    </div>
    <div id="runPick"></div>
    <nav id="nav" aria-label="Workspace"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <main>
    <div class="topbar" id="topbar"></div>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const D = /*__MERIDIAN_DATA__*/null;
const LIVE = /*__MERIDIAN_LIVE__*/null;
async function api(path, body){
  const r = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':LIVE.csrf},body:JSON.stringify(body),credentials:'same-origin'});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.detail||('Request failed ('+r.status+')'));
  return j;
}
const R = D.results, L = D.ledger, P = D.policy, U = D.universe, G = D.regime;
const VINT = Object.keys(R.vintages).map(Number).sort((a,b)=>a-b);
const pct = (x,d=1)=> (x==null||isNaN(x))?'—':(x*100).toFixed(d)+'%';
const pp = (x,d=1)=> (x>=0?'+':'')+(x*100).toFixed(d)+'pp';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm = a => (U[a]&&U[a].name)||a;
const $ = s => document.querySelector(s);
const synthetic = !!(R.snapshot && Object.values(R.snapshot.datasets||{}).some(d=>d.synthetic));
const synthList = R.snapshot ? Object.entries(R.snapshot.datasets||{}).filter(([k,d])=>d.synthetic).map(([k,d])=>{const m=(d.notes||'').match(/synthetic_assets=\[([^\]]*)\]/);return k+(m?' ('+m[1].replace(/'/g,'')+')':' (all)')}) : [];
const allSynthetic = R.snapshot ? Object.values(R.snapshot.datasets||{}).every(d=>d.synthetic && !(d.contributions && Object.keys(d.contributions).some(s=>!s.includes('synthetic')))) : true;
const co = R.compliance_officer || {};

const ROLES = {
  pm:        {label:'Portfolio Manager',     approverRole:'portfolio_manager', tabs:['home','products','positioning','portfolios','changes','riskSummary','riskbudget','metrics','exposures','glide','approvals','exceptions','agents']},
  risk:      {label:'Risk Analytics',        approverRole:'risk',              tabs:['home','riskSummary','factors','stress','riskHistory','exposures','riskbudget','metrics','risk','positioning','portfolios','approvals','exceptions']},
  research:  {label:'Research / Analyst',    approverRole:null,                tabs:['home','positioning','changes','metrics','factors','exposures','cma','agents','glide']},
  mgr:       {label:'Manager Selection',     approverRole:null,                tabs:['home','products','funds','exposures','positioning']},
  lead:      {label:'Leadership',            approverRole:'investment_committee', tabs:['home','products','memo','changes','riskSummary','stress','riskbudget','metrics','glide','approvals','exceptions']},
  compliance:{label:'Compliance',            approverRole:'chief_compliance_officer', tabs:['home','compliance','exceptions','riskbudget','exposures','report','ledger']},
  audit:     {label:'Audit (read-only)',     approverRole:null,                tabs:['home','ledger','exceptions','compliance','report']},
};
const TABS = {products:'Funds & vintages',positioning:'Positioning',riskbudget:'Risk budget',metrics:'Metrics',home:'Home',portfolios:'Proposals',glide:'Glide path',approvals:'Approvals',agents:'Agent votes',
  riskSummary:'Fund risk',factors:'Factor risk',stress:'Stress tests',riskHistory:'Risk history',exposures:'Look-through & search',
  risk:'Candidate risk',cma:'Capital market assumptions',funds:'Underlying funds',memo:'Board memo',compliance:'Compliance',report:'Compliance report',ledger:'Decision ledger',changes:'Changes since last run',exceptions:'Exceptions'};
const NAV_GROUPS = [['Overview',['home','changes','memo']],['Portfolio',['products','positioning','portfolios','glide','funds','cma','agents']],
  ['Risk',['riskSummary','riskbudget','metrics','factors','stress','riskHistory','exposures','risk']],['Governance',['approvals','exceptions','compliance','report','ledger']]];
const allowedRoles = () => LIVE ? LIVE.console_roles : Object.keys(ROLES);
let state = {role: (()=>{const h=location.hash.slice(1);const ok=allowedRoles();return ok.includes(h)?h:ok[0]})(), tab:null, vintage:2050, ledgerFilter:'', ledgerSel:null, approvals:[]};
try{const t=sessionStorage.getItem('mer_tab');if(t){state.tab=t;sessionStorage.removeItem('mer_tab')}const x=sessionStorage.getItem('mer_exc');if(x){state.excOpenInit=x;sessionStorage.removeItem('mer_exc')}}catch(e){}

function toast(m,type){if(window.MUI) MUI.toast(m,type); else {const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',5000)}}
function chip(status){const s=String(status||'');const c=s.startsWith('PASS')||s==='CLEAR'||s==='APPROVE'||s==='APPLIED'||s==='applied'?'good':(s==='WARN'||s==='CONDITIONAL'||s==='ATTEST'||s.includes('pending'))?'warn':(s==='FAIL'||s==='BLOCKED'||s==='REJECT'||s==='rejected')?'crit':'';return `<span class="chip ${c}">${esc(s)}</span>`}
function overallStatus(){const all=VINT.map(v=>R.vintages[v].compliance_summary.overall);return all.includes('FAIL')?'FAIL':all.some(s=>s==='WARN')?'WARN':all.every(s=>s==='PASS')?'PASS':'PASS (attestations pending)'}
function cioRec(v){return L.find(r=>r.step==='cio.ensemble'&&r.portfolio_scope.includes('MTRS-'+v))}
function drById(id){return L.find(r=>r.dr_id===id)}

// --------------------------------------------------------------- shell
function renderShell(){
  const sel=$('#role'); sel.innerHTML=Object.entries(ROLES).filter(([k])=>allowedRoles().includes(k)).map(([k,r])=>`<option value="${k}" ${k===state.role?'selected':''}>${r.label}</option>`).join('');
  if(LIVE){ $('#roleHelp').textContent = allowedRoles().length>1 ? 'You have more than one role. Switch workspace to see each view.' : '';
    $('#runPick').innerHTML=`<label class="lbl" for="runSel">Run</label><select id="runSel">${LIVE.runs.map(r=>`<option value="${esc(r.id)}" ${r.id===LIVE.run_id?'selected':''}>${esc(r.as_of)} · ${esc(r.id.slice(-6))}</option>`).join('')}</select>`;
    const rs=$('#runSel'); rs.onchange=()=>{location.href='/runs/'+encodeURIComponent(rs.value)+location.hash}; }
  sel.onchange=()=>{state.role=sel.value;state.tab=null;try{location.hash=state.role}catch(e){};render()};
  const role=ROLES[state.role]; if(!state.tab||!role.tabs.includes(state.tab)) state.tab=role.tabs[0];
  const openExc=(LIVE&&LIVE.exceptions||[]).filter(c=>['open','in_progress'].includes(c.status)).length;
  const badge=t=>t==='exceptions'&&openExc?` data-n="${openExc}" aria-label="${TABS[t]}, ${openExc} open"`:'';
  $('#nav').innerHTML=NAV_GROUPS.map(([g,ts])=>{const mine=ts.filter(t=>role.tabs.includes(t)); return mine.length?`<div class="navh">${g}</div>`+mine.map(t=>`<button class="${t===state.tab?'active':''}" data-t="${t}"${badge(t)}>${TABS[t]}</button>`).join(''):''}).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;render()});
  $('#topbar').innerHTML=`<h1>Target Retirement Series</h1>
    <span class="chip info">Run ${esc(R.run_id)}</span><span class="chip">As of ${esc(R.as_of)}</span>
    <span class="chip">Regime: ${esc(R.macro.regime.replace('_','-'))}</span>
    ${chip(overallStatus())}<span class="chip ${co.status==='CLEAR'?'good':co.status==='BLOCKED'?'crit':'warn'}">Compliance review: ${esc(co.status)}</span>
    <span class="chip">Autonomy ${esc(G.autonomy)} · ${esc(G.mode)}</span>`;
  $('#banner').innerHTML = !synthetic?'':allSynthetic
    ?`<div class="banner"><b>Synthetic data — system test only.</b> Every figure comes from generated data. Not investment advice; not for marketing use.</div>`
    :`<div class="banner"><b>Contains synthetic data — system test only.</b> Generated values were used for: ${synthList.map(esc).join('; ')}. Everything else comes from public sources. Not investment advice; not for marketing use.</div>`;
  $('#sidefoot').innerHTML=`Policy <span class="mono">${esc(P.id)}</span><br>Ledger: ${D.ledger_verification.ok?'✓ verified':'✗ FAILED'} (${L.length} records)<br>Entities: ${G.selected.map(esc).join(', ')}`;
}

// --------------------------------------------------------------- views
const V = {};
// glide-path scope: which vintages (all selected = no restriction)
function gpSel(){ if(!state.gpVint) state.gpVint=VINT.slice(); return state.gpVint; }
function gpScopeFunds(){ const sc=$('#gpScope')?$('#gpScope').value:((state.gpScopeSel||{}).scope||'*'), vs=gpSel();
  return (FUNDS||[]).filter(f=>(sc==='*'||sc===f.id||sc==='vehicle:'+f.vehicle)&&(sc===f.id||vs.includes(f.vintage))); }
function gpVintPicker(){ const vs=gpSel(), sc=(state.gpScopeSel||{}).scope||'*', one=!['*','vehicle:mutual_fund','vehicle:cit'].includes(sc);
  if(one) return `<label class="small">2. Vintages</label><div class="small muted" style="padding-top:8px">One fund chosen, so its own vintage applies.</div>`;
  const n=gpScopeFunds().length;
  return `<label class="small" id="gpVlab">2. Vintages <span class="muted">(click to include or leave out)</span></label>
   <div class="vpick" role="group" aria-labelledby="gpVlab">${VINT.map(v=>`<button type="button" class="vchip ${vs.includes(v)?'on':''}" aria-pressed="${vs.includes(v)}" data-gpv="${v}">${v}</button>`).join('')}
   <button type="button" class="btn small" data-gpvset="all">All</button><button type="button" class="btn small" data-gpvset="near">2030–2045</button><button type="button" class="btn small" data-gpvset="far">2050–2070</button><button type="button" class="btn small" data-gpvset="none">Clear</button></div>
   <div class="small ${vs.length?'muted':'neg'}" id="gpVcount">${vs.length?`${vs.length===VINT.length?'All':vs.length} vintage${vs.length===1?'':'s'} selected · ${n} fund${n===1?'':'s'} in scope`:'Pick at least one vintage'}</div>`; }
function vintageTabs(){return `<div class="vt-tabs" role="tablist">${VINT.map(v=>`<button class="${v===state.vintage?'active':''}" data-vt="${v}">${v}</button>`).join('')}</div>`}

function approvalForm(v,roleName){
  const done=allDecisions().find(a=>a.vintage===v&&a.role===roleName);
  if(done) return `<h3>Decision (${esc(roleName)})</h3><div>${chip(done.decision.toUpperCase())} <span class="small">${esc(done.reason||'')}${done.name?' — '+esc(done.name):''}</span></div>${LIVE?`<div class="small muted">Recorded in the ledger as <span class="mono">${esc(done.dr||'')}</span></div>`:`<h3>Record it in the ledger</h3><pre id="cmd">${esc(cmdFor(done))}</pre><button class="btn" id="copyCmd">Copy command</button>`}`;
  return `<h3>Your decision as ${esc(ROLE_NAME[roleName]||roleName)}</h3>
  <div class="small muted" style="margin-bottom:6px">You are deciding on the ${v} weights shown above, which become the approved target for this vintage's mutual fund and CIT. No trades are placed. A reason is required.</div>
  <label class="small"><input type="checkbox" id="ack" style="width:auto"> I reviewed the summary, the weights, the agents' reasoning and disagreement, and the compliance results</label>
  <textarea id="reason" rows="3" placeholder="Reason for your decision" style="margin:8px 0"></textarea>
  <div class="row"><button class="btn primary" data-decide="approve">Approve</button><button class="btn" data-decide="reject">Reject</button><button class="btn" data-decide="request_changes">Request changes</button></div>`;
}
function ledgerDecisions(){ return L.filter(r=>r.step==='approval.decision').map(r=>({vintage:+r.portfolio_scope[0].split('-')[1],role:r.approvals[0].role,decision:r.approvals[0].decision,reason:r.rationale,name:r.actor.id,dr:r.dr_id})); }
function allDecisions(){ return ledgerDecisions().concat(LIVE?[]:state.approvals); }
function cmdFor(a){return `meridian approve runs/${R.run_id} --vintage ${a.vintage} --role ${a.role} --name "YOUR NAME" --decision ${a.decision} --reason "${a.reason.replace(/"/g,"'")}"`}

function rbBar(f){ if(f==null) return '—'; const a=Math.abs(f), c=f<0?'var(--neg)':a>0.8?'var(--warn)':'var(--pos)';

// ---- adjustment editor: same minimum-norm math as meridian.analytics.positioning.apply_adjustment
const NODES = (()=>{ if(!M) return []; const s=[]; M.taxonomy.forEach(l=>{for(let i=1;i<=l.path.length;i++){const n=l.path.slice(0,i).join('/'); if(!s.includes(n)) s.push(n);}}); return s; })();
function nodeRow(n){ const A=M.assets; if(n.startsWith('asset:')){const a=n.slice(6);return A.map(x=>x===a?1:0);} const r=A.map(()=>0); M.taxonomy.forEach(l=>{const p=l.path.join('/'); if(p===n||p.startsWith(n+'/')) r[A.indexOf(l.asset)]+=l.fraction}); return r; }
const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
function solveSym(K,y){ const n=y.length, A=K.map((r,i)=>[...r,y[i]]); for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r; [A[c],A[p]]=[A[p],A[c]]; if(Math.abs(A[c][c])<1e-14) return null; for(let r=0;r<n;r++){ if(r===c) continue; const f=A[r][c]/A[c][c]; for(let k=c;k<=n;k++) A[r][k]-=f*A[c][k]; } } return A.map((r,i)=>r[n]/r[i]); }
function independent(rows){ // keep rows that add rank (Gram-Schmidt)
  const basis=[], keep=[]; rows.forEach((r,i)=>{ let v=r.slice(); basis.forEach(b=>{const c=dot(v,b);v=v.map((x,k)=>x-c*b[k])}); const nr=Math.sqrt(dot(v,v)); if(nr>1e-9){basis.push(v.map(x=>x/nr)); keep.push(i);} }); return keep; }
function applyAdj(w,a){ const r=nodeRow(a.node), cur=dot(r,w), delta=a.mode==='absolute'?a.value-cur:a.value; const rows=[r], b=[cur+delta];
  if(a.funded){ const f=nodeRow(a.funded); if(delta>dot(f,w)+1e-12) throw new Error('Funding node has only '+pct(dot(f,w))+' to give'); rows.push(f); b.push(dot(f,w)-delta);
    ['Equity','Fixed Income','Real Assets'].forEach(t=>{const tr=nodeRow(t); if(!tr.some((x,i)=>x&&r[i])&&!tr.some((x,i)=>x&&f[i])){rows.push(tr);b.push(dot(tr,w));}}); }
  if(cur+delta<-1e-12) throw new Error('Cannot reduce '+a.node+' below zero');
  rows.push(w.map(()=>1)); b.push(1);
  const zero=[]; // active set: funds that would go negative are pinned at zero and the problem re-solved
  for(let it=0; it<30; it++){
    const R2=rows.concat(zero.map(i=>w.map((_,j)=>j===i?1:0))), B2=b.concat(zero.map(()=>0));
    const k=independent(R2); const A=k.map(i=>R2[i]), bb=k.map(i=>B2[i]);
    const K=A.map(x=>A.map(y=>dot(x,y))), res=bb.map((v,i)=>v-dot(A[i],w)), lam=solveSym(K,res); if(!lam) throw new Error('Could not solve this combination');
    const out=w.map((x,j)=>x+A.reduce((s,row,i)=>s+row[j]*lam[i],0));
    const neg=out.map((x,i)=>x<-1e-10&&!zero.includes(i)?i:-1).filter(i=>i>=0);
    if(!neg.length){ return out.map(x=>Math.max(0,x)); } zero.push(...neg);
  }
  throw new Error('Not achievable with long-only weights'); }
function teOf(w,n){ const C=M.cov, d=w.map((x,i)=>x-n[i]); return Math.sqrt(Math.max(0,d.reduce((s,di,i)=>s+di*C[i].reduce((t,c,j)=>t+c*d[j],0),0))); }
function adjustPanel(v){

  <div style="margin-top:10px">${state.adj.map(a=>`<span class="chip info" style="margin:2px">${esc(a.node)} ${a.mode==='absolute'?'= '+pct(a.value):(a.value>=0?'+':'')+(a.value*100).toFixed(2)+'pp'}${a.funded?' from '+esc(a.funded):''}</span>`).join('')||'<span class="muted small">No adjustments yet.</span>'}</div>

   <div><div class="kpi"><div class="l">Tracking error vs glide path (indicative)</div><div class="v">${pct(te,2)}</div><div class="s">${(used*100).toFixed(0)}% of ${pct(x.risk_budget,2)} budget</div></div>${rbBar(used)}

function glideChart(){
  const el=$('#glideChart'); if(!el) return; const W=el.clientWidth||900,H=330,m={l:44,r:16,t:10,b:44};
  const grp=[['Equity',P.groups.equity,'--s1'],['Real assets',P.groups.real_assets,'--s2'],['Fixed income',P.groups.fixed_income,'--s3'],['Cash',['cash'],'--s4']];
  const an=[...P.anchors].sort((a,b)=>a[0]-b[0]); const ys=[]; for(let y=45;y>=-7;y-=0.5) ys.push(y);
  const interp=(y)=>{const yy=Math.max(an[0][0],Math.min(an[an.length-1][0],y));let i=0;while(i<an.length-2&&an[i+1][0]<yy)i++;const a=an[i],b=an[i+1];const t=(yy-a[0])/((b[0]-a[0])||1);return P.assets.map((_,j)=>(a[j+1]+(b[j+1]-a[j+1])*t)/100)};
  const comp=y=>{const w=interp(y);return grp.map(g=>g[1].reduce((s,a)=>s+w[P.assets.indexOf(a)],0))};
  const X=y=>m.l+(45-y)/(52)*(W-m.l-m.r), Y=v=>m.t+(1-v)*(H-m.t-m.b);
  let svg=`<svg width="${W}" height="${H}" role="img" aria-label="Glide path stacked area chart">`;
  for(const g of [0,.25,.5,.75,1]) svg+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${m.l-6}" y="${Y(g)+4}" text-anchor="end">${g*100}%</text>`;
  for(const t of [40,30,20,10,0,-7]) svg+=`<text x="${X(t)}" y="${H-m.b+16}" text-anchor="middle">${t}</text>`;
  svg+=`<text x="${(W)/2}" y="${H-1}" text-anchor="middle">Years to target date</text>`;
  const C=ys.map(comp); let base=ys.map(()=>0);
  grp.forEach((g,gi)=>{const top=base.map((b,i)=>b+C[i][gi]);
    const d='M'+ys.map((y,i)=>`${X(y)},${Y(top[i])}`).join('L')+'L'+[...ys].reverse().map((y,i)=>`${X(y)},${Y(base[ys.length-1-i])}`).join('L')+'Z';
    svg+=`<path d="${d}" fill="var(${g[2]})" stroke="var(--surface)" stroke-width="2"/>`; base=top;});
  VINT.forEach(v=>{const y=R.vintages[v].years_to_target, eq=R.vintages[v].equity_neutral;svg+=`<circle cx="${X(y)}" cy="${Y(eq)}" r="5" fill="var(--surface)" stroke="var(--text)" stroke-width="2"/><text x="${X(y)}" y="${Y(eq)-9}" text-anchor="middle" style="fill:var(--text);font-weight:600">${v}</text>`});
  svg+=`<line id="gx" y1="${m.t}" y2="${H-m.b}" stroke="var(--text-2)" stroke-dasharray="3 3" style="display:none"/><rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent" id="ghit"/></svg><div class="tip" id="gtip"></div>`;
  el.innerHTML=svg; const hit=el.querySelector('#ghit'),tip=el.querySelector('#gtip'),gx=el.querySelector('#gx');
  hit.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect();const px=e.clientX-r.left;const y=Math.round((45-(px-m.l)/(W-m.l-m.r)*52)*2)/2;const c=comp(y);
    gx.setAttribute('x1',X(y));gx.setAttribute('x2',X(y));gx.style.display='';tip.style.display='block';tip.style.left=Math.min(px+12,W-170)+'px';tip.style.top='20px';
    tip.innerHTML=`<b>${y} yrs to target</b>${grp.map((g,i)=>`<div><i style="display:inline-block;width:8px;height:8px;background:var(${g[2]});border-radius:2px;margin-right:6px"></i>${g[0]}: ${pct(c[i])}</div>`).join('')}`});
  hit.addEventListener('mouseleave',()=>{tip.style.display='none';gx.style.display='none'});
}
function activeChart(){
  const el=$('#activeChart'); if(!el) return; const x=R.vintages[state.vintage];
  const rows=P.assets.map(a=>({a,d:x.final[a]-x.neutral[a],n:x.neutral[a],f:x.final[a]})).sort((p,q)=>q.d-p.d);
  const W=el.clientWidth||520,rh=22,H=rows.length*rh+20,lw=205,max=Math.max(0.03,...rows.map(r=>Math.abs(r.d)));
  const cx=lw+(W-lw-10)/2, S=v=>v/max*((W-lw-10)/2);
  let svg=`<svg width="${W}" height="${H}" role="img" aria-label="Active weights bar chart"><line x1="${cx}" x2="${cx}" y1="0" y2="${H-14}" stroke="var(--mid)"/>`;
  rows.forEach((r,i)=>{const y=i*rh+4,w=Math.abs(S(r.d)),x0=r.d>=0?cx:cx-w;
    svg+=`<text x="${lw-8}" y="${y+12}" text-anchor="end" style="fill:var(--text-2)">${esc(nm(r.a))}</text><rect x="${x0}" y="${y+2}" width="${Math.max(w,1)}" height="14" rx="4" fill="var(${r.d>=0?'--pos':'--neg'})"/>
    <rect x="${lw}" y="${y}" width="${W-lw}" height="${rh}" fill="transparent" data-i="${i}" class="ah"/>`});
  svg+=`<text x="${cx}" y="${H-2}" text-anchor="middle">0</text><text x="${W-10}" y="${H-2}" text-anchor="end">${pp(max)}</text><text x="${lw}" y="${H-2}">${pp(-max)}</text></svg><div class="tip" id="atip"></div>`;
  el.innerHTML=svg; const tip=el.querySelector('#atip');
  el.querySelectorAll('.ah').forEach(h=>{h.addEventListener('mousemove',e=>{const r=rows[+h.dataset.i],b=el.getBoundingClientRect();tip.style.display='block';tip.style.left=Math.min(e.clientX-b.left+12,W-170)+'px';tip.style.top=(e.clientY-b.top+10)+'px';tip.innerHTML=`<b>${esc(nm(r.a))}</b>Glide path ${pct(r.n)}<br>Proposed ${pct(r.f)}<br>Active ${pp(r.d)}`});h.addEventListener('mouseleave',()=>tip.style.display='none')});
}

function lineChart(el, opt){
  // opt: {x:[labels], series:[{name,color,dash,values,meta}], fmt, H}
  if(!el) return; const W=el.clientWidth||560,H=opt.H||260,m={l:52,r:14,t:10,b:30};
  const all=opt.series.flatMap(s=>s.values).filter(v=>v!=null&&!isNaN(v)); if(!all.length){el.innerHTML='<div class="muted small">No data.</div>';return}
  let lo=Math.min(...all,opt.zero?0:Infinity),hi=Math.max(...all,opt.zero?0:-Infinity); if(hi-lo<1e-9){hi+=Math.abs(hi)*0.1+1e-3;lo-=Math.abs(lo)*0.1+1e-3}
  const raw=(hi-lo)/4, mag=Math.pow(10,Math.floor(Math.log10(raw))), stp=[1,2,2.5,5,10].map(k=>k*mag).find(k=>k>=raw)||raw; lo=Math.floor(lo/stp)*stp; hi=Math.ceil(hi/stp)*stp; const nt=Math.round((hi-lo)/stp);
  const n=opt.x.length, X=i=>m.l+(n<=1?0.5:i/(n-1))*(W-m.l-m.r), Y=v=>m.t+(1-(v-lo)/(hi-lo))*(H-m.t-m.b);
  let svg=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(opt.label||'line chart')}">`;
  for(let g=0;g<=nt;g++){const v=lo+stp*g;svg+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${opt.fmt(v,stp)}</text>`}
  if(lo<0&&hi>0) svg+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mid)"/>`;
  const step=Math.ceil(n/8); opt.x.forEach((l,i)=>{if((i%step===0&&(n-1-i>=step||i===0))||i===n-1) svg+=`<text x="${X(i)}" y="${H-m.b+16}" text-anchor="${n>1&&i===n-1?'end':n>1&&i===0?'start':'middle'}">${esc(l)}</text>`});
  opt.series.forEach(s=>{const pts=s.values.map((v,i)=>v==null?null:`${X(i)},${Y(v)}`).filter(Boolean);
    svg+=`<polyline points="${pts.join(' ')}" fill="none" stroke="var(${s.color})" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round"/>`;
    if(n<=20) s.values.forEach((v,i)=>{if(v!=null) svg+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${s.dash?2.5:3.5}" fill="var(${s.color})" stroke="var(--surface)" stroke-width="1.5"/>`});});
  svg+=`<line class="cx" y1="${m.t}" y2="${H-m.b}" stroke="var(--text-2)" stroke-dasharray="3 3" style="display:none"/><rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent" class="hit"/></svg><div class="tip"></div>`;
  el.innerHTML=svg; const hit=el.querySelector('.hit'),tip=el.querySelector('.tip'),cx=el.querySelector('.cx');
  hit.addEventListener('mousemove',e=>{const b=el.getBoundingClientRect();const px=e.clientX-b.left;const i=Math.max(0,Math.min(n-1,Math.round((px-m.l)/((W-m.l-m.r)||1)*(n-1))));
    cx.setAttribute('x1',X(i));cx.setAttribute('x2',X(i));cx.style.display='';tip.style.display='block';tip.style.left=Math.min(X(i)+12,W-220)+'px';tip.style.top='14px';
    tip.innerHTML=`<b>${esc(opt.x[i])}</b>${opt.series.map(s=>`<div><i style="display:inline-block;width:8px;height:8px;background:var(${s.color});border-radius:2px;margin-right:6px"></i>${esc(s.name)}: ${s.values[i]==null?'—':opt.fmt(s.values[i])}</div>`).join('')}${opt.foot?`<div class="small muted" style="margin-top:4px">${esc(opt.foot(i))}</div>`:''}`});
  hit.addEventListener('mouseleave',()=>{tip.style.display='none';cx.style.display='none'});
}

function ladder(){
  const el=$('#ladder'); if(!el||!RK) return; const v=String(state.vintage); const S=RK.stress.hypothetical; const cols=['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
  const series=S.map((h,i)=>({name:h.name,color:cols[i%8],values:h.levels.map(l=>l.vintages[v][state.stView])}));
  $('#ladderLegend').innerHTML=legendHtml(series.map(s=>[s.name,s.color]));
  lineChart(el,{x:RM.severities.map(s=>`${s.label} ${s.k}σ`),series,fmt:(x,ax)=>(x>=0?'+':'')+(x*100).toFixed(ax?(ax*100<1?1:0):1)+'%',zero:true,label:'Stress severity ladder'});
}
function solve(A,b){const n=b.length,M=A.map((r,i)=>[...r,b[i]]);for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;[M[i],M[p]]=[M[p],M[i]];const d=M[i][i]||1e-12;for(let r=0;r<n;r++){if(r===i)continue;const f=M[r][i]/d;for(let c=i;c<=n;c++)M[r][c]-=f*M[i][c]}}return M.map((r,i)=>r[n]/(r[i]||1e-12))}
function customScenario(){
  const ids=RM.factors.map(f=>f.id), ch=RM.characteristics; const shocks={};
  RM.drivers.forEach(d=>{const val=+(state.custom[d.factor]||0); if(!val) return;
    shocks[d.factor]= d.unit==='pct'? val/100 : (d.sign||1)*(d.spread?ch.spread_duration[d.duration_of]:ch.eff_duration[d.duration_of])*val/1e4;});
  const S=Object.keys(shocks).map(k=>ids.indexOf(k)); const f=ids.map(()=>0); S.forEach((i,j)=>f[i]=shocks[ids[i]]);
  if(S.length&&state.prop==='correlated'&&S.length<ids.length){const Fss=S.map(i=>S.map(j=>RM.F[i][j]));const x=solve(Fss,S.map(i=>f[i]));
    ids.forEach((_,o)=>{if(S.includes(o))return; f[o]=S.reduce((s,i,j)=>s+RM.F[o][i]*x[j],0)})}
  const r=RM.B.map(row=>dot(row,f)); return {f,r};
}
function customOut(){

function md(src){const out=[];const lines=src.split('\n');let i=0;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  while(i<lines.length){const l=lines[i];
    if(/^#{1,4} /.test(l)){const n=l.match(/^#+/)[0].length;out.push(`<h${n}>${inl(l.slice(n+1))}</h${n}>`);i++;continue}
    if(l.startsWith('|')){const t=[];while(i<lines.length&&lines[i].startsWith('|')){t.push(lines[i]);i++}const cells=r=>r.split('|').slice(1,-1).map(c=>c.trim());
      out.push('<table><tr>'+cells(t[0]).map(c=>`<th>${inl(c)}</th>`).join('')+'</tr>'+t.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</table>');continue}
    if(l.startsWith('- ')){const t=[];while(i<lines.length&&lines[i].startsWith('- ')){t.push(`<li>${inl(lines[i].slice(2))}</li>`);i++}out.push('<ul>'+t.join('')+'</ul>');continue}
    if(l.startsWith('> ')){out.push(`<blockquote>${inl(l.slice(2))}</blockquote>`);i++;continue}
    if(l.trim()){out.push(`<p>${inl(l)}</p>`)}i++}
  return out.join('')}

  return `<div class="dr-item ${human?'human':''}"><div class="small"><span class="mono">${esc(r.step)}</span> · ${esc((r.actor||{}).id||'')} ${human?'<span class="chip info">human</span>':`<span class="muted">${esc((r.actor||{}).model||(r.actor||{}).kind||'')}</span>`} · <span class="muted">${esc((r.created_at||'').slice(0,19).replace('T',' '))}</span></div>
  <div>${esc(r.summary||'')}</div>${r.rationale?`<details><summary class="small">Rationale</summary><div class="why small">${esc(r.rationale)}</div></details>`:''}
  <div class="small muted mono">${esc(r.dr_id)} · hash ${esc((r.record_hash||'').slice(0,12))}… ${canOpen?`<a href="#" data-why-open="${esc(r.dr_id)}">open in ledger</a>`:''}</div></div>`}
function openWhy(topic,v,asset){
  const {own,ctx}=whyRecords(topic,v,asset);
  const title={proposal:`Why this proposal for ${v}?`,compliance:`Compliance for ${v}: what was checked and who decided`,cma:`Capital market assumption: ${nm(asset)}`,risk:`Risk for ${v}`}[topic];
  let m=$('#whyModal'); if(!m){m=document.createElement('div');m.id='whyModal';document.body.appendChild(m);m.onclick=e=>{if(e.target===m)m.style.display='none'}}
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div style="display:flex;align-items:center"><h2 style="margin:0;flex:1">${esc(title)}</h2><button class="btn" id="whyClose">Close</button></div>
  <p class="small muted">From the hash-chained decision ledger of run ${esc(R.run_id)}${LIVE?' and the governance ledger':''}. Blue = a person's decision; grey = an agent or the system.</p>
  <h3>Records for this item (${own.length})</h3>${own.map(drItem).join('')||'<div class="muted small">None</div>'}
  <details ${own.length?'':'open'}><summary><b>Inputs shared by the whole run (${ctx.length})</b></summary>${ctx.map(drItem).join('')}</details></div>`;
  m.style.display='flex'; $('#whyClose').onclick=()=>m.style.display='none'; $('#whyClose').focus();
  m.querySelectorAll('[data-why-open]').forEach(a=>a.onclick=ev=>{ev.preventDefault();m.style.display='none';state.ledgerSel=a.dataset.whyOpen;state.tab='ledger';render()});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-why]');if(!b)return;e.preventDefault();e.stopPropagation();openWhy(b.dataset.why,b.dataset.wv?+b.dataset.wv:null,b.dataset.wa||null)},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=$('#whyModal');if(m)m.style.display='none'}});

// --------------------------------------------------------------- Changes since last run
V.changes = () => {
  const P0=LIVE&&LIVE.prev;
  if(!P0) return `<div class="card"><h2>Changes since last run</h2><p class="muted">${LIVE?'No earlier run to compare with yet. Once a second run is published, this page shows how weights, assumptions and risk moved, and why.':'Available in the hosted app, which keeps every run.'}</p></div>`;
  const d=(a,b,dg=2)=>a==null||b==null?'—':dpp(a-b);
  const rows=VINT.map(v=>{const x=R.vintages[v],o=P0.vintages[v];if(!o)return `<tr><td>${v}</td><td colspan="7" class="muted">not in previous run</td></tr>`;
    const moves=P.assets.map(a=>[a,(x.final[a]||0)-(o.final[a]||0)]).sort((p,q)=>Math.abs(q[1])-Math.abs(p[1])).slice(0,3).filter(m=>Math.abs(m[1])>=0.0005);
    return `<tr><td>${v} ${whyBtn('proposal',v)}</td><td class="num">${pct(x.equity_final)} <span class="small">(${d(x.equity_final,o.equity_final)})</span></td><td class="num">${pct(x.exp_ret)} <span class="small">(${d(x.exp_ret,o.exp_ret)})</span></td><td class="num">${pct(x.vol)} <span class="small">(${d(x.vol,o.vol)})</span></td><td class="num">${pct(x.te,2)} <span class="small">(${d(x.te,o.te)})</span></td>
    <td class="small">${o.ensemble===x.ensemble?esc(x.ensemble):`${esc(o.ensemble)} → <b>${esc(x.ensemble)}</b>`}</td><td class="small">${moves.map(([a,m])=>`${esc(nm(a))} ${dpp(m)}`).join('<br>')||'<span class="muted">no material change</span>'}</td><td>${o.status===x.compliance_summary.overall?chip(x.compliance_summary.overall):`${chip(o.status)} → ${chip(x.compliance_summary.overall)}`}</td></tr>`}).join('');
  const cm=R.cma.map(c=>[c,P0.cma[c.asset]]).filter(([c,o])=>o!=null).map(([c,o])=>[c,c.judge-o]).sort((p,q)=>Math.abs(q[1])-Math.abs(p[1]));
  return `<div class="card"><h2>Changes since last run</h2><p class="small muted">Run ${esc(R.run_id)} (as of ${esc(R.as_of)}) compared with ${esc(P0.run_id)} (as of ${esc(P0.as_of)}). Changes in brackets; "Why?" opens the records behind each proposal.</p>
  <p>Macro regime: ${P0.regime===R.macro.regime?`<b>${esc(R.macro.regime)}</b> (unchanged)`:`${esc(P0.regime)} → <b>${esc(R.macro.regime)}</b>`}</p>
  <div class="scroll"><table><tr><th>Vintage</th><th class="num">Equity</th><th class="num">E[r]</th><th class="num">Vol</th><th class="num">TE</th><th>Ensemble</th><th>Largest weight moves</th><th>Compliance</th></tr>${rows}</table></div></div>
  <div class="card" style="margin-top:14px"><h2>Capital market assumptions that moved most</h2><table><tr><th>Asset class</th><th class="num">Previous</th><th class="num">Now</th><th class="num">Change</th><th></th></tr>
  ${cm.slice(0,8).map(([c,dl])=>`<tr><td>${esc(c.name||nm(c.asset))}</td><td class="num">${pct(P0.cma[c.asset])}</td><td class="num">${pct(c.judge)}</td><td class="num">${dpp(dl)}</td><td>${whyBtn('cma',null,c.asset)}</td></tr>`).join('')}</table></div>`;
};

function excDetail(c){
  const me=LIVE.user, mine=c.owner&&[me.name,me.email].map(x=>(x||'').toLowerCase()).includes(c.owner.toLowerCase());
  const live=['open','in_progress'].includes(c.status), done=['remediated','accepted'].includes(c.status);
  const can={assign:(userHas('compliance')||userHas('risk'))&&c.status!=='closed',note:mine||['compliance','risk','portfolio_manager','leadership'].some(userHas),
    remediate:live&&(mine||userHas('compliance')||userHas('risk')),accept:live&&userHas('chief_compliance_officer'),close:done&&userHas('compliance'),reopen:c.status!=='open'&&c.status!=='in_progress'&&(userHas('compliance')||userHas('risk'))};
  const btn=(a,l)=>can[a]?`<button class="btn" data-excact="${a}">${l}</button>`:'';
  return `<div class="card" style="margin-top:14px"><h2>${esc(c.id)} · ${esc(c.title)}</h2>
  <table class="small"><tr><td>Status</td><td><b>${esc(c.status.replace('_',' '))}</b>${c.accepted_until?` until ${esc(c.accepted_until)}`:''}</td><td>Severity</td><td>${esc(c.severity)}</td></tr>
  <tr><td>Rule</td><td class="mono">${esc(c.rule_id||'—')}</td><td>Run</td><td class="mono">${esc(c.run_id||'—')}</td></tr>
  <tr><td>Owner</td><td>${esc(c.owner||'—')}</td><td>Due</td><td>${esc(c.due||'—')}</td></tr>
  <tr><td>Opened</td><td colspan="3">${esc((c.opened_at||'').slice(0,16).replace('T',' '))} by ${esc(c.opened_by.name)} (${esc(c.source)})</td></tr>
  ${c.details?`<tr><td>Details</td><td colspan="3">${esc(c.details)}</td></tr>`:''}${c.resolution?`<tr><td>Resolution</td><td colspan="3">${esc(c.resolution)}</td></tr>`:''}</table>
  ${(can.assign||can.note||can.remediate||can.accept||can.close||can.reopen)?`<h3>Act</h3>
  <div class="grid g3">${can.assign?`<div><label class="small">Owner (name or email)<input id="excOwner" value="${esc(c.owner||'')}"></label></div><div><label class="small">Due date<input id="excDue" type="date" value="${esc(c.due||'')}"></label></div>`:''}${can.accept?`<div><label class="small">Accepted until (CCO)<input id="excUntil" type="date"></label></div>`:''}</div>
  <label class="small">Note or reason (kept in the ledger)<textarea id="excNote" rows="2" placeholder="What was done, decided or agreed"></textarea></label>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${btn('assign','Assign / set due date')}${btn('note','Add note')}${btn('remediate','Mark remediated')}${btn('accept','Accept (CCO)')}${btn('close','Close')}${btn('reopen','Reopen')}</div>`:'<p class="small muted">Read-only for your role.</p>'}
  <h3>History</h3><table class="small"><tr><th>When (UTC)</th><th>Who</th><th>Action</th><th>Note</th></tr>${(c.history||[]).slice().reverse().map(h=>`<tr><td class="mono">${esc(h.at.slice(0,16).replace('T',' '))}</td><td>${esc(h.by.name)}</td><td>${esc(h.action)}${h.changes&&h.changes.status?` → ${esc(h.changes.status)}`:''}</td><td>${esc(h.note)}</td></tr>`).join('')}</table>
  <div class="small muted">Ledger records: ${(c.dr_ids||[]).map(x=>`<span class="mono">${esc(x)}</span>`).join(', ')}</div></div>`;
}

const PR = D.products || null;
const FUNDS = PR ? PR.funds : [];
const PL_LABEL = {all:'All product lines', mutual_fund:'Mutual funds', cit:'CITs'};
const VEH_SHORT = {mutual_fund:'Mutual fund', cit:'CIT'};
const GROUPS = [['Equity',P.groups.equity],['Fixed income',P.groups.fixed_income],['Real assets',P.groups.real_assets],['Cash',['cash']]];
const METH = {
  glide_path_neutral:['Glide path, no tilt','Holds the strategic glide path exactly; the benchmark the others are measured against.'],
  max_sharpe_tilt:['Best risk-adjusted return','Tilts toward the highest expected Sharpe ratio using the return assumptions.'],
  black_litterman_tilt:['Market view blend','Starts from market-implied returns and blends in the return assumptions (Black-Litterman).'],
  min_variance_tilt:['Lowest volatility','Tilts toward the lowest expected volatility; ignores return assumptions.'],
  max_diversification_tilt:['Most diversified','Tilts toward the highest diversification ratio.'],
  risk_budget_tilt:['Balanced risk','Spreads risk more evenly across asset classes.'],
  adversarial_diversifier:['Contrarian','Built to differ from the others; useful in a blend, weak on its own.']};
const FAMILY = {heuristic:'Benchmark',return_optimized:'Return-seeking',risk_structured:'Risk-focused',adversarial:'Contrarian'};
const ENS = {simple_average:'equal-weight blend of the shortlisted methods',inverse_tracking_error:'blend weighted toward methods closest to the glide path',
  sharpe_weighted:'blend weighted by expected Sharpe ratio',vote_weighted:'blend weighted by the agents\' votes',min_variance_meta:'minimum-volatility blend of the methods',
  regime_conditional:'blend chosen for the current economic regime',trimmed_mean:'trimmed-mean blend (extremes dropped)'};
const mName = k => (METH[k]||[k])[0];
const plainIds = t => String(t||'').replace(/\b([a-z]+(?:_[a-z]+)+)\b/g, m => METH[m] ? METH[m][0] : m);
const mDesc = k => (METH[k]||['',''])[1];
const ensName = k => ENS[k] ? `${esc(k.replace(/_/g,' '))} <span class="muted">(${esc(ENS[k])})</span>` : esc(k);
state.pl = 'all'; state.posMode = 'series'; state.posMeasure = 'active'; state.agSel = null; state.gpShifts = [{asset_class:'us_core_bond',from:'us_large_cap',pp:1}]; state.gpPrev = null;

function money(x){ if(x==null||isNaN(x)) return '—'; const a=Math.abs(x); return a>=1e9?'$'+(x/1e9).toFixed(2)+'bn':a>=1e6?'$'+(x/1e6).toFixed(0)+'m':'$'+Math.round(x).toLocaleString(); }
function grpW(w,assets){ return assets.reduce((s,a)=>s+((w||{})[a]||0),0); }
function plFunds(pl){ return FUNDS.filter(f=>(pl||state.pl)==='all'||f.vehicle===(pl||state.pl)); }
function vFunds(v,pl){ return plFunds(pl).filter(f=>f.vintage===v); }
function aumW(fs,key){ const t=fs.reduce((s,f)=>s+f.nav,0); if(!t) return null; const o={}; fs.forEach(f=>P.assets.forEach(a=>{o[a]=(o[a]||0)+(f[key][a]||0)*f.nav/t})); return o; }
function propW(v){ const x=R.vintages[v]; return (x.adjusted&&x.adjusted.final)||x.final; }
function seriesW(fs,fn){ const t=fs.reduce((s,f)=>s+f.nav,0); if(!t) return null; const o={}; fs.forEach(f=>{const w=fn(f); P.assets.forEach(a=>{o[a]=(o[a]||0)+(w[a]||0)*f.nav/t})}); return o; }
function plSeg(){ if(!PR) return ''; const opts=[['all','All'],['mutual_fund','Mutual funds'],['cit','CITs']];
  return `<div class="row" style="margin-bottom:10px"><span class="small muted">Product line</span><div class="vt-tabs" style="margin:0">${opts.map(([k,l])=>`<button class="${k===state.pl?'active':''}" data-pl="${k}">${l}</button>`).join('')}</div>${PR.example_data?'<span class="small muted">Holdings are example data until custodian or transfer-agent files are loaded.</span>':''}</div>`; }
function heat(x,scale){ if(x==null||Math.abs(x)<0.0005) return ''; const a=Math.min(1,Math.abs(x)/(scale||0.03)); const c=x>0?'57,135,229':'217,89,38'; return `background:rgba(${c},${(0.12+0.5*a).toFixed(2)})`; }
function kpi(l,v,s){ return `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||''}</div></div>`; }
function topMoves(w,base,n){ return P.assets.map(a=>[a,(w[a]||0)-(base[a]||0)]).filter(m=>Math.abs(m[1])>=0.0005).sort((p,q)=>Math.abs(q[1])-Math.abs(p[1])).slice(0,n||3); }
function movesText(ms){ return ms.length?ms.map(([a,d])=>`${esc(nm(a))} ${pp(d)}`).join(', '):'no material moves'; }

// approval status for a vintage's proposal
function apprNeeded(v){ const x=R.vintages[v]; return [...new Set(x.approvers.concat(x.adjusted?x.adjusted.approvers:[]))]; }
function apprStatus(v){ const need=apprNeeded(v), ds=allDecisions().filter(d=>d.vintage===v);
  const by={}; ds.forEach(d=>by[d.role]=d);
  const st = ds.some(d=>d.decision==='reject')?'rejected':ds.some(d=>d.decision==='request_changes')?'changes requested':need.every(r=>by[r]&&by[r].decision==='approve')?'approved':'pending';
  return {need, by, st, waiting: need.filter(r=>!by[r])}; }
function apprChip(st){ return `<span class="chip ${st==='approved'?'good':st==='pending'?'warn':'crit'}">${esc(st)}</span>`; }
const ROLE_NAME = {portfolio_manager:'Portfolio manager',risk:'Risk',investment_committee:'Investment Committee',chief_compliance_officer:'Chief Compliance Officer',analyst:'Analyst'};
const roleName = r => ROLE_NAME[r]||String(r).replace(/_/g,' ');

// short, plain summary of a vintage's proposal for approvers
function propSummary(v){
  const x=R.vintages[v], w=propW(v), eq=grpW(w,P.groups.equity), eqn=grpW(x.neutral,P.groups.equity);
  const r=x.risk, used=x.adjusted?x.adjusted.risk_budget_used:(r?r.used_pct:null), te=x.adjusted?x.adjusted.te:x.te;
  const fs=vFunds(v,'all');
  const prev=LIVE&&LIVE.prev&&LIVE.prev.vintages[v];
  return {equity:eq, equity_glide:eqn, tilt:eq-eqn, moves:topMoves(w,x.neutral,3), te, used, budget:x.risk_budget,
    compliance:(x.adjusted?x.adjusted.compliance_summary:x.compliance_summary).overall, funds:fs,
    vsPrev: prev?topMoves(w,prev.final,2):null, adjusted:!!x.adjusted};
}
function summaryLine(v){ const s=propSummary(v);
  return `Equity ${pct(s.equity)} (${pp(s.tilt)} vs glide path). Largest tilts: ${movesText(s.moves)}. Tracking error ${pct(s.te,2)}, ${s.used!=null?(s.used*100).toFixed(0)+'% of the '+pct(s.budget,2)+' risk budget':''}. Compliance ${esc(s.compliance)}.${s.vsPrev?` Since the last run: ${movesText(s.vsPrev)}.`:''}`; }
function fundsLine(v){ const fs=vFunds(v,'all'); return fs.length?fs.map(f=>`<span class="mono">${esc(f.id)}</span> ${VEH_SHORT[f.vehicle]} ${money(f.nav)}`).join(' · '):`MTRS-${v}`; }

// can the signed-in person record a decision in this role? PM and Risk decisions also need the Approver permission
function holdsAuth(r){ if(!LIVE) return true; const rs=LIVE.user.roles||[]; return rs.includes(r)&&(!['portfolio_manager','risk'].includes(r)||!!LIVE.is_approver); }
// items that need the signed-in person, for the home screen and the approvals queue
function attention(opts){
  opts=opts||{}; const role=ROLES[state.role], out=[];
  if(role.approverRole&&holdsAuth(role.approverRole)){ const wait=VINT.filter(v=>{const s=apprStatus(v);return s.need.includes(role.approverRole)&&!s.by[role.approverRole]});
    if(wait.length>3&&!opts.expand) out.push({kind:'Proposal',title:`${wait.length} proposals await your approval as ${roleName(role.approverRole)}`,
      detail:wait.map(v=>{const p=propSummary(v);return `${v}: equity ${pp(p.tilt)} vs glide path, ${p.used!=null?(p.used*100).toFixed(0)+'% of risk budget':''}, ${esc(p.compliance)}`}).join('<br>'),go:{tab:'approvals'}});
    else wait.forEach(v=>out.push({kind:'Proposal',title:`${v} proposal awaits your approval as ${roleName(role.approverRole)}`,detail:summaryLine(v),go:{tab:'portfolios',v}})); }
  if(LIVE){ (D.change_requests||[]).filter(c=>c.status==='pending').forEach(c=>{ const mine=c.required_approvals.filter(rl=>holdsAuth(rl)&&!c.approvals.some(a=>a.role===rl));
      if(mine.length) out.push({kind:'Risk budget',title:`Risk budget change ${c.id}: ${c.target.vintage} from ${pct(c.current,2)} to ${pct(c.proposed,2)}`,detail:`Requested by ${esc(c.requested_by.name)}: ${esc(c.reason)}. Needs your decision as ${mine.map(roleName).join(' and ')}.`,go:{tab:'riskbudget'}}); });
    if(LIVE.can_glide_decide&&PR) (PR.glide.requests||[]).filter(r=>r.status==='pending').forEach(r=>out.push({kind:'Glide path',title:`Glide-path ${r.kind==='retire'?'retirement':'change'} ${r.id} for ${esc(r.scope_label)}`,detail:`${gpShiftText(r.shifts)}. ${r.funds.length} funds. Requested by ${esc(r.requested_by.name)}: ${esc(r.reason)}.`,go:{tab:'glide'}}));
    const ex=(LIVE.exceptions||[]).filter(c=>['open','in_progress'].includes(c.status));
    if(ex.length&&role.tabs.includes('exceptions')) out.push({kind:'Exceptions',title:`${ex.length} open exception case${ex.length>1?'s':''}`,detail:ex.slice(0,3).map(c=>esc(c.title||c.rule_id||c.id)).join(' · '),go:{tab:'exceptions'}}); }
  const warn=VINT.filter(v=>{const r=R.vintages[v].risk;return r&&r.used_pct>=(r.warn_at||0.8)});
  if(warn.length&&['pm','risk','lead'].includes(state.role)) out.push({kind:'Risk budget',title:`${warn.length} vintage${warn.length>1?'s':''} at or above the risk-budget warning level`,detail:warn.map(v=>`${v}: ${(R.vintages[v].risk.used_pct*100).toFixed(0)}%`).join(' · '),go:{tab:'riskbudget'}});
  const fails=VINT.filter(v=>R.vintages[v].compliance_summary.FAIL>0);
  if(fails.length) out.push({kind:'Compliance',title:`Hard-limit failures in ${fails.join(', ')}`,detail:'A failed rule blocks approval until the proposal is adjusted.',go:{tab:role.tabs.includes('compliance')?'compliance':'portfolios',v:fails[0]}});
  return out;
}
function attentionList(items,empty){ return items.length?`<div>${items.map(i=>`<div class="att"><span class="chip info">${esc(i.kind)}</span><div><b>${i.title}</b><div class="small muted">${i.detail}</div></div>${i.go&&ROLES[state.role].tabs.includes(i.go.tab)?`<button class="btn" data-go="${i.go.tab}" data-gov="${i.go.v||''}">Open</button>`:''}</div>`).join('')}</div>`:`<div class="muted">${empty}</div>`; }

function positionSeries(){

  const ser=as=>{ if(!PR) { const vals=VINT.map(v=>val(v,as)); return vals.reduce((s,x)=>s+(x||0),0)/vals.length; }
    const t=fs.reduce((s,f)=>s+f.nav,0); return fs.reduce((s,f)=>{const x=R.vintages[f.vintage], w=propW(f.vintage);
      const d=m==='active'?grpW(w,as)-grpW(x.neutral,as):m==='weight'?grpW(w,as):grpW(f.current,as)-grpW(w,as); return s+d*f.nav/t},0); };

  const tot=fs.reduce((s,f)=>s+f.nav,0), pr=PR?seriesW(fs,f=>propW(f.vintage)):null, gl=PR?seriesW(fs,f=>R.vintages[f.vintage].neutral):null, cu=PR?aumW(fs,'current'):null;
  const big=VINT.map(v=>topMoves(propW(v),R.vintages[v].neutral,1)[0]).filter(Boolean).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0];
  const sum=PR?kpi('Assets',money(tot),`${fs.length} funds · ${PL_LABEL[state.pl]}`)+kpi('Equity, proposed',pct(grpW(pr,P.groups.equity)),`glide path ${pct(grpW(gl,P.groups.equity))} · tilt ${pp(grpW(pr,P.groups.equity)-grpW(gl,P.groups.equity))}`)

  <div class="scroll" style="max-height:none"><table><tr><th>Asset class</th>${VINT.map(v=>`<th class="num click" data-posv="${v}" style="cursor:pointer">${v}</th>`).join('')}<th class="num">Series</th></tr>${rows}</table></div></div>`;

  const nVoters=bal.length||Object.keys(x.candidates).length;
  const rows=GROUPS.map(([g,as])=>{const sub=a=>`<td class="num">${pct(grpW(x.neutral,a))}</td><td class="num"><b>${pct(grpW(w,a))}</b></td><td class="num">${dpp(grpW(w,a)-grpW(x.neutral,a))}</td>${prev?`<td class="num">${dpp(grpW(w,a)-grpW(prev.final,a))}</td>`:''}`;
    return `<tr class="lvl0"><td>${g}</td>${sub(as)}</tr>`+(as.length>1?as.map(a=>`<tr${Math.abs((w[a]||0)-(x.neutral[a]||0))>=0.01?' class="sel"':''}><td style="padding-left:18px">${esc(nm(a))}</td>${sub([a])}</tr>`).join(''):'');}).join('');
  const warnRules=(x.adjusted?[]:x.compliance).filter(r=>r.status==='WARN'||r.status==='FAIL');
  return `${vintageTabs()}
  <div class="card approve-box"><div class="row" style="justify-content:space-between"><h2 style="margin:0">What is being approved: ${v} vintage</h2>${apprChip(s.st)}</div>
    <p style="margin:8px 0">${x.adjusted?`The <b>adjusted</b> asset-class weights recorded by ${esc(x.adjusted.by)} (${esc(x.adjusted.reason)}), replacing the agents' proposal.`:`The asset-class weights below, chosen by the CIO agent using the ${ensName(x.ensemble)}.`}
    Once ${s.need.map(roleName).join(' and ')} approve, these weights become the <b>approved target</b> for ${fs.length?fs.map(f=>`<span class="mono">${esc(f.id)}</span> (${VEH_SHORT[f.vehicle]}, ${money(f.nav)})`).join(' and '):`MTRS-${v}`}.
    <b>Nothing is traded by this approval.</b> Trade lists that move a fund toward the target are built and approved separately on the Trading screen.</p>
    <div class="why">${summaryLine(v)}</div>
    ${x.glide_adjustment?`<p class="small" style="margin:8px 0 0"><span class="chip warn">Glide path ${Object.keys(x.glide_adjustment.paths||{}).length?'changed':'adjusted'}</span> ${Object.keys(x.glide_adjustment.paths||{}).length?`This vintage follows a named glide path approved by the Investment Committee (${Object.entries(x.glide_adjustment.paths).map(([l,p])=>esc(l==='cit'?'CIT':'mutual fund')+': '+esc(p)).join(', ')}); the IPS bands are checked around it. `:''}${x.glide_adjustment.ids.length?`The glide path includes the approved adjustment${x.glide_adjustment.ids.length>1?'s':''} ${x.glide_adjustment.ids.map(esc).join(', ')}. `:''}Change from the IPS glide path: ${Object.entries(x.glide_adjustment.applied).map(([a,d])=>esc(nm(a))+' '+(d>0?'+':'')+(d*100).toFixed(2)+'pp').join(', ')}. Tilts are measured from it.${x.glide_adjustment.ids.length&&!Object.keys(x.glide_adjustment.paths||{}).length?' The IPS bands are still checked against the IPS glide path.':''}${x.glide_adjustment.lines_differ?' Mutual funds and CITs have different adjustments: this proposal uses their average, and Trading adds each line\'s own difference.':''}</p>`:''}
    <div class="row" style="margin-top:10px">${s.need.map(r=>{const d=s.by[r];return `<span class="chip ${d?(d.decision==='approve'?'good':'crit'):'warn'}">${esc(roleName(r))}: ${d?esc(d.decision.replace('_',' '))+(d.name?' by '+esc(d.name):''):'waiting'}</span>`}).join('')}</div></div>
  <div class="grid g4" style="margin-top:14px">${kpi('Equity',pct(ps.equity),`glide path ${pct(ps.equity_glide)} · tilt ${pp(ps.tilt)}`)+kpi('Expected return',pct(x.exp_ret),'10-year, nominal')+kpi('Volatility',pct(x.vol),'expected, annual')+kpi('Risk budget used',ps.used!=null?(ps.used*100).toFixed(0)+'%':'—',`tracking error ${pct(ps.te,2)} of ${pct(ps.budget,2)}`)}</div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2>The weights</h2><p class="small muted">Highlighted rows move 1 percentage point or more from the glide path.${prev?' "Since last run" compares with the previous run\'s proposal.':''}</p>
      <table><tr><th>Asset class</th><th class="num">Glide path</th><th class="num">Proposed</th><th class="num">Tilt</th>${prev?'<th class="num">Since last run</th>':''}</tr>${rows}</table>
      <h3>Tilts at a glance</h3><div class="legend"><span><i style="background:var(--pos)"></i>Overweight</span><span><i style="background:var(--neg)"></i>Underweight</span></div><div class="chart" id="activeChart"></div></div>
    <div class="card"><h2>Why the agents recommend it</h2>
      <div class="why">${esc(x.rationale)}</div>
      <h3>What would change the view</h3><ul>${x.invalidation_conditions.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
      <h3>Disagreement among the agents</h3><div class="small">${Object.keys(flags).length?Object.entries(flags).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<b>${esc(mName(k))}</b> was voted weakest by ${n} of ${nVoters}`).join('; ')+'.':'None recorded.'} ${role.tabs.includes('agents')?'<a href="#" data-go="agents">See how the agents voted</a>':''}</div>
      <h3>Compliance</h3><div>${chip((x.adjusted?x.adjusted.compliance_summary:x.compliance_summary).overall)} <span class="small muted">${x.compliance_summary.PASS} pass · ${x.compliance_summary.WARN} warn · ${x.compliance_summary.FAIL} fail · ${x.compliance_summary.ATTEST} need a human attestation</span></div>
      ${warnRules.length?`<ul class="small">${warnRules.map(r=>`<li>${chip(r.status)} ${esc(r.rule_id)}: ${fmtRule(r)}</li>`).join('')}</ul>`:''}
      <h3>Evidence</h3><div class="small">Decision record <a href="#" data-dr="${dr&&dr.dr_id}" class="mono">${dr?dr.dr_id:'—'}</a> ${whyBtn('proposal',v)}</div>
    </div></div>
  <div class="card" style="margin-top:14px">${canApprove?approvalForm(v,role.approverRole):`<h2>Decision</h2><div class="small muted">${needed&&!holds?`Your account doesn't have the <b>${['portfolio_manager','risk'].includes(role.approverRole)?'Approver':esc(roleName(role.approverRole))}</b> permission, so you can review this proposal but not decide it. An admin can switch it on in User access.`:`Approval by ${s.need.map(roleName).join(' and ')}. ${role.approverRole?'':'Your workspace views this proposal; it does not approve it.'}`}</div>`}</div>`;
};

// --------------------------------------------------------------- Approval queue
V.approvals = () => {
  const role=ROLES[state.role], mine=attention({expand:true}).filter(i=>['Proposal','Risk budget','Glide path'].includes(i.kind)&&!/warning level/.test(i.title));

  <div class="grid g2" style="margin-top:14px">
   <div class="card"><h2>Risk budget changes</h2>${crs.length?`<table><tr><th>Request</th><th>Change</th><th>Why</th><th>Needs</th></tr>${crs.map(c=>`<tr class="click" data-go="riskbudget"><td class="mono small">${esc(c.id)}</td><td>${esc(c.target.vintage)}: ${pct(c.current,2)} → ${pct(c.proposed,2)}</td><td class="small">${esc(c.reason)} — ${esc(c.requested_by.name)}</td><td class="small">${c.required_approvals.filter(r=>!c.approvals.some(a=>a.role===r)).map(roleName).join(', ')}</td></tr>`).join('')}</table>`:'<div class="muted small">No pending requests.</div>'}</div>
   <div class="card"><h2>Glide-path changes</h2>${gps.length?`<table><tr><th>Request</th><th>Change</th><th>Why</th><th>Needs</th></tr>${gps.map(r=>`<tr class="click" data-go="glide"><td class="mono small">${esc(r.id)}</td><td class="small">${esc(r.scope_label)}: ${gpShiftText(r.shifts)}</td><td class="small">${esc(r.reason)} — ${esc(r.requested_by.name)}</td><td class="small">Investment Committee</td></tr>`).join('')}</table>`:`<div class="muted small">${PR?'No pending requests.':'Available in the hosted app.'}</div>`}</div></div>
  ${cmds?`<div class="card" style="margin-top:14px"><h2>Commands to record your decisions</h2><pre>${esc(cmds)}</pre></div>`:''}`;

// --------------------------------------------------------------- Glide path
function gpShiftText(sh){ return (sh||[]).map(s=>`${s.pp>0?'+':''}${(+s.pp).toFixed(2)}pp ${esc(nm(s.asset_class))} from ${esc(nm(s.from))}`).join('; '); }
V.glide = () => {
  const gs=PR?PR.glide:{adjustments:[],requests:[]}, act=(gs.adjustments||[]).filter(a=>a.status==='active'), pend=(gs.requests||[]).filter(r=>r.status==='pending'), past=(gs.requests||[]).filter(r=>r.status!=='pending').slice(-6).reverse();
  const canReq=LIVE&&LIVE.can_glide_request, canDec=LIVE&&LIVE.can_glide_decide;
  const today=PR?VINT.map(v=>{const fm=vFunds(v,'mutual_fund')[0], fc=vFunds(v,'cit')[0], x=R.vintages[v];
    const c=f=>f?`${pct(grpW(f.glide,P.groups.equity))}${f.glide_adjusted?' <span class="chip warn">adj.</span>':''}`:'—';
    return `<tr><td>${v}</td><td class="num">${x.years_to_target.toFixed(1)}</td><td class="num">${pct(x.equity_neutral)}</td><td class="num">${c(fm)}</td><td class="num">${c(fc)}</td><td class="num small">${fm?pct(grpW(fm.glide,P.groups.fixed_income)):'—'} / ${fc?pct(grpW(fc.glide,P.groups.fixed_income)):'—'}</td><td class="num small">${fm?pct(grpW(fm.glide,P.groups.real_assets)):'—'} / ${fc?pct(grpW(fc.glide,P.groups.real_assets)):'—'}</td></tr>`}).join(''):'';
  const scopeOpts=[['*','All funds'],['vehicle:mutual_fund','All mutual funds'],['vehicle:cit','All CITs']].concat(FUNDS.map(f=>[f.id,`${f.id} (${VEH_SHORT[f.vehicle]} ${f.vintage})`]));
  const aOpts=sel=>P.assets.map(a=>`<option value="${a}" ${a===sel?'selected':''}>${esc(nm(a))}</option>`).join('');
  const form=canReq?`<div class="card" style="margin-top:14px"><h2>Propose a glide-path adjustment</h2>
    <p class="small muted">Move weight between asset classes on the glide path for a set of funds. It must stay inside the IPS bands (±3pp per asset class, ±5pp total equity from the IPS glide path); anything larger needs an IPS amendment. The Investment Committee approves it, and the requester can't approve their own request.</p>
    <div class="grid g3"><div><label class="small" for="gpScope">1. Apply to</label><select id="gpScope">${scopeOpts.map(([k,l])=>`<option value="${esc(k)}">${esc(l)}</option>`).join('')}</select></div>
     <div style="grid-column:span 2">${gpVintPicker()}</div></div>
    <h3>Moves</h3>${state.gpShifts.map((s,i)=>`<div class="row" style="margin-bottom:6px"><span class="small">Move</span><input type="number" step="0.25" value="${s.pp}" data-gpi="${i}" data-gpk="pp" style="width:90px"><span class="small">pp into</span><select data-gpi="${i}" data-gpk="asset_class" style="width:auto">${aOpts(s.asset_class)}</select><span class="small">from</span><select data-gpi="${i}" data-gpk="from" style="width:auto">${aOpts(s.from)}</select>${state.gpShifts.length>1?`<button class="btn" data-gpdel="${i}">Remove</button>`:''}</div>`).join('')}
    <div class="row"><button class="btn" id="gpAdd">Add a move</button><button class="btn primary" id="gpPrev">Preview</button></div>
    <div id="gpOut">${state.gpPrev?gpPreviewHtml(state.gpPrev):''}</div></div>`
    :`<div class="card" style="margin-top:14px"><h2>Propose a glide-path adjustment</h2><p class="small muted">${LIVE?'Portfolio managers and analysts can propose adjustments here; the Investment Committee approves them.':'Available in the hosted app.'}</p></div>`;
  return `<div class="card"><h2>Strategic glide path (policy ${esc(P.id)})</h2>
  <p class="small muted">The glide path sets each vintage's long-term mix as it approaches its target date. The agents' proposals tilt around it within the IPS bands. Approved adjustments below change the glide path used for the funds in their scope.</p>
  <div class="legend">${[['Equity','--s1'],['Real assets','--s2'],['Fixed income','--s3'],['Cash','--s4']].map(([l,c])=>`<span><i style="background:var(${c})"></i>${l}</span>`).join('')}<span class="muted">· dots mark each vintage today</span></div>
  <div class="chart" id="glideChart"></div></div>
  ${PR?`<div class="card" style="margin-top:14px"><h2>Glide path today, by fund</h2><p class="small muted">Mutual funds roll down ${esc((PR.products.find(p=>p.vehicle==='mutual_fund')||{}).roll_down||'')}; CITs roll down ${esc((PR.products.find(p=>p.vehicle==='cit')||{}).roll_down||'')}, so the same vintage can sit at slightly different points on the path. "adj." marks a fund with an approved adjustment.</p>
   <table><tr><th>Vintage</th><th class="num">Yrs to target</th><th class="num">Equity, IPS (this run)</th><th class="num">Equity, mutual fund</th><th class="num">Equity, CIT</th><th class="num">Fixed income MF / CIT</th><th class="num">Real assets MF / CIT</th></tr>${today}</table></div>`:''}
  <div class="grid g2" style="margin-top:14px">
   <div class="card"><h2>Approved adjustments in force</h2>${act.length?`<table><tr><th>ID</th><th>Applies to</th><th>Moves</th><th>Approved by</th>${canReq?'<th></th>':''}</tr>${act.map(a=>`<tr><td class="mono small">${esc(a.id)}</td><td class="small">${esc(a.scope_label)} (${a.funds.length} funds)</td><td class="small">${gpShiftText(a.shifts)}</td><td class="small">${esc((a.approved_by||{}).name||'')}</td>${canReq?`<td><button class="btn" data-gpretire="${esc(a.id)}">Request removal</button></td>`:''}</tr>`).join('')}</table>`:'<div class="muted small">None. Every fund follows the IPS glide path.</div>'}</div>
   <div class="card"><h2>Requests awaiting the Investment Committee</h2>${pend.length?pend.map(r=>`<div class="att"><span class="chip warn">${esc(r.kind==='retire'?'removal':'change')}</span><div><b class="mono">${esc(r.id)}</b> ${esc(r.scope_label)} (${r.funds.length} funds)<div class="small">${gpShiftText(r.shifts)}</div><div class="small muted">${esc(r.reason)} — ${esc(r.requested_by.name)}</div>
     ${canDec?`<textarea rows="2" id="gpr-${esc(r.id)}" placeholder="Reason for your decision" style="margin:6px 0"></textarea><div class="row"><button class="btn primary" data-gpdec="approve" data-gpid="${esc(r.id)}">Approve</button><button class="btn" data-gpdec="reject" data-gpid="${esc(r.id)}">Reject</button></div>`:''}</div></div>`).join(''):'<div class="muted small">None pending.</div>'}
     ${past.length?`<h3>Recent decisions</h3><table>${past.map(r=>`<tr><td class="mono small">${esc(r.id)}</td><td class="small">${esc(r.scope_label)}: ${gpShiftText(r.shifts)}</td><td>${chip(r.status)}</td></tr>`).join('')}</table>`:''}</div></div>
  ${form}
  <p class="small muted" style="margin-top:10px">Approved adjustments apply now to the funds' glide-path (Neutral) trading targets. The agents' proposals in a run are measured against the IPS glide path shown in the run.</p>

};
function gpPreviewHtml(p){
  const rows=p.funds.map(f=>{const eqb=grpW(f.current,P.groups.equity), eqa=grpW(f.new,P.groups.equity);
    const ch=P.assets.filter(a=>Math.abs((f.new[a]||0)-(f.current[a]||0))>1e-9).map(a=>`${esc(nm(a))} ${pct(f.current[a])} → ${pct(f.new[a])}`).join('<br>');
    return `<tr><td class="mono small">${esc(f.fund_id)}</td><td class="num">${pct(eqb)} → ${pct(eqa)}</td><td class="small">${ch}</td><td>${f.ok?chip('PASS'):chip('FAIL')+'<div class="small">'+f.problems.map(esc).join('<br>')+'</div>'}</td></tr>`}).join('');
  return `<h3>Preview: ${p.funds.length} funds</h3><div class="scroll" style="max-height:340px"><table><tr><th>Fund</th><th class="num">Equity</th><th>Changes</th><th>IPS bands</th></tr>${rows}</table></div>
  ${p.ok?`<label class="small" style="margin-top:8px;display:block">Reason</label><textarea id="gpReason" rows="2" placeholder="Why this change (sent to the Investment Committee)"></textarea><div style="margin-top:8px"><button class="btn primary" id="gpSubmit">Submit for Investment Committee approval</button></div>`:'<div class="banner" style="margin-top:8px">Some funds would leave the IPS bands. Reduce the moves or narrow the funds.</div>'}`;
}

// --------------------------------------------------------------- Agent votes (plain-language)
V.agents = () => {
  const s=R.strategy_review, v=state.vintage, x=R.vintages[v];
  const vote=L.find(r=>r.step==='pc-review.borda-vote'&&r.portfolio_scope.includes('MTRS-'+v));
  const perV=`<details class="card" style="margin-top:14px"><summary><b>Vote results by vintage</b> <span class="small muted">how the votes and the metric score combined for each vintage</span></summary>${vintageTabs()}
    <p class="small muted">Each ballot gives 3, 2 and 1 points to its top three and −2 to the one it flags as weakest. The final score blends those points with a metric score (Sharpe ratio, tracking error, drawdown, diversification, compliance), weighted ${R.macro.regime==='late_cycle'||R.macro.regime==='recession'?'40/60':'50/50'} in the current regime.</p>
    <table><tr><th>#</th><th>Method</th><th class="num">Vote points</th><th class="num">Final score</th></tr>${x.ranking.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(mName(r.method))} <span class="muted small mono">${esc(r.method)}</span></td><td class="num">${r.votes>0?'+':''}${r.votes}</td><td class="num">${r.composite.toFixed(2)}</td></tr>`).join('')}</table>
    <h3>Ballots</h3><table><tr><th>Voter</th><th>Cast by</th><th>Top 3</th><th>Weakest</th></tr>${(vote?vote.output.ballots:[]).map(b=>`<tr title="${esc(b.rationale||'')}"><td>${esc(mName(b.voter))}</td><td class="small">${b.source&&b.source!=='lens'?'agent':'rule'}</td><td class="small">${b.top.map(mName).map(esc).join(', ')}</td><td class="small">${esc(mName(b.bottom_flag))}</td></tr>`).join('')}</table></details>`;
  if(!s) return `<div class="card"><h2>How the agents voted</h2><p class="small muted">This run predates the agents' strategy review; only the rule-based vote is available.</p></div>${perV}`;
  const ms=Object.keys(s.theses||{});
  const pts={}, bottom={}, top1={}; ms.forEach(k=>{pts[k]=0;bottom[k]=0;top1[k]=0});
  const agentB=Object.values(s.ballots||{}), useB=agentB.length?agentB:(vote?vote.output.ballots:[]);
  useB.forEach(b=>{b.top.forEach((t,i)=>{pts[t]=(pts[t]||0)+(3-i);if(i===0)top1[t]=(top1[t]||0)+1});pts[b.bottom_flag]=(pts[b.bottom_flag]||0)-2;bottom[b.bottom_flag]=(bottom[b.bottom_flag]||0)+1});
  const recv={}; ms.forEach(k=>recv[k]=[]); Object.entries(s.reviews||{}).forEach(([rv,d])=>(d.reviews||[]).forEach(r=>recv[r.peer]&&recv[r.peer].push({by:rv,...r})));
  const avg=k=>recv[k].length?recv[k].reduce((a,r)=>a+r.score,0)/recv[k].length:null;
  const cro={}; ((s.risk_commentary||{}).comments||[]).forEach(c=>cro[c.method]=c);
  const order=[...ms].sort((a,b)=>pts[b]-pts[a]);
  const nB=useB.length, most=order[0], weakest=[...ms].sort((a,b)=>bottom[b]-bottom[a])[0];
  const flagChip=f=>!f||f==='none'?'<span class="chip good">ok</span>':`<span class="chip ${f==='concern'?'crit':'warn'}">${esc(f)}</span>`;
  const revs=Object.entries(s.revisions||{});
  const sel=state.agSel&&ms.includes(state.agSel)?state.agSel:null;
  const story=`<ol class="story">
    <li><b>Seven methods each built a portfolio.</b> Each one's agent explained its case and its own weaknesses.</li>
    <li><b>A neutral risk officer reviewed all seven</b> and flagged ${ms.filter(k=>cro[k]&&cro[k].risk_flag!=='none').map(k=>`${esc(mName(k))} (${esc(cro[k].risk_flag)})`).join(', ')||'none'}. It does not vote.</li>
    <li><b>Each agent reviewed two others</b> and scored them 1 to 5. Average score received: ${order.map(k=>`${esc(mName(k))} ${avg(k)!=null?avg(k).toFixed(1):'—'}`).join(', ')}.</li>
    <li>${agentB.length?`<b>All seven voted</b> after reading every review${agentB.length<ms.length?` (${ms.length-agentB.length} ballot${ms.length-agentB.length>1?'s':''} fell back to a rule)`:''}.`:`<b>No agent ballots in this run</b>, so each method's rule-based lens voted. Counts below are for the ${v} vintage.`} Most support: <b>${esc(mName(most))}</b> (${pts[most]} points). Most often voted weakest: <b>${esc(mName(weakest))}</b> (${bottom[weakest]} of ${nB}).</li>
    <li><b>The top three revised their portfolios</b> in response to the reviews: ${revs.map(([k,r])=>`${esc(mName(k))}: ${esc(plainIds(r.note))}`).join('; ')||'none'}.</li>
