function rbSummaryCard(compact){
  const rows=VINT.map(v=>{const x=R.vintages[v], r=x.risk; if(!r) return ''; const warn=r.warn_at||0.8, scale=Math.max(1.2,...VINT.map(u=>(R.vintages[u].risk||{}).used_pct||0));
    const ad=x.adjusted, st=r.used_pct>1?['Over','crit']:r.used_pct>=warn?['Warning','warn']:['OK','good'];
    return `<div class="rbrow" data-rbv="${v}"><span class="rbv">${v}</span><div class="rbtrack"><div class="rbfill ${st[1]}" style="width:${Math.min(100,r.used_pct/scale*100)}%"></div><i style="left:${warn/scale*100}%" title="warning ${(warn*100).toFixed(0)}%"></i><i class="lim" style="left:${100/scale}%" title="budget"></i>${ad?`<b style="left:${Math.min(100,ad.risk_budget_used/scale*100)}%" title="with adjustment ${(ad.risk_budget_used*100).toFixed(0)}%"></b>`:''}</div><span class="num rbpct">${(r.used_pct*100).toFixed(0)}%</span>${compact?'':`<span class="small muted rbte">${pct(r.te,2)} of ${pct(r.budget,2)}</span>`}<span class="chip ${st[1]}">${st[0]}</span></div>`}).join('');
  return `<div class="card"><h2>Risk budget used across the series</h2><p class="small muted">Tracking error versus the glide path as a share of each vintage's budget. Dotted line = warning at 80%, solid line = 100% of budget${VINT.some(v=>R.vintages[v].adjusted)?'; diamond = with a recorded adjustment':''}.</p>${rows}${compact&&ROLES[state.role].tabs.includes('riskbudget')?'<button class="btn" data-go="riskbudget" style="margin-top:8px">Risk budget detail</button>':''}</div>`;
}
V.riskbudget = () => {
  const v=state.vintage, x=R.vintages[v], canReq=['pm','risk'].includes(state.role), crs=(D.change_requests||[]), pol=D.risk_budget_policy;
  const rs=VINT.map(u=>R.vintages[u].risk).filter(Boolean), used=rs.map(r=>r.used_pct), hi=Math.max(...used), hiV=VINT.find(u=>R.vintages[u].risk&&R.vintages[u].risk.used_pct===hi);
  const aum=PR?VINT.reduce((s,u)=>s+vFunds(u,'all').reduce((t,f)=>t+f.nav,0),0):0;
  const aw=PR&&aum?VINT.reduce((s,u)=>s+(R.vintages[u].risk?R.vintages[u].risk.used_pct:0)*vFunds(u,'all').reduce((t,f)=>t+f.nav,0)/aum,0):null;
  const k=kpi('Highest use',(hi*100).toFixed(0)+'%',`${hiV} vintage`)+kpi('Average use',(used.reduce((a,b)=>a+b,0)/used.length*100).toFixed(0)+'%',aw!=null?`asset-weighted ${(aw*100).toFixed(0)}%`:'across vintages')
    +kpi('At or above warning',`${used.filter(u=>u>=(pol.warn_at_pct_used||0.8)).length} of ${used.length}`,`warning at ${((pol.warn_at_pct_used||0.8)*100).toFixed(0)}% used`)+kpi('IPS hard limit',pct(pol.hard_max,2),'tracking error; budgets can be set below it');
  const assets=[...new Set(rs.flatMap(r=>r.contributors.slice(0,4).map(c=>c.asset)))];
  const mat=`<table><tr><th>Asset class</th>${VINT.map(u=>`<th class="num">${u}</th>`).join('')}</tr>${assets.map(a=>`<tr><td>${esc(nm(a))}</td>${VINT.map(u=>{const c=((R.vintages[u].risk||{}).contributors||[]).find(z=>z.asset===a);return `<td class="num" style="${c?heat(c.budget_used,0.4):''}">${c?(Math.abs(c.budget_used)<0.005?'0':(c.budget_used*100).toFixed(0))+'%':'—'}</td>`}).join('')}</tr>`).join('')}
    <tr class="lvl0"><td>Total used</td>${VINT.map(u=>`<td class="num">${R.vintages[u].risk?(R.vintages[u].risk.used_pct*100).toFixed(0)+'%':'—'}</td>`).join('')}</tr></table>`;
  const curB=x.risk_budget;
  const form=canReq?`<h3>1. Which budget</h3><select id="rbV"><option value="default">Default for vintages without their own budget</option>${VINT.map(u=>`<option value="${u}" ${u===v?'selected':''}>${u} (now ${pct(R.vintages[u].risk_budget,2)})</option>`).join('')}</select>
    <h3>2. New budget (tracking error, %)</h3><div class="row"><input id="rbTe" type="number" step="0.05" min="0.1" max="${pol.hard_max*100}" value="${(curB*100).toFixed(2)}" style="width:120px"><span class="small muted">IPS hard limit ${pct(pol.hard_max,2)}</span></div>
    <div id="rbPrev" style="margin:8px 0"></div>
    <h3>3. Why</h3><textarea id="rbReason" rows="2" placeholder="Reason for the change"></textarea>
    <div style="margin-top:8px"><button class="btn primary" id="rbGo">${LIVE?'Submit for approval':'Prepare change request'}</button></div><pre id="rbCmd" style="display:none"></pre>
    <p class="small muted">What happens next: ${D.policy.approvals.risk_budget_change.map(roleName).join(' and ')} must approve, and the requester can't approve their own request. The new budget applies to the next agent run and every risk check after approval.</p>`
    :'<p class="small muted">View only. Portfolio managers and Risk can request a budget change.</p>';
  return `<div class="grid g4">${k}</div>
  <div style="margin-top:14px">${rbSummaryCard(false)}</div>
  <div class="card" style="margin-top:14px"><h2>Where the budget goes, across the series</h2><p class="small muted">Share of each vintage's budget used by its largest contributors (the asset classes it is most tilted in). Negative values reduce active risk.</p><div class="scroll" style="max-height:none">${mat}</div></div>
  <div class="card" style="margin-top:14px"><h2>Changing how much risk is used</h2>
   <div class="grid g2"><div class="choice"><b>Use less (or more) of the budget</b><p class="small">Change the weights. This is a portfolio decision for one run: adjust the proposal on the Positioning screen, and it is re-checked against the budget and approved as usual.</p>${['pm','research'].includes(state.role)?`<button class="btn" data-goto-pos="${v}" data-posdetail="1">Adjust ${v} weights</button>`:''}</div>
    <div class="choice"><b>Change the budget itself</b><p class="small">Change the limit a vintage may use. This is a policy change that lasts until changed again, and needs two approvals.</p>${canReq?'<span class="small muted">Use the form below.</span>':''}</div></div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h2>Request a budget change</h2>${form}</div>
   <div class="card"><h2>Requests</h2>${crs.length?`<table><tr><th>Request</th><th>Change</th><th>Requested by</th><th>Status</th><th></th></tr>${crs.map(c=>{
      const mine=LIVE&&c.status==='pending'?c.required_approvals.filter(rl=>holdsAuth(rl)&&!c.approvals.some(a=>a.role===rl)):[];
      return `<tr><td class="mono small">${esc(c.id)}</td><td>${esc(c.target.vintage)}: ${pct(c.current,2)} → ${pct(c.proposed,2)}</td><td class="small">${esc(c.requested_by.name)}<br><span class="muted">${esc(c.reason)}</span></td><td>${chip(c.status)}<div class="small">${c.approvals.map(a=>esc(roleName(a.role)+': '+a.decision+' ('+a.name+')')).join('<br>')}</div><div class="small muted">${c.status==='pending'?'Waiting for '+c.required_approvals.filter(r=>!c.approvals.some(a=>a.role===r)).map(roleName).join(', '):''}</div></td>
      <td>${mine.map(rl=>`<div class="row" style="gap:4px;margin-bottom:4px"><button class="btn" data-cr="${esc(c.id)}" data-crrole="${rl}" data-crdec="approve">Approve as ${esc(roleName(rl))}</button><button class="btn" data-cr="${esc(c.id)}" data-crrole="${rl}" data-crdec="reject">Reject</button></div>`).join('')}</td></tr>`}).join('')}</table>`:'<div class="muted small">None.</div>'}</div></div>
  <div class="card" style="margin-top:14px"><h2>${v} in detail</h2>${vintageTabs()}
   <table><tr><th>Asset class</th><th class="num">Active weight</th><th class="num">Tracking-error contribution</th><th>% of budget</th></tr>${(x.risk?x.risk.contributors:[]).map(c=>`<tr><td>${esc(nm(c.asset))}</td><td class="num">${pp(c.active_weight)}</td><td class="num">${pct(c.te_contribution,3)}</td><td style="min-width:140px">${rbBar(c.budget_used)}</td></tr>`).join('')}</table></div>`;
};

  const rbPreview=()=>{if(!rbTe)return;const b=parseFloat(rbTe.value)/100;const vv=rbV.value;const list=vv==='default'?VINT.filter(x=>!(D.risk_budget_policy.vintages||{})[x]):[+vv];
    if(isNaN(b)||b<=0){$('#rbPrev').innerHTML='';return}
    const warn=D.risk_budget_policy.warn_at_pct_used||0.8, st=u=>u>1?'<span class="chip crit">over budget: the proposal would fail</span>':u>=warn?'<span class="chip warn">warning</span>':'<span class="chip good">ok</span>';
    $('#rbPrev').innerHTML=b>D.risk_budget_policy.hard_max+1e-9?'<span class="chip crit">Above the IPS hard limit: that needs an IPS amendment</span>'
      :`<table class="small"><tr><th>Vintage</th><th class="num">Budget</th><th class="num">Tracking error now</th><th class="num">Used now</th><th class="num">Used after</th><th>After the change</th></tr>${list.map(x=>{const r=R.vintages[x].risk;return `<tr><td>${x}</td><td class="num">${pct(r.budget,2)} → <b>${pct(b,2)}</b></td><td class="num">${pct(r.te,2)}</td><td class="num">${(r.used_pct*100).toFixed(0)}%</td><td class="num"><b>${(r.te/b*100).toFixed(0)}%</b></td><td>${st(r.te/b)}</td></tr>`}).join('')}</table>`};
  if(rbTe){rbTe.oninput=rbPreview;rbV.onchange=rbPreview;rbPreview();}
  const rg=$('#rbGo'); if(rg) rg.onclick=()=>{const r=$('#rbReason').value.trim();if(r.length<10){toast('Please give a reason (10+ characters).');return}
    const role=state.role==='pm'?'portfolio_manager':'risk';
    if(LIVE){ rg.disabled=true; api('/api/risk-budget/requests',{vintage:rbV.value,te:parseFloat(rbTe.value)/100,reason:r})
      .then(cr=>{toast(`Change request ${cr.id} submitted; needs ${cr.required_approvals.join(' + ')}`);setTimeout(()=>location.reload(),900)}).catch(e=>{rg.disabled=false;toast(e.message,'error')}); return; }
    const c=$('#rbCmd');c.style.display='block';
    c.textContent=`meridian risk-budget set --vintage ${rbV.value} --te ${parseFloat(rbTe.value).toFixed(2)}% --name "YOUR NAME" --role ${role} --reason "${r.replace(/"/g,"'")}"`};
  document.querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>{
    const ta=document.createElement('div'); ta.innerHTML=`<div class="card" style="position:fixed;inset:auto 20px 20px auto;z-index:9;width:360px"><b>${b.dataset.crdec==='approve'?'Approve':'Reject'} ${esc(b.dataset.cr)} as ${esc(b.dataset.crrole)}</b><textarea id="crReason" rows="3" placeholder="Reason (required)" style="margin:8px 0"></textarea><div class="row"><button class="btn primary" id="crOk">Confirm</button><button class="btn" id="crCancel">Cancel</button></div></div>`;
    document.body.appendChild(ta); $('#crCancel').onclick=()=>ta.remove();
    $('#crOk').onclick=()=>{const rs=$('#crReason').value.trim(); if(rs.length<10){toast('Please give a reason (10+ characters).');return}
      api(`/api/risk-budget/requests/${encodeURIComponent(b.dataset.cr)}/decisions`,{role:b.dataset.crrole,decision:b.dataset.crdec,reason:rs})
        .then(cr=>{toast(`${cr.id}: ${cr.status}`);setTimeout(()=>location.reload(),800)}).catch(e=>toast(e.message,'error'))}});
  const cc=$('#copyCmd'); if(cc) cc.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($('#cmd').textContent).then(()=>toast('Copied'),()=>toast('Select the text to copy'))};
}
window.addEventListener('resize',()=>{glideChart();activeChart();riskCharts()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(ROLES[h]&&allowedRoles().includes(h)&&h!==state.role){state.role=h;state.tab=null;render()}});
render();
</script>
</body>
</html>
