<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian · Trading</title>
<style>
:root{--bg:#f4f3f0;--surface:#fcfcfb;--surface-2:#f0efec;--line:#e2e0da;--line-strong:#cfccc4;--text:#0b0b0b;--text-2:#52514e;
--muted:#7a7873;--accent:#1f4e8c;--accent-ink:#fff;--ok:#1d7a46;--ok-bg:#e3f2e8;--warn:#8a5a00;--warn-bg:#fbf0d9;--crit:#a3261b;--crit-bg:#f8e1de;--info-bg:#e4ecf7;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--surface:#1a1a19;--surface-2:#232321;--line:#2e2e2b;--line-strong:#3c3c38;--text:#f0efec;
--text-2:#c3c2b7;--muted:#9a998f;--accent:#7aa7e6;--accent-ink:#0b0b0b;--ok:#6cc08c;--ok-bg:#1d2e23;--warn:#e0b25a;--warn-bg:#2f2717;--crit:#ef8a80;--crit-bg:#331d1b;--info-bg:#1d2633}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{font-size:17px;margin:0}header .sp{flex:1}a{color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:20px 24px 60px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit}
.tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg,12px);padding:16px 18px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 10px}h3{font-size:13px;margin:14px 0 6px;color:var(--text-2)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}tr.sel td{background:var(--surface-2)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;margin:1px 3px 1px 0;background:var(--surface-2);border:1px solid var(--line)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-bg);color:var(--crit);border-color:transparent}.chip.perm{background:var(--info-bg);border-color:transparent}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:var(--radius-sm,8px);cursor:pointer;font:inherit;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
label.f{display:block;font-size:12px;color:var(--text-2);margin:10px 0 4px}input[type=text],input[type=email],textarea,input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--radius-sm,8px);background:var(--surface);color:var(--text);font:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.impgrid{grid-template-columns:minmax(320px,0.8fr) 1.2fr}table.compact td,table.compact th{padding:5px 7px}table.goals td{vertical-align:middle;padding:9px 6px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 0}.opt input{margin-top:3px}.opt .d{font-size:12px;color:var(--muted)}
.switch{position:relative;width:36px;height:20px;flex:none}.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line-strong);border-radius:999px;transition:.15s}.switch span:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--accent)}.switch input:checked+span:before{transform:translateX(16px)}.switch input:focus-visible+span{outline:2px solid var(--accent)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:var(--radius-sm,8px);padding:8px 12px;margin-top:10px;font-size:13px}.warnbox ul{margin:4px 0 0 18px;padding:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--radius-sm,8px);display:none;max-width:90vw;z-index:9}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}.stage{border:1px solid var(--line);border-radius:var(--radius-lg,10px);padding:10px;min-height:120px}
.stage-h{display:flex;justify-content:space-between;align-items:center}.stage-i{display:block;margin-top:8px;padding:8px;border-radius:var(--radius-sm,8px);background:var(--surface-2,#f3f2ef);text-decoration:none;color:inherit}
.stage-i:hover{outline:2px solid var(--accent,#1f4e8c)}.bar{display:block;height:4px;background:var(--line);border-radius:2px;margin-top:6px}.bar i{display:block;height:4px;background:var(--ok,#2f8f5b);border-radius:2px}
.tg-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--radius-sm,6px)}.tg{border-collapse:separate;border-spacing:0}
.tg th,.tg td{padding:3px 4px;white-space:nowrap;border-bottom:1px solid var(--line)}.tg th{position:sticky;top:0;background:var(--surface);z-index:2;font-size:12px;line-height:1.2}
.tg .tg-sec{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;max-width:280px;overflow:hidden;text-overflow:ellipsis}.tg th.tg-sec{z-index:3}
.tg tr.tg-ac td{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--heading,var(--text));position:sticky;left:0}
.tg input{width:64px;min-height:0;height:28px;padding:3px 6px;text-align:right;border:1px solid var(--line-strong);border-radius:var(--radius-sm,4px);background:var(--surface);color:var(--text);font:inherit;font-variant-numeric:tabular-nums}
.tg input:disabled{background:transparent;border-color:transparent}.tg input::placeholder{color:var(--muted)}.tg td.tg-na{color:var(--line-strong);text-align:center}
.tg td.tg-ed{background:var(--info-bg)}.tg td.tg-x input{text-decoration:line-through}.tg tr.tg-dim td{color:var(--muted)}
.filegrid td,.filegrid th{white-space:nowrap;padding:4px 8px}
@media(max-width:1100px){.stages{grid-template-columns:1fr 1fr}}
.tg input{-moz-appearance:textfield;appearance:textfield}.tg input::-webkit-outer-spin-button,.tg input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
</style></head><body>
<style>
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}.seg button{border:0;background:var(--surface);color:var(--text);padding:6px 12px;cursor:pointer;font:inherit}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.banner{background:var(--info-bg);border-radius:var(--radius-sm,8px);padding:8px 12px;margin-bottom:14px;font-size:13px}
.kpis{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 10px}.kpis div{min-width:120px}.kpis b{display:block;font-size:16px}
select,input[type=number],input[type=date]{padding:7px 9px;border:1px solid var(--line-strong);border-radius:var(--radius-sm,8px);background:var(--surface);color:var(--text);font:inherit}
.pos{color:var(--ok)}.neg{color:var(--crit)}details summary{cursor:pointer;font-weight:600;margin:6px 0}
.sub{background:var(--surface-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.tiles.four{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line-strong);border-radius:var(--radius-lg,10px);padding:12px 14px;background:var(--surface);color:var(--text);cursor:pointer;font:inherit}
.tile:hover:not(:disabled){border-color:var(--accent)}.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--info-bg)}.tile:disabled{opacity:.55;cursor:not-allowed}
.tile input{position:absolute;opacity:0;pointer-events:none}label.tile{position:relative}
.scroll{overflow-x:auto}table.pick td{padding:5px 8px}.btn.small{padding:3px 9px;font-size:12px}.vpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px}.vchip{cursor:pointer;border:1px solid var(--line-strong,#c9c6bd);background:var(--surface,#fff);color:inherit;padding:5px 11px;border-radius:999px;font-weight:600;font-size:13px}.vchip.on{background:var(--accent,#1f4e8c);border-color:var(--accent,#1f4e8c);color:var(--accent-ink,#fff)}
.legend{display:flex;gap:14px;margin:4px 0 8px}.legend .sw{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.sw.now{background:var(--line-strong)}.sw.aft{background:var(--accent)}.sw.tgt{background:var(--text);width:3px;height:12px}.sw.gp{border-left:2px dashed var(--ok);width:3px;height:12px;background:none}
.mixrow{display:flex;align-items:center;gap:8px;padding:4px 0}.mixrow .lbl{width:150px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mixrow .v{width:120px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.mixtrack{position:relative;flex:1;height:18px}.mixtrack .now{position:absolute;top:1px;left:0;height:7px;background:var(--line-strong);border-radius:3px}.mixtrack .aft{position:absolute;top:10px;left:0;height:7px;background:var(--accent);border-radius:3px}
.mixtrack i{position:absolute;top:-2px;bottom:-2px;margin-left:-1px}.mixtrack i.tgt{border-left:2px solid var(--text)}.mixtrack i.gp{border-left:2px dashed var(--ok)}
.gapbar{position:relative;height:12px;margin-bottom:2px}.gapbar i{position:absolute;top:0;left:0;height:5px;background:var(--line-strong);border-radius:3px}.gapbar b{position:absolute;top:6px;left:0;height:5px;background:var(--accent);border-radius:3px}
tr.grp td{font-weight:600;background:var(--surface-2)}
</style>
</head><body>
<header><h1>Trading</h1><span class="muted small" id="who"></span><span class="sp"></span>
<span class="seg" id="veh" role="group" aria-label="Fund vehicle"><button data-v="all" class="on">All funds</button><button data-v="mutual_fund">Mutual funds</button><button data-v="cit">CITs</button></span>
</header>
<main>
<div class="banner"><b>Shadow mode.</b> Meridian proposes, checks and records orders and produces the Charles River import file. Nothing is sent or executed. Positions, prices and NAVs are <b>example data</b> until custodian and transfer-agent files are connected.</div>
<div class="tabs" role="tablist">
  <button data-tab="trade" class="active">New trade</button><button data-tab="trades">Trade lists</button><button data-tab="progress">In progress</button><button data-tab="files">Files</button><button data-tab="funds">Funds &amp; securities</button><button data-tab="cashflows">Cashflows</button><button data-tab="bulk">Glide path &amp; bulk changes</button><button data-tab="tilts">Tilts</button><button data-tab="settings">Routing &amp; settings</button>
</div>
<section id="trade"></section><section id="funds" hidden></section><section id="cashflows" hidden></section><section id="trades" hidden></section><section id="progress" hidden></section><section id="files" hidden></section><section id="bulk" hidden></section><section id="tilts" hidden></section><section id="settings" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const BOOT = /*BOOT*/null;
const S = {veh: sessionStorage.getItem('tr_veh')||'all', tab: sessionStorage.getItem('tr_tab')||'', st: null, fund: null, fd: null, tl: null, tlView: 'impact', editW: null};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const usd = (v, d=0) => (v<0?'−':'')+'$'+Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const musd = v => usd(v/1e6, 1)+'m';
const pct = (v, d=2) => (v*100).toFixed(d)+'%';
const sgn = v => v>0?'pos':v<0?'neg':'';
function toast(m,type){if(window.MUI) MUI.toast(m,type); else {const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',5000)}}
async function api(method, url, body, raw){
  const opt = {method, headers: {'X-CSRF-Token':BOOT.csrf}};
  if (raw) opt.body = raw; else if (body) { opt.headers['Content-Type']='application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt); const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(typeof j.detail==='string' ? j.detail : r.statusText);
  return j;
}
const localDate = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const funds = () => S.st.funds.filter(f => S.veh==='all' || f.vehicle===S.veh);
const fundIds = () => new Set(funds().map(f=>f.id));
const vname = v => ({mutual_fund:'Mutual fund', cit:'CIT'})[v]||v;
const chip = (t, cls='') => `<span class="chip ${cls}">${esc(t)}</span>`;
const statusChip = s => ({held:chip('Held','ok'), no_target:chip('Held · no target','warn'), candidate:chip('Not held · candidate','perm'), not_held:chip('Not held')})[s]||chip(s);
const tlChip = s => ({draft:chip('Draft','warn'), approved:chip('Approved','ok'), exported:chip('Exported for Charles River','perm'), cancelled:chip('Cancelled','crit'), filled:chip('Filled and booked','ok')})[s]||chip(s);
const compChip = c => c.status.startsWith('PASS') ? chip(c.status,'ok') : c.status==='WARN' ? chip('WARN','warn') : c.status==='FAIL' ? chip('FAIL','crit') : chip(c.status);

async function load(){ S.st = await api('GET','/api/trading/state'); if(!S.tab) S.tab = BOOT.can_prepare ? 'trade' : 'trades'; render(); }
function render(){
  document.querySelectorAll('#veh button').forEach(b=>b.classList.toggle('on', b.dataset.v===S.veh));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===S.tab));
  for (const t of ['trade','funds','cashflows','trades','progress','files','bulk','tilts','settings']) $('#'+t).hidden = t!==S.tab;
  ({trade:vTrade, funds:vFunds, cashflows:vCashflows, trades:vTrades, progress:vProgress, files:vFiles, bulk:vBulk, tilts:vTilts, settings:vSettings})[S.tab]();
}

// ------------------------------------------------------------------ Funds & securities
function vFunds(){
  const fs = funds();
  const nav = fs.reduce((a,f)=>a+f.nav,0);
  let h = `<div class="card"><h2>Funds (${fs.length})</h2><div class="kpis"><div><span class="muted small">Total NAV</span><b>${musd(nav)}</b></div><div><span class="muted small">Positions as of</span><b>${esc(S.st.as_of)}</b></div><div><span class="muted small">Cash buffer (series)</span><b>${S.st.settings.buffer_bps} bp</b></div></div>
  <table><thead><tr><th>Fund</th><th>Vehicle</th><th>Product line</th><th class="n">NAV</th><th class="n">Cash</th><th>Roll-down</th><th class="n">Buffer</th><th>Strategic table</th><th>Regulations</th><th>Positions</th></tr></thead><tbody>`;
  for (const f of fs) h += `<tr class="click ${S.fund===f.id?'sel':''}" data-fund="${f.id}"><td><b>${f.id}</b> <span class="muted small">${f.account}</span></td><td>${vname(f.vehicle)}</td><td>${esc(f.product_name)}</td><td class="n">${musd(f.nav)}</td><td class="n">${musd(f.cash)}</td><td>${f.roll_down}</td><td class="n">${f.buffer_bps} bp</td><td>${f.strategic_follows?'Follows glide path':chip('Custom','perm')}${f.glide_adjusted?' '+chip('Glide path adjusted','perm'):''}</td><td>${(f.regulations||[]).map(r=>chip(r,'ok')).join(' ')||'<span class="small muted">—</span>'}</td><td class="small">${f.positions_source.startsWith('Example')?'<span class="muted">Example</span>':esc(f.positions_source.split(' (')[0])+'<br><span class="muted">'+esc(f.positions_as_of)+'</span>'}</td></tr>`;
  h += `</tbody></table></div>`;
  if (BOOT.can_approve) h += `<div class="card"><h2>Load positions (holdings at last close)</h2><p class="small muted">Excel or CSV from the custodian or transfer agent with <span class="mono">as_of, fund_id (or account), security_id (or CUSIP; CASH for cash), quantity and price, or market_value</span>. It replaces the example holdings of every fund in the file; any bad row stops the load. Fills you record on exported trade lists also update positions.</p>
   <input type="file" id="posFile" accept=".xlsx,.xlsm,.csv"> <button class="btn primary" id="posUpload">Upload positions</button> <a href="/api/trading/positions/template.csv">CSV template</a></div>`;
  h += `<div id="fundDetail"></div>`;
  $('#funds').innerHTML = h;
  if ($('#posUpload')) $('#posUpload').onclick = async()=>{const f=$('#posFile').files[0]; if(!f) return toast('Choose a file first'); const fd=new FormData(); fd.append('file', f);
    try{const r=await api('POST','/api/trading/positions/upload',null,fd); await load(); toast(`Positions loaded for ${r.funds.length} funds and recorded`)}catch(e){toast(e.message,'error')}};
  document.querySelectorAll('[data-fund]').forEach(tr=>tr.onclick=()=>openFund(tr.dataset.fund));
  if (S.fund && fundIds().has(S.fund)) openFund(S.fund, true);
}
async function openFund(id, keep){
  S.fund = id; if(!keep) { S.editW = null; S.tk = null; }
  document.querySelectorAll('[data-fund]').forEach(tr=>tr.classList.toggle('sel', tr.dataset.fund===id));
  const d = S.fd = await api('GET', '/api/trading/funds/'+id);
  const held = d.rows.filter(r=>r.status==='held'||r.status==='no_target'), other = d.rows.filter(r=>!(r.status==='held'||r.status==='no_target'));
  const head = `<tr><th>Security</th><th>Type</th><th>Asset class</th><th>Status</th><th class="n">Value</th><th class="n">Weight</th><th class="n">Previous close</th><th class="n">Neutral</th><th class="n">Strategic</th><th class="n">Approved proposal</th></tr>`;
  const row = r => `<tr><td><b>${esc(r.instrument)}</b><br><span class="small muted">${esc(r.name)}</span>${r.note?`<br><span class="small">${esc(r.note)}</span>`:''}</td><td>${esc(r.type)}</td><td>${esc(r.asset_class)}</td><td>${statusChip(r.status)}${r.excluded?chip('Excluded from trading','crit'):''}${r.exiting?chip('Exiting','crit'):''}${r.tilt_bps?chip('Tilt '+(r.tilt_bps>0?'+':'')+r.tilt_bps+' bp','perm'):''}</td><td class="n">${r.value?musd(r.value):'—'}</td><td class="n">${r.value?pct(r.weight):'—'}</td><td class="n">${r.t_previous_close?pct(r.t_previous_close):'—'}</td><td class="n">${r.t_neutral?pct(r.t_neutral):'—'}</td><td class="n">${r.t_strategic?pct(r.t_strategic):'—'}</td><td class="n">${r.t_approved?pct(r.t_approved):'—'}</td></tr>`;
  const f = d.fund;
  let h = `<div class="card"><h2>${f.id} · ${esc(f.product_name)} ${f.vintage}</h2>
  <div class="kpis"><div><span class="muted small">Vehicle</span><b>${vname(f.vehicle)}</b></div><div><span class="muted small">NAV</span><b>${musd(d.nav)}</b></div><div><span class="muted small">Uninvested cash</span><b>${musd(d.cash)}</b></div><div><span class="muted small">Glide-path roll-down</span><b>${f.roll_down}</b></div><div><span class="muted small">Account (Charles River)</span><b>${f.account}</b></div></div>
  <p class="small muted">${esc(d.positions_source)} · as of ${esc(d.as_of)}. A security with no target is never part of cash allocation. Target columns are the three allocation tables before tilts; tilts and exits are applied when trades are generated.</p>
  ${d.approved&&d.approved.source?`<p class="small"><b>Approved proposal</b> from ${esc(d.approved.source)}${Object.keys(d.approved.line_adjustment_pp||{}).length?`, plus this ${vname(f.vehicle).toLowerCase()} line's own approved glide-path adjustment not already in the run: ${Object.entries(d.approved.line_adjustment_pp).map(([a,x])=>esc(acName(a))+' '+(x>0?'+':'')+x.toFixed(2)+'pp').join(', ')}`:''}.</p>`:''}
  <h3>Held securities</h3><table>${head}${held.map(row).join('')}</table>
  <h3>Not held: candidates and available securities</h3><table>${head}${other.map(row).join('')||'<tr><td colspan=9 class="muted">None</td></tr>'}</table></div>`;
  if (BOOT.can_prepare) h += `<div class="card row" style="justify-content:space-between"><span><b>Trade in ${f.id}</b><br><span class="small muted">Buy or sell specific securities, or exit a position, with the impact shown before you save.</span></span><span class="row"><button class="btn primary" id="fdTrade">Trade a security</button><button class="btn" id="fdExit">Exit a position</button></span></div>`;
  h += strategicEditor(d);
  $('#fundDetail').innerHTML = h;
  bindStrategic(d);
  const go = task => { S.nt = {...S.nt, task, fund:f.id, fd:d, orders:[], prev:null, q:''}; S.tab='trade'; sessionStorage.setItem('tr_tab','trade'); render(); window.scrollTo(0,0); };
  if ($('#fdTrade')) $('#fdTrade').onclick = ()=>go('security');
  if ($('#fdExit')) $('#fdExit').onclick = ()=>go('exit');
}
function strategicEditor(d){
  const st = d.strategic, can = BOOT.can_approve;
  const rows = d.rows.filter(r=>r.status!=='no_target');

  h += `<div class="card"><h2>Coming up: dates with open orders</h2><table><tr><th>Date</th><th class="n">Open orders</th><th class="n">Buys</th><th class="n">Sells</th><th>Trade lists</th></tr>${d.upcoming.filter(u=>u.lists.some(inVeh)).map(u=>`<tr><td>${u.date}${u.date<S.st.as_of?' '+chip('Past due','crit'):''}</td><td class="n">${u.orders}</td><td class="n">${usd(u.buys)}</td><td class="n">${usd(u.sells)}</td><td>${u.lists.map(esc).join(', ')}</td></tr>`).join('')||'<tr><td colspan=5 class="muted">Nothing open</td></tr>'}</table></div>`;

  h += `<div class="card"><h2>Orders (${open.length} open)</h2><div class="row"><input type="search" id="pq" placeholder="Filter by security, fund or list" value="${esc(qs)}" style="max-width:280px"><select id="pst"><option value="open" ${ost==='open'?'selected':''}>Open only</option><option value="all" ${ost==='all'?'selected':''}>Include filled and cancelled</option></select></div>
  <table><tr><th>Date</th><th>Order ID</th><th>Fund</th><th>Security</th><th>Side</th><th class="n">Quantity</th><th class="n">Filled</th><th class="n">Est. amount</th><th>Destination</th><th>Status</th></tr>${rows.slice(0,400).map(o=>`<tr><td>${o.date}</td><td class="mono small"><a href="#" data-gotl="${o.trade_list}">${esc(o.order_id)}</a>${o.tranche?'<br><span class="muted">tranche '+o.tranche+'</span>':''}</td><td>${esc(o.fund_id)}</td><td>${esc(o.instrument)}</td><td class="${o.side==='BUY'?'pos':'neg'}">${o.side}</td><td class="n">${o.quantity.toLocaleString('en-US')}</td><td class="n">${o.filled?o.filled.toLocaleString('en-US'):'—'}</td><td class="n">${usd(o.est_amount)}</td><td class="small">${esc(o.route)}</td><td>${chip(o.status.replace('_',' '), o.status==='FILLED'?'ok':o.status==='PARTIAL'?'warn':o.status==='CANCELLED'?'':'perm')}</td></tr>`).join('')||'<tr><td colspan=10 class="muted">No orders</td></tr>'}</table>${rows.length>400?`<p class="small muted">Showing 400 of ${rows.length}.</p>`:''}</div>`;
  $('#progress').innerHTML = h;

// ------------------------------------------------------------------ Tilts table (security tilts per fund, % of the fund)
const fmtPct = (v,d=2) => (v>0?'+':'')+(+v).toFixed(d);
async function vTilts(){
  const tok = S.tgTok = (S.tgTok||0)+1;
  let g; try { g = await api('GET','/api/trading/tilts-grid'); } catch(e) { return toast(e.message,'error'); }
  if (tok !== S.tgTok || S.tab !== 'tilts') return;
  S.tg ||= {edits:{}, prev:null}; S.tgData = g;
  const T=S.tg, ro=!g.can_edit;
  const funds = g.funds.filter(f=>S.veh==='all'||f.vehicle===S.veh);
  const val = (f,i) => { const k=f+'|'+i; if (k in T.edits) return T.edits[k]; const c=g.cells[f][i]; return c&&c.own_bps!=null ? +(c.own_bps/100).toFixed(4) : ''; };
  let lastAc='', body='';
  for (const r of g.rows) {
    const inAny = funds.some(f=>g.cells[f.id][r.instrument]); if(!inAny) continue;
    if (r.asset_class!==lastAc){ lastAc=r.asset_class; body+=`<tr class="tg-ac"><td colspan="${funds.length+1}">${esc(acName(r.asset_class))}</td></tr>`; }
    body += `<tr><td class="tg-sec"><b>${esc(r.instrument)}</b> <span class="small muted">${esc(r.name)}</span></td>${funds.map(f=>{const c=g.cells[f.id][r.instrument];
      if(!c) return '<td class="tg-na" title="Not in this fund\'s universe">—</td>';
      const v=val(f.id,r.instrument), wide=c.own_bps==null&&Math.abs(c.bps)>1e-9, edited=(f.id+'|'+r.instrument) in T.edits;
      const tip=`${f.id} · ${r.instrument}: weight today ${(c.weight*100).toFixed(2)}%, glide-path target ${(c.target*100).toFixed(2)}%, tilt in force ${fmtPct(c.bps/100)}%${wide?' (set for a wider scope)':''}${c.excluded?' · excluded from trading':''}${c.exiting?' · being exited':''}`;
      return `<td class="tg-c ${edited?'tg-ed':''} ${c.excluded||c.exiting?'tg-x':''}"><input type="number" step="0.05" inputmode="decimal" data-tg="${f.id}|${r.instrument}" value="${v}" placeholder="${wide?fmtPct(c.bps/100):''}" title="${esc(tip)}" aria-label="${esc(tip)}" ${ro?'disabled':''}></td>`}).join('')}</tr>`;
  }
  const n = Object.keys(T.edits).length;
  $('#tilts').innerHTML = `<div class="card"><h2>Tilts</h2>
   <p class="small muted">Tilt toward (+) or away from (−) a holding within a fund, in <b>% of the fund</b> (0.25 = 25 bp). Type into as many cells as you like, preview, then save them together. Each tilt is funded pro rata from the fund's other holdings, so weights still total 100%, and applies to every allocation table (cashflows, rebalances). A blank or 0 removes that fund's own tilt. A grey number is a tilt set for a wider scope (all funds, a product line or chosen vintages on Glide path &amp; bulk changes); typing a value overrides it for that fund. Hover over a cell for today's weight and target. Tip: paste a block of numbers from Excel into any cell.${ro?' <b>Read-only: portfolio managers set tilts.</b>':''}</p>
   <div class="tg-wrap"><table class="tg"><tr><th class="tg-sec">Security</th>${funds.map(f=>`<th class="n" title="${f.vehicle==='cit'?'CIT':'Mutual fund'} ${f.vintage}">${f.id.replace('-','<br>')}</th>`).join('')}</tr>${body}</table></div>
   ${ro?'':`<div class="row" style="margin-top:10px"><label class="small">Until (optional) <input type="date" id="tgUntil" value="${esc(T.until||'')}"></label><button class="btn primary" id="tgPrev">Preview</button><button class="btn" id="tgClear">Discard edits</button><span class="small muted" id="tgN">${n?`${n} cell${n===1?'':'s'} changed`:'No changes yet'}</span></div>`}
   <div id="tgOut">${T.prev?tgPreviewHtml(T.prev):''}</div></div>`;
  document.querySelectorAll('[data-tg]').forEach(inp=>{
    inp.oninput=()=>{ T.edits[inp.dataset.tg]=inp.value; T.prev=null; $('#tgOut').innerHTML=''; inp.closest('td').classList.add('tg-ed'); const k=Object.keys(T.edits).length; $('#tgN').textContent=`${k} cell${k===1?'':'s'} changed`; };
    inp.onpaste=ev=>{ const txt=(ev.clipboardData||window.clipboardData).getData('text'); if(!/[\t\n]/.test(txt.trim())) return; ev.preventDefault();
      const all=[...document.querySelectorAll('[data-tg]')], rowsEl=[...document.querySelectorAll('.tg tr')].filter(tr=>tr.querySelector('.tg-sec')&&!tr.querySelector('th'));
      const tr=inp.closest('tr'), r0=rowsEl.indexOf(tr), c0=[...tr.children].indexOf(inp.closest('td'));
      txt.replace(/\r/g,'').split('\n').filter(l=>l.length).forEach((line,i)=>{ const row=rowsEl[r0+i]; if(!row) return;
        line.split('\t').forEach((v,k)=>{ const td=row.children[c0+k]; const x=td&&td.querySelector('[data-tg]'); if(!x) return; v=v.trim().replace('%','').replace(/[,\s]/g,''); T.edits[x.dataset.tg]=isNaN(+v)?'':v; }); });
      T.prev=null; vTilts(); };
    inp.onkeydown=ev=>{ if(!['ArrowUp','ArrowDown','Enter'].includes(ev.key)) return; const f=inp.dataset.tg.split('|')[0], col=[...document.querySelectorAll(`[data-tg^="${f}|"]`)], k=col.indexOf(inp), nx=col[k+(ev.key==='ArrowUp'?-1:1)]; if(nx){ev.preventDefault(); nx.focus(); nx.select();} };
  });
  if (ro) return;
  const cells = () => Object.entries(T.edits).map(([k,v])=>{const [fund_id,instrument]=k.split('|'); return {fund_id, instrument, pct: v===''?null:+v}});
  $('#tgUntil').onchange=e=>{T.until=e.target.value};
  $('#tgClear').onclick=()=>{ T.edits={}; T.prev=null; vTilts(); };
  $('#tgPrev').onclick=async()=>{ if(!Object.keys(T.edits).length) return toast('Type at least one tilt into the table','warn');
    try{ T.prev=await api('POST','/api/trading/tilts-grid/preview',{cells:cells()}); $('#tgOut').innerHTML=tgPreviewHtml(T.prev); $('#tgOut').scrollIntoView({block:'start',behavior:'smooth'}); bindTgSave(); }catch(e){toast(e.message,'error')} };
  const bindTgSave = () => { const b=$('#tgSave'); if(!b) return; b.onclick=async()=>{ const reason=await MUI.ask(`Save ${Object.keys(T.edits).length} tilt change${Object.keys(T.edits).length===1?'':'s'}`,{message:'Saved together and recorded in the ledger. They apply to the next trade list for these funds.', okText:'Save tilts'}); if(!reason) return;
    try{ const r=await api('PUT','/api/trading/tilts-grid',{cells:cells(), until:T.until||'', reason}); T.edits={}; T.prev=null; await load(); toast(`Tilts saved: ${r.set} set, ${r.cleared} cleared across ${r.funds} funds`); }catch(e){toast(e.message,'error')} }; };
  bindTgSave();
}
function tgPreviewHtml(p){
  const g=S.tgData, names=Object.fromEntries(g.rows.map(r=>[r.instrument,r]));
  const fids=p.funds.map(f=>f.fund_id), insts=g.rows.map(r=>r.instrument).filter(i=>p.funds.some(f=>(f.before[i]||0)>0||(f.after[i]||0)>0));
  const changed=i=>p.funds.some(f=>Math.abs((f.after[i]||0)-(f.before[i]||0))>1e-7||Math.abs((f.tilt_after[i]||0)-(f.tilt_before[i]||0))>1e-7);
  const rows=insts.map(i=>`<tr class="${changed(i)?'':'tg-dim'}"><td class="tg-sec"><b>${esc(i)}</b> <span class="small muted">${esc(names[i]?.name||'')}</span></td>${p.funds.map(f=>{const a=(f.before[i]||0)*100, b=(f.after[i]||0)*100, ta=(f.tilt_after[i]||0)/100, tb=(f.tilt_before[i]||0)/100, ch=Math.abs(b-a)>1e-5||Math.abs(ta-tb)>1e-7;
    return `<td class="n ${Math.abs(ta-tb)>1e-7?'tg-ed':''}">${ch?`<span class="muted small">${a.toFixed(2)}→</span><b>${b.toFixed(2)}</b>${Math.abs(ta-tb)>1e-7?`<div class="small">tilt ${fmtPct(tb)}→${fmtPct(ta)}</div>`:''}`:`<span class="muted">${b?b.toFixed(2):'—'}</span>`}</td>`}).join('')}</tr>`).join('');
  const notes=p.funds.flatMap(f=>f.notes.map(n=>`${f.fund_id}: ${n}`));
  return `<h3>Preview: glide-path allocation (% of the fund) with these tilts</h3><p class="small muted">Before → after for each fund you changed: the tilted security moves by its tilt and the others give or take the difference in proportion. Nothing is saved yet.</p>
   <div class="tg-wrap"><table class="tg"><tr><th class="tg-sec">Security</th>${fids.map(f=>`<th class="n">${f.replace('-','<br>')}</th>`).join('')}</tr>${rows}</table></div>
   ${notes.length?`<div class="small" style="margin-top:6px;color:var(--warn)">${notes.map(esc).join('<br>')}</div>`:''}
   <div class="row" style="margin-top:10px"><button class="btn primary" id="tgSave">Save ${Object.keys(S.tg.edits).length} tilt change${Object.keys(S.tg.edits).length===1?'':'s'}</button></div>`;
}

// ------------------------------------------------------------------ Routing & settings
function vSettings(){
  const st = S.st.settings, can = BOOT.can_settings, canR = BOOT.can_routes, canPM = BOOT.can_approve;
  const types = Object.keys(st.routes), insts = S.st.instruments;
  const P = S.pend ||= {excluded:(st.excluded||[]).slice(), tilts:(st.tilts||[]).slice(), exits:(st.exits||[]).slice()};
  const instSel = id => `<select id="${id}">${insts.map(i=>`<option value="${i.id}">${esc(i.id)} · ${esc(i.name)}</option>`).join('')}</select>`;
  const fundSel = id => `<select id="${id}"><option value="*">All funds</option><option value="vehicle:mutual_fund">All mutual funds</option><option value="vehicle:cit">All CITs</option>${S.st.funds.map(f=>`<option>${f.id}</option>`).join('')}</select>`;
  const entryRows = (key, extra, edit) => P[key].map((e,i)=>`<tr><td>${esc(e.instrument||('Asset class: '+acName(e.asset_class)))}</td><td>${esc(scopeLabel(e))}</td>${extra(e)}<td>${esc(e.reason||'(this change)')}</td><td>${esc(e.until||'—')}</td><td>${esc(e.by?.name||'(you)')}</td><td>${edit?`<button class="btn small" data-del="${key}:${i}">Remove</button>`:''}</td></tr>`).join('');
  let h = `<div class="card"><h2>Order routing</h2><p class="small muted">Destination by the type of security traded. Charles River receives every order with its destination. Changing a route needs the <b>Trade route manager</b> permission and a reason; every change is recorded in the ledger as <span class="mono">routes.change</span>.</p>
  <table><tr><th>Security type</th><th>Destination</th></tr>${types.map(k=>`<tr><td>${esc(k.replace('_',' '))}</td><td><select data-route="${k}" ${canR?'':'disabled'}>${S.st.route_names.map(n=>`<option ${n===st.routes[k]?'selected':''}>${esc(n)}</option>`).join('')}</select></td></tr>`).join('')}</table>
  <p class="small" id="rtWho">${canR?'':'You do not hold the route permission. '}<span class="muted">Loading who can change routes…</span></p></div>
  <div class="card"><h2>Cash buffer for ETF trades</h2><p class="small muted">Set once for the whole series; it applies to every fund. Each ETF buy is cut by this share and that amount stays in cash, so a price move can't overdraw the account. A fund can only be set stricter.</p>
  <div class="row"><label>Series buffer <input type="number" id="bufBps" min="0" max="500" step="5" value="${st.buffer_bps}" ${can?'':'disabled'} style="width:90px"> bp</label></div>
  <details><summary>Fund overrides (${Object.keys(st.buffer_overrides||{}).length})</summary><table>${S.st.funds.map(f=>`<tr><td>${f.id}</td><td><input type="number" min="0" step="5" data-ovr="${f.id}" value="${(st.buffer_overrides||{})[f.id]??''}" placeholder="series" ${can?'':'disabled'} style="width:90px"> bp</td></tr>`).join('')}</table></details></div>
  <div class="card" id="cardTilts"><h2>Tilts toward or away from holdings</h2><p class="small muted">Adds (+) or removes (−) basis points from a security's weight in whichever allocation table is used. The tilt is funded pro rata from the other holdings, so the table still totals 100%. A fund-specific tilt replaces an all-funds tilt on the same security. Portfolio managers only.</p>
  <table><tr><th>Security</th><th>Fund</th><th class="n">Tilt</th><th>Reason</th><th>Until</th><th>By</th><th></th></tr>${entryRows('tilts', e=>`<td class="n ${sgn(e.bps)}">${e.bps>0?'+':''}${e.bps} bp</td>`, canPM)||'<tr><td colspan=7 class="muted">None</td></tr>'}</table>
  ${canPM?`<div class="row" style="margin-top:8px">${instSel('tiInst')}${fundSel('tiFund')}<input type="number" id="tiBps" placeholder="± bp" step="5" style="width:90px"><input type="date" id="tiUntil" title="Until (optional)"><button class="btn" id="tiAdd">Add tilt</button></div>`:''}</div>
  <div class="card" id="cardExits"><h2>Full exits</h2><p class="small muted">Flag a security to stop trading it: it gets no cashflow trades and no new buys, and its share of each cashflow goes to the other holdings. Then sell the whole position from the fund's page (in one go or in tranches). Portfolio managers only.</p>
  <table><tr><th>Security</th><th>Fund</th><th>Reason</th><th>Until</th><th>By</th><th></th></tr>${entryRows('exits', ()=>'', canPM)||'<tr><td colspan=6 class="muted">None</td></tr>'}</table>
  ${canPM?`<div class="row" style="margin-top:8px">${instSel('exitInst')}${fundSel('exitFund')}<button class="btn" id="exitAdd">Flag for exit</button></div>`:''}</div>
  <div class="card" id="cardExcl"><h2>Excluded from trading</h2><p class="small muted">Excluded securities keep their position and are not traded.</p>
  <label>When excluded, its share of a cashflow <select id="exShare" ${can?'':'disabled'}><option value="redistribute" ${st.excluded_share!=='cash'?'selected':''}>is spread over the other holdings</option><option value="cash" ${st.excluded_share==='cash'?'selected':''}>stays in cash</option></select></label>

  if (can||canR||canPM) h += `<div class="card"><label class="f" for="setReason">Reason for these changes</label><input type="text" id="setReason" placeholder="At least 10 characters"><div class="row" style="margin-top:10px"><button class="btn primary" id="setSave">Save settings</button><span class="small muted">Everything changed on this tab is saved together and recorded.</span></div></div>`;
  else h += `<p class="small muted">Portfolio managers and admins change these settings; routes need the Trade route manager permission.</p>`;
  h += calcCard();
  const recs = S.st.trading_records.slice().reverse();

  add('#exitAdd', ()=>P.exits.push({instrument:$('#exitInst').value, fund:$('#exitFund').value, reason:''}));

    if (can) Object.assign(body, {buffer_bps:+$('#bufBps').value, buffer_overrides:Object.fromEntries([...document.querySelectorAll('[data-ovr]')].filter(i=>i.value!=='').map(i=>[i.dataset.ovr, +i.value])), excluded:P.excluded, excluded_share:$('#exShare').value});
    if (canPM) Object.assign(body, {tilts:P.tilts, exits:P.exits});
    try{ const r = await api('PUT','/api/trading/settings',body); S.pend=null; await load(); toast('Saved and recorded: '+r.changed.join(', ')) }catch(e){toast(e.message,'error')}
  };
}

// ------------------------------------------------------------------ Calculation templates (doc 17 item 13)
const CALC_FIELDS = {
  pct_per_day: [['pct','% of the order per period','20']],
  even_split: [['tranches','Number of tranches','4']],
  pattern: [['pcts','Percentages, comma separated (total 100)','40, 30, 20, 10']],
  liquidity_cap: [['max_pct_adv','At most % of average daily volume (optional)','10'],['max_usd_per_day','At most $ per day (optional)','5000000']],
};
function calcCard(){
  const cs = S.st.calcs||[], live = cs.filter(t=>!t.retired);
  const ver = v => v?`v${v.version} · ${esc(v.description)}`:'—';
  let h = `<div class="card" id="cardCalcs"><h2>Calculation templates</h2><p class="small muted">Named, versioned calculations that turn orders into tranches, for example a slow sell-down before a redemption in kind or a cap on each day's trade. Each version needs a second person's approval (a portfolio manager or risk user with the Approver permission) before it can be used, and every trade list records which version made its tranches. Use one on a draft trade list: <b>Trade lists → Tranches → Use a calculation</b>.</p>
  <table><tr><th>Template</th><th>In use</th><th>Waiting for approval</th><th></th></tr>${cs.map(t=>`<tr${t.retired?' class="muted"':''}><td><b>${esc(t.name)}</b><br><span class="small muted">${esc(t.id)}${t.retired?' · retired':''}</span></td><td class="small">${t.current?ver(t.current)+`<br><span class="muted">approved by ${esc(t.current.decided_by.name)}</span>`:'<span class="muted">Not yet approved</span>'}</td><td class="small">${t.pending?ver(t.pending)+`<br><span class="muted">proposed by ${esc(t.pending.requested_by.name)}: ${esc(t.pending.reason)}</span>`:'—'}</td>
   <td>${t.pending&&BOOT.can_decide_calcs?`<button class="btn small primary" data-cd="${t.id}:${t.pending.version}:approve">Approve</button> <button class="btn small" data-cd="${t.id}:${t.pending.version}:reject">Reject</button> `:''}${!t.retired&&BOOT.can_prepare&&!t.pending?`<button class="btn small" data-cnew="${t.id}">New version</button> `:''}${!t.retired&&BOOT.can_approve?`<button class="btn small danger" data-cret="${t.id}">Retire</button>`:''}</td></tr>`).join('')||'<tr><td colspan=4 class="muted">None</td></tr>'}</table>`;
  if (BOOT.can_prepare) {
    const C = S.calcNew ||= {kind:'pct_per_day', template_id:null};
    const base = C.template_id ? cs.find(t=>t.id===C.template_id) : null, bp = base ? (base.current||base.versions[base.versions.length-1]) : null;
    if (bp && !C.loaded) { C.kind = bp.kind; C.loaded = true; }
    const pv = (k,d) => bp && bp.kind===C.kind && bp.params[k]!=null ? (Array.isArray(bp.params[k])?bp.params[k].join(', '):bp.params[k]) : d;
    h += `<h3 id="calcFormT">${base?`New version of ${esc(base.name)}`:'Propose a template'}</h3>
    <div class="row">${base?'':`<label>Name <input type="text" id="cName" placeholder="e.g. Sell 25% a day" value="${esc(C.name||'')}" style="width:220px"></label>`}<label>Calculation <select id="cKind">${Object.entries(S.st.calc_kinds).map(([k,l])=>`<option value="${k}" ${k===C.kind?'selected':''}>${esc(l)}</option>`).join('')}</select></label>
    <label>Applies to <select id="cSides">${['SELL','BUY','BOTH'].map(x=>`<option value="${x}" ${pv('sides','SELL')===x?'selected':''}>${({SELL:'Sells',BUY:'Buys',BOTH:'Buys and sells'})[x]}</option>`).join('')}</select></label></div>
    <div class="row">${CALC_FIELDS[C.kind].map(([k,l,d])=>`<label>${esc(l)} <input type="text" data-cp="${k}" value="${esc(pv(k, k==='max_usd_per_day'||k==='max_pct_adv'?'':d))}" placeholder="${esc(d)}" style="width:${k==='pcts'?200:110}px"></label>`).join('')}
    <label>Every <input type="number" id="cEvery" min="1" max="20" value="${pv('every_n_days',1)}" style="width:60px"> business days</label><label>Start <input type="number" id="cOff" min="0" max="20" value="${pv('start_offset_days',0)}" style="width:60px"> business days after the trade date</label><label>At most <input type="number" id="cMax" min="2" max="60" value="${pv('max_days',20)}" style="width:60px"> tranches</label></div>
    <label class="f" for="cReason">Reason (kept in the ledger)</label><input type="text" id="cReason" placeholder="At least 10 characters, e.g. what this is for" value="${esc(C.reason||'')}">
    <div class="row" style="margin-top:8px"><button class="btn primary" id="cGo">${base?'Propose new version':'Propose template'}</button>${base?'<button class="btn" id="cCancel">Cancel</button>':''}<span class="small muted">It can be used once a second person approves it.</span></div>`;
  }
  return h + `</div>`;
}
function bindCalcs(){
  const C = S.calcNew;
  if ($('#cKind')) $('#cKind').onchange = e => { C.kind = e.target.value; C.name = $('#cName')?.value; C.reason = $('#cReason').value; vSettings(); document.getElementById('cardCalcs').scrollIntoView(); };
  document.querySelectorAll('[data-cnew]').forEach(b=>b.onclick=()=>{ S.calcNew={template_id:b.dataset.cnew}; vSettings(); $('#calcFormT').scrollIntoView(); });
  if ($('#cCancel')) $('#cCancel').onclick = ()=>{ S.calcNew=null; vSettings(); };
  if ($('#cGo')) $('#cGo').onclick = async()=>{
    const params = {sides:$('#cSides').value, every_n_days:+$('#cEvery').value, start_offset_days:+$('#cOff').value, max_days:+$('#cMax').value};
    document.querySelectorAll('[data-cp]').forEach(i=>{ if (i.value.trim()!=='') params[i.dataset.cp] = i.dataset.cp==='pcts' ? i.value.split(',').map(x=>+x.trim()) : +i.value; });
    try{ const r = await api('POST','/api/trading/calcs',{template_id:C.template_id, name:$('#cName')?.value, kind:C.kind, params, reason:$('#cReason').value}); S.calcNew=null; await load(); toast(`${r.name} v${r.pending.version} proposed and recorded; a second person approves it`) }catch(e){toast(e.message,'error')} };
  document.querySelectorAll('[data-cd]').forEach(b=>b.onclick=async()=>{ const [id,v,d]=b.dataset.cd.split(':'); const reason=await MUI.ask(`${d==='approve'?'Approve':'Reject'} ${id} version ${v}?`,{message:d==='approve'?'Approved versions can be used on draft trade lists and replace the version in use. This is recorded in the ledger.':'The version is set aside; the version in use (if any) stays.',label:'Reason',okText:d==='approve'?'Approve version':'Reject version',danger:d!=='approve'}); if(!reason) return;
    try{ await api('POST',`/api/trading/calcs/${id}/versions/${v}/decide`,{decision:d, reason}); await load(); toast(`${id} v${v} ${d}d and recorded`) }catch(e){toast(e.message,'error')} });
  document.querySelectorAll('[data-cret]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.cret; const reason=await MUI.ask(`Retire ${id}?`,{message:'It can no longer be used on new tranches. Trade lists that already used it keep their tranches and the record of which version made them.',label:'Reason',okText:'Retire template',danger:true}); if(!reason) return;
    try{ await api('POST',`/api/trading/calcs/${id}/retire`,{reason}); await load(); toast(`${id} retired and recorded`) }catch(e){toast(e.message,'error')} });
}

// ------------------------------------------------------------------ Glide path & bulk changes
const scopeLabel = e => { const lab = ({'*':'All funds','vehicle:mutual_fund':'All mutual funds','vehicle:cit':'All CITs'})[e.fund||'*'] || e.fund;
  if ((e.vintages||[]).length) return lab + (e.vintages.length===1?`, vintage ${e.vintages[0]}`:`, vintages ${e.vintages.join(', ')}`);
  return lab + ((e.vintage_from||e.vintage_to)?`, vintages ${e.vintage_from||'…'}–${e.vintage_to||'…'}`:''); };
const acName = a => (S.st && S.st.asset_names && S.st.asset_names[a]) || a.replace(/_/g,' ');
const bkSingle = sc => !['*','vehicle:mutual_fund','vehicle:cit'].includes(sc);
function bkSel(){ if (!S.bkV) S.bkV = S.st.vintages.slice(); return S.bkV; }
function bkScope(safe){ const sc=$('#bkScope').value, vs=bkSel(); if (!safe && !bkSingle(sc) && !vs.length) throw new Error('Pick at least one vintage'); return {scope:sc, vintages: bkSingle(sc)||vs.length===S.st.vintages.length ? [] : vs.slice()}; }
function bkFunds(){ const sc=$('#bkScope').value, vs=bkSel(); return S.st.funds.filter(f=>(sc==='*'||sc===f.id||sc==='vehicle:'+f.vehicle)&&(bkSingle(sc)||vs.includes(f.vintage))); }

  let h = `<div class="card"><h2>Apply to</h2><div class="row">
   <label>Funds <select id="bkScope"><option value="*">All funds</option><option value="vehicle:mutual_fund">All mutual funds</option><option value="vehicle:cit">All CITs</option>${st.funds.map(f=>`<option value="${f.id}">${f.id}</option>`).join('')}</select></label>
   <span class="small" id="bkCount"></span></div>
   <div id="bkVwrap"><label class="f" id="bkVlab">Vintages <span class="muted">(click to include or leave out)</span></label>
   <div class="vpick" role="group" aria-labelledby="bkVlab">${V.map(v=>`<button type="button" class="vchip" data-bkv="${v}">${v}</button>`).join('')}
   <button type="button" class="btn small" data-bkvset="all">All</button><button type="button" class="btn small" data-bkvset="near">2030–2045</button><button type="button" class="btn small" data-bkvset="far">2050–2070</button><button type="button" class="btn small" data-bkvset="none">Clear</button></div></div>
   <label class="f" for="bkReason">Reason (kept in the ledger for every change on this tab)</label><input type="text" id="bkReason" placeholder="At least 10 characters"></div>

  <div class="card"><h2>Glide path</h2><p class="small muted">Glide-path changes are made in a table: type the changes for any number of vintages or funds and asset classes at once, preview them fund by fund, and send them to the Investment Committee as one request.</p>
   <div class="row"><a class="btn primary" href="/runs/latest" id="gpOpenTable" onclick="try{sessionStorage.setItem('mer_tab','glide')}catch(e){}">Open the glide-path table (Console → Glide path)</a></div>
   <h3>Asset-class shifts for the Strategic table</h3><p class="small muted">Used only by <b>Glide path plus the shifts above</b> in the Strategic table card below.</p>
   <table id="shTable"><tr><th>Add to</th><th class="n">pp</th><th>Funded from</th><th></th></tr>${S.shifts.map((x,i)=>`<tr><td><select data-sha="${i}">${acOpt(x.asset_class)}</select></td><td class="n"><input type="number" data-shp="${i}" value="${x.pp}" step="0.25" style="width:90px"></td><td><select data-shf="${i}">${acOpt(x.from)}</select></td><td>${S.shifts.length>1?`<button class="btn small" data-shx="${i}">Remove</button>`:''}</td></tr>`).join('')}</table>
   <div class="row" style="margin-top:8px"><button class="btn" id="shAdd">Add a shift</button></div>
   <div id="gpPreview"></div>
   <h3>Waiting for the Investment Committee</h3><table><tr><th>Request</th><th>Applies to</th><th>Change</th><th>Requested by</th><th>Reason</th><th></th></tr>${g.requests.filter(r=>r.status==='pending').map(r=>`<tr><td><b>${r.id}</b><br><span class="small muted">${r.kind==='retire'?'Retire '+esc(r.adjustment_id):'New'}</span></td><td>${esc(r.scope_label)} <span class="small muted">(${r.funds.length} funds)</span></td><td class="small">${r.rows?r.rows.map(x=>`<b>${esc(x.fund_id)}</b> ${Object.entries(x.deltas).map(([a,v])=>`${esc(acName(a))} ${v>0?'+':''}${v}pp`).join(', ')}`).join('<br>'):r.shifts.map(x=>`${esc(acName(x.asset_class))} ${x.pp>0?'+':''}${x.pp}pp from ${esc(acName(x.from))}`).join('<br>')}</td><td>${esc(r.requested_by.name)}</td><td class="small">${esc(r.reason)}</td><td>${BOOT.can_glide?`<button class="btn small primary" data-gpd="${r.id}:approve">Approve</button> <button class="btn small" data-gpd="${r.id}:reject">Reject</button>`:'<span class="small muted">IC decides</span>'}</td></tr>`).join('')||'<tr><td colspan=6 class="muted">None</td></tr>'}</table>
   <h3>In force</h3><table><tr><th>Adjustment</th><th>Applies to</th><th>Change</th><th>Approved by</th><th></th></tr>${g.adjustments.filter(a=>a.status==='active').map(a=>`<tr><td><b>${a.id}</b><br><span class="small muted">from ${esc(a.effective)}</span></td><td>${esc(a.scope_label)} <span class="small muted">(${a.funds.length} funds)</span></td><td class="small">${a.shifts.map(x=>`${esc(acName(x.asset_class))} ${x.pp>0?'+':''}${x.pp}pp from ${esc(acName(x.from))}`).join('<br>')}</td><td>${esc(a.approved_by.name)}<br><span class="small muted">requested by ${esc(a.requested_by.name)}</span></td><td>${BOOT.can_prepare?`<button class="btn small" data-gpr="${a.id}">Request retirement</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5 class="muted">None: every fund follows the IPS glide path</td></tr>'}</table></div>`;
  if (BOOT.can_approve) h += `<div class="card"><h2>Strategic table</h2><p class="small muted">Set the Strategic table of every fund in scope at once: follow the glide path, or the glide path plus the shifts above (tactical, no committee approval; the IPS check runs on every trade list).</p>

  <div class="card"><h2>Exclusions and full exits</h2><div class="row"><select id="bkExInst">${st.instruments.map(i=>`<option value="${i.id}">${esc(i.id)} · ${esc(i.name)}</option>`).join('')}</select><select id="bkExKind"><option value="excluded">Exclude from trading</option><option value="exits">Flag for full exit</option></select><input type="date" id="bkExUntil" title="Until (optional)"><button class="btn primary" id="bkExGo">Apply</button></div><p class="small muted">A security not held by a fund's product line has no effect there.</p></div>

  $('#bulk').innerHTML = h;
  $('#bkScope').value = S.bk?.scope || def; if (S.bk){ $('#bkReason').value=S.bk.reason||''; }
  const count = ()=>{ const vs=bkSel(), single=bkSingle($('#bkScope').value), n=bkFunds();
    $('#bkVwrap').style.display = single ? 'none' : '';
    document.querySelectorAll('[data-bkv]').forEach(b=>{ const on=vs.includes(+b.dataset.bkv); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });

      : `Applies to <b>${n.length}</b> fund${n.length===1?'':'s'}${single?'':` · ${vs.length===V.length?'all':vs.length} vintage${vs.length===1?'':'s'}`}`;
    S.bk={...bkScope(true), reason:$('#bkReason').value}; };
  $('#bkScope').onchange=count; $('#bkReason').oninput=count;
  document.querySelectorAll('[data-bkv]').forEach(b=>b.onclick=()=>{ const v=+b.dataset.bkv, vs=bkSel(); S.bkV = vs.includes(v) ? vs.filter(x=>x!==v) : vs.concat(v).sort(); count(); });
  document.querySelectorAll('[data-bkvset]').forEach(b=>b.onclick=()=>{ const k=b.dataset.bkvset; S.bkV = k==='all'?V.slice():k==='none'?[]:V.filter(v=>k==='near'?v<=2045:v>=2050); count(); });
  count();
  const sync = ()=>{ document.querySelectorAll('[data-sha]').forEach(e=>S.shifts[+e.dataset.sha].asset_class=e.value); document.querySelectorAll('[data-shf]').forEach(e=>S.shifts[+e.dataset.shf].from=e.value); document.querySelectorAll('[data-shp]').forEach(e=>S.shifts[+e.dataset.shp].pp=+e.value); };
  $('#shAdd').onclick=()=>{sync(); S.shifts.push({asset_class:A[0], from:A[1], pp:0.5}); vBulk()};
  document.querySelectorAll('[data-shx]').forEach(b=>b.onclick=()=>{sync(); S.shifts.splice(+b.dataset.shx,1); vBulk()});
  const reason = ()=>$('#bkReason').value;
  document.querySelectorAll('[data-gpd]').forEach(b=>b.onclick=async()=>{ const [id,d]=b.dataset.gpd.split(':'); try{ await api('POST',`/api/trading/glide-path/requests/${id}/decide`,{decision:d, reason:reason()}); await load(); toast(`${id} ${d}d and recorded`) }catch(e){toast(e.message,'error')} });

  $('#stbFollow').onclick=()=>stb(true); $('#stbShift').onclick=()=>stb(false);

  h += `<h3>Find a security</h3><input type="search" id="ntQ" placeholder="Ticker, name or asset class, e.g. VTI, Treasury, emerging" value="${esc(nt.q)}" autocomplete="off">
   <table class="pick"><tr><th>Security</th><th>Asset class</th><th class="n">Held</th><th class="n">Weight</th><th class="n">Glide-path target</th><th></th></tr>
   ${list.map(r=>`<tr><td><b>${esc(r.instrument)}</b> <span class="small muted">${esc(r.name)}</span>${r.excluded?' '+chip('excluded','crit'):''}${r.exiting?' '+chip('exiting','warn'):''}</td><td class="small">${esc(AN(r.asset_class))}</td><td class="n">${r.value?musd(r.value):'—'}</td><td class="n">${r.value?pct(r.weight):'—'}</td><td class="n">${r.t_neutral?pct(r.t_neutral):'—'}</td><td><button class="btn small" data-add="${esc(r.instrument)}">Add</button></td></tr>`).join('')||'<tr><td colspan=6 class="muted">No match</td></tr>'}</table>
   ${!q&&d.rows.length>12?'<p class="small muted">Showing the 12 largest holdings. Type to search all '+d.rows.length+' securities.</p>':''}`;
  if (nt.orders.length) h += `<h3>Orders in this ticket</h3><table><tr><th>Security</th><th class="n">Held now</th><th>Action</th><th class="n">Amount or weight</th><th class="n">Estimated trade</th><th class="n">Weight after</th><th></th></tr>
   ${nt.orders.map((o,i)=>{const r=d.rows.find(x=>x.instrument===o.instrument)||{value:0,weight:0}; const e=estOrder(o,r,d);
     return `<tr><td><b>${esc(o.instrument)}</b><br><span class="small muted">${esc(r.name||'')}</span></td><td class="n">${musd(r.value)} · ${pct(r.weight)}</td>
     <td><select data-oact="${i}"><option value="buy" ${o.act==='buy'?'selected':''}>Buy amount</option><option value="sell" ${o.act==='sell'?'selected':''}>Sell amount</option><option value="weight" ${o.act==='weight'?'selected':''}>Trade to weight</option><option value="all" ${o.act==='all'?'selected':''} ${r.value?'':'disabled'}>Sell all</option></select></td>
     <td class="n">${o.act==='all'?'—':`<input type="number" data-oval="${i}" value="${o.val}" min="0" step="${o.act==='weight'?'0.1':'10000'}" style="width:140px"> <span class="small muted">${o.act==='weight'?'% of NAV':'USD'}</span>`}</td>
     <td class="n ${e.side==='BUY'?'pos':'neg'}">${e.amount?(e.side==='BUY'?'Buy ':'Sell ')+musd(e.amount):'—'}</td><td class="n">${pct(e.wAfter)}</td><td><button class="btn small" data-odel="${i}">Remove</button></td></tr>`}).join('')}</table>
   <p class="small muted">Buys are paid from the fund's uninvested cash (${musd(d.cash)}) and sells add to it. Estimates use last close prices; the impact below uses the exact order sizes.</p>`;
  if (nt.orders.length) { const net=nt.orders.reduce((a,o)=>{const r=d.rows.find(x=>x.instrument===o.instrument)||{value:0,weight:0}; const e=estOrder(o,r,d); return a+(e.side==='BUY'?-e.amount:e.amount)},0), left=d.cash+net;
    h += left<0?`<p class="small neg" id="ntCashWarn"><b>Not enough cash:</b> these buys need ${musd(-net)} but the fund holds ${musd(d.cash)} uninvested. Add a sell of at least ${musd(-left)} (for example trade an overweight holding down to its target), or lower the buy.</p>`
      :`<p class="small" id="ntCashWarn">Cash after these orders: <b>${musd(left)}</b> (now ${musd(d.cash)}).</p>`; }
  return h;
}
function estOrder(o,r,d){
  const v=+o.val||0; let side='BUY', amount=0;
  if (o.act==='buy') amount=v; else if (o.act==='sell'){side='SELL';amount=v} else if (o.act==='all'){side='SELL';amount=r.value}
  else if (o.act==='weight'){const diff=v/100*d.nav-r.value; side=diff>=0?'BUY':'SELL'; amount=Math.abs(diff)}
  return {side, amount, wAfter:(r.value+(side==='BUY'?amount:-amount))/d.nav};
}
function setupExit(){
  const d = S.nt.fd; let h = `<div class="row">${fundSelect()}</div>`;
  if (!d) return h + '<p class="small muted">Pick a fund to see positions flagged for exit.</p>';
  const ex = d.rows.filter(r=>r.exiting && r.value>0);
  return h + (ex.length?`<h3>Flagged for exit and still held</h3><table><tr><th>Security</th><th class="n">Held</th><th class="n">Weight</th></tr>${ex.map(r=>`<tr><td><b>${esc(r.instrument)}</b> <span class="small muted">${esc(r.name)}</span></td><td class="n">${musd(r.value)}</td><td class="n">${pct(r.weight)}</td></tr>`).join('')}</table><p class="small muted">Each whole position is sold; proceeds stay in cash (reinvesting them is a rebalance).</p>`
    :`<p class="small">Nothing in ${esc(S.nt.fund)} is flagged for exit. Flag a security on <a href="#" data-gotab="settings">Routing &amp; settings</a> → Full exits, or use <b>Trade a security</b> → Sell all to sell one position now.</p>`);
}
function ntRequest(){
  const nt=S.nt, td=$('#ntDate')?$('#ntDate').value:nt.date; if($('#ntDate')) nt.tdate=td;
  if (nt.task==='invest') { if(!nt.date) throw new Error('No cashflows to invest'); return ['/api/trading/trade-lists',{trade_date:nt.date, strategy:nt.strat, vehicle:S.veh}]; }
  if (nt.task==='rebalance') return ['/api/trading/rebalance',{strategy:nt.strat, trade_date:td, min_drift_bps:+nt.drift, vehicle:S.veh, fund_ids: nt.fundSel?[nt.fundSel]:null}];
  if (!nt.fund) throw new Error('Choose a fund');
  if (nt.task==='exit') return ['/api/trading/tickets',{kind:'exit', fund_id:nt.fund, trade_date:td, orders:nt.fd.rows.filter(r=>r.exiting&&r.value>0).map(r=>({instrument:r.instrument}))}];
  if (!nt.orders.length) throw new Error('Add at least one security');
  const orders = nt.orders.map(o=>{const r=nt.fd.rows.find(x=>x.instrument===o.instrument); if(o.act==='all') return {instrument:o.instrument, side:'SELL', all:true};
    const e=estOrder(o,r,nt.fd); return {instrument:o.instrument, side:e.side, amount:Math.round(e.amount)}});
  return ['/api/trading/tickets',{fund_id:nt.fund, trade_date:td, orders}];
}
function bindTrade(){
  const nt=S.nt, re=()=>{nt.prev=null; vTrade()};
  document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{const g=GOALS[+b.dataset.goal]; nt.task=g[1]; if(g[2]) nt.strat=g[2]; nt.prev=null; vTrade(); window.scrollTo(0,0)});
  document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{nt.task=b.dataset.task; nt.prev=null; if(nt.task==='rebalance'&&nt.strat==='previous_close') nt.strat='neutral'; vTrade()});
  document.querySelectorAll('input[name=ntStrat]').forEach(r=>r.onchange=()=>{nt.strat=r.value; re()});
  document.querySelectorAll('[data-gotab]').forEach(a=>a.onclick=e=>{e.preventDefault(); S.tab=a.dataset.gotab; sessionStorage.setItem('tr_tab',S.tab); render()});
  if ($('#ntCfDate')) $('#ntCfDate').onchange=e=>{nt.date=e.target.value; re()};
  if ($('#ntFunds')) $('#ntFunds').onchange=e=>{nt.fundSel=e.target.value; nt.prev=null};
  if ($('#ntDrift')) $('#ntDrift').onchange=e=>{nt.drift=e.target.value; nt.prev=null};
  if ($('#ntFund')) $('#ntFund').onchange=async e=>{nt.fund=e.target.value; nt.fd=null; nt.orders=[]; nt.prev=null; if(nt.fund) nt.fd=await api('GET','/api/trading/funds/'+nt.fund); vTrade()};
  if ($('#ntQ')) { const q=$('#ntQ'); q.oninput=()=>{nt.q=q.value; const pos=q.selectionStart; vTrade(); const n=$('#ntQ'); n.focus(); n.setSelectionRange(pos,pos)}; }
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{nt.orders.push({instrument:b.dataset.add, act:'buy', val:''}); nt.q=''; nt.prev=null; vTrade()});
  document.querySelectorAll('[data-odel]').forEach(b=>b.onclick=()=>{nt.orders.splice(+b.dataset.odel,1); nt.prev=null; vTrade()});
  document.querySelectorAll('[data-oact]').forEach(s=>s.onchange=()=>{const o=nt.orders[+s.dataset.oact]; o.act=s.value; if(o.act==='weight'){const r=nt.fd.rows.find(x=>x.instrument===o.instrument); o.val=(r.weight*100).toFixed(2)} nt.prev=null; vTrade()});
  document.querySelectorAll('[data-oval]').forEach(i=>i.onchange=()=>{nt.orders[+i.dataset.oval].val=i.value; nt.prev=null; vTrade()});
  if ($('#ntPrev')) $('#ntPrev').onclick=async()=>{ const b=$('#ntPrev'); try{ const [url,body]=ntRequest(); b.disabled=true; nt.prev=await api('POST',url,{...body, dry_run:true}); nt.req=[url,body]; nt.impF=null; vTrade(); const c=$('#trade .card:nth-of-type(3)'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}) }catch(e){b.disabled=false; toast(e.message,'error')} };
  if ($('#ntCreate')) $('#ntCreate').onclick=async()=>{ const reason=$('#ntReason').value.trim(); nt.reason=reason; if(reason.length<10) return toast('Give a reason of at least 10 characters','error');
    const b=$('#ntCreate'); b.disabled=true; try{ const [url,body]=nt.req; const r=await api('POST',url,{...body, reason}); S.tl=r.id; sessionStorage.setItem('tr_tl',r.id); S.nt={...S.nt, prev:null, orders:[], reason:''}; S.tab='trades'; S.tlView='impact'; sessionStorage.setItem('tr_tab','trades'); await load(); toast(`${r.id}: draft created with ${r.order_count} orders, recorded in the ledger`) }catch(e){b.disabled=false; toast(e.message,'error')} };
  bindImpact('nt');
}

// impact of a trade list (preview or saved): portfolio before vs after, against target and glide path
function acOf(f){
  if (f.impact) return f.impact.asset_classes;
  const out={}; for (const r of f.preview){ const a=r.asset_class||'cash', o=out[a] ||= {current:0,post:0,target:0,glide:null}; o.current+=r.current_w; o.post+=r.post_w; o.target+=r.target_w; } return out;
}
function gapOf(f,k){ if (f.impact) return f.impact[k==='before'?'gap_to_target_before':'gap_to_target_after']; return f.preview.reduce((s,r)=>s+Math.abs((k==='before'?r.current_w:r.post_w)-r.target_w),0)/2; }
function fundTotals(f){ let buy=0,sell=0; f.orders.forEach(o=>o.side==='BUY'?buy+=o.est_amount:sell+=o.est_amount); return {buy,sell}; }
function impactPanel(t, key){
  const fs=t.funds, sel=S[key+'ImpF'] && fs.find(f=>f.fund_id===S[key+'ImpF']) || fs[0];
  const tot=fs.reduce((a,f)=>{const x=fundTotals(f);a.buy+=x.buy;a.sell+=x.sell;a.cb+=f.cash_before;a.ca+=f.cash_after;a.o+=f.orders.length;return a},{buy:0,sell:0,cb:0,ca:0,o:0});
  const cnt=fs.reduce((a,f)=>{const s=f.compliance.status; a[s.startsWith('PASS')?'PASS':s]=(a[s.startsWith('PASS')?'PASS':s]||0)+1; return a},{});
  const gb=fs.reduce((a,f)=>a+gapOf(f,'before'),0)/fs.length, ga=fs.reduce((a,f)=>a+gapOf(f,'after'),0)/fs.length;
  let h = `<div class="kpis"><div><span class="muted small">Funds</span><b>${fs.length}</b></div><div><span class="muted small">Orders</span><b>${tot.o}</b></div><div><span class="muted small">Buys</span><b class="pos">${musd(tot.buy)}</b></div><div><span class="muted small">Sells</span><b class="neg">${musd(tot.sell)}</b></div>
   <div><span class="muted small">Uninvested cash</span><b>${musd(tot.cb)} → ${musd(tot.ca)}</b></div><div><span class="muted small">Off target (avg)</span><b>${pct(gb,1)} → ${pct(ga,1)}</b></div>
   <div><span class="muted small">Compliance after</span><b>${Object.entries(cnt).map(([k,n])=>compChip({status:k})+n).join(' ')}</b></div></div>
   <p class="small muted">"Off target" is the share of the fund that would have to move to match ${t.strategy==='manual'?'the glide path':'the target of “'+esc((STRAT[t.strategy]||[t.strategy_name])[0])+'”'} exactly: lower is closer. 0% means the fund is exactly on target.</p>`;
  if (fs.length>1) h += `<h3>By fund</h3><div class="scroll"><table><tr><th>Fund</th><th class="n">Net flow</th><th class="n">Orders</th><th class="n">Buys</th><th class="n">Sells</th><th class="n">Cash after</th><th>Off target: now → after</th><th class="n">Equity: now → after</th><th class="n">Glide path</th><th>Compliance</th></tr>
   ${fs.map(f=>{const ac=acOf(f), eqs=(S.st.groups||{}).equity||[], x=fundTotals(f), b=gapOf(f,'before'), a=gapOf(f,'after'), mx=Math.max(0.0001,...fs.map(z=>gapOf(z,'before')));
     return `<tr class="click ${f===sel?'sel':''}" data-impf="${key}|${f.fund_id}"><td><b>${f.fund_id}</b> <span class="small muted">${vname(f.vehicle)}</span></td><td class="n ${sgn(f.flow||0)}">${f.flow?musd(f.flow):'—'}</td><td class="n">${f.orders.length}</td><td class="n">${musd(x.buy)}</td><td class="n">${musd(x.sell)}</td><td class="n">${musd(f.cash_after)}</td>
     <td style="min-width:150px"><div class="gapbar"><i style="width:${b/mx*100}%"></i><b style="width:${a/mx*100}%"></b></div><span class="small">${pct(b,1)} → <b>${pct(a,1)}</b></span></td>
     <td class="n">${pct(sumA(ac,eqs,'current'),1)} → <b>${pct(sumA(ac,eqs,'post'),1)}</b></td><td class="n">${ac[eqs[0]]&&ac[eqs[0]].glide!=null?pct(sumA(ac,eqs,'glide'),1):'—'}</td><td>${compChip(f.compliance)}</td></tr>`}).join('')}</table></div>
   <p class="small muted">Click a fund to see its detail below. Grey bar = off target now, blue = after.</p>`;
  h += fundImpact(sel, t);
  return h;
}
function fundImpact(f, t){
  const ac=acOf(f), hasG=t.strategy!=='manual'&&Object.values(ac).some(x=>x.glide!=null), A=S.st.assets.filter(a=>ac[a]&&(ac[a].current||ac[a].post||ac[a].target));
  const mx=Math.max(0.01,...A.map(a=>Math.max(ac[a].current,ac[a].post,ac[a].target,ac[a].glide||0)));
  const tgtLabel = t.strategy==='manual'?'Glide path':'Target';
  const row=(label,c,p,tg,g,cls)=>`<tr class="${cls||''}"><td style="${cls?'':'padding-left:18px'}">${label}</td><td class="n">${pct(c,1)}</td><td class="n"><b>${pct(p,1)}</b></td><td class="n ${sgn(p-c)}">${Math.abs(p-c)<0.00005?'—':pp(p-c,2)}</td><td class="n">${pct(tg,1)}</td>${hasG?`<td class="n">${pct(g,1)}</td>`:''}<td class="n" style="white-space:nowrap">${pp(c-tg,2)}</td><td class="n" style="white-space:nowrap"><b>${pp(p-tg,2)}</b></td></tr>`;
  const groups=GROUPS().map(([g,as])=>{const s=k=>sumA(ac,as,k); return row(g,s('current'),s('post'),s('target'),s('glide'),'grp')+(as.length>1?as.filter(a=>ac[a]).map(a=>row(esc(AN(a)),ac[a].current,ac[a].post,ac[a].target,ac[a].glide,'')).join(''):'')}).join('');
  const chart=A.map(a=>{const x=ac[a], w=v=>(v/mx*100).toFixed(2)+'%';
    return `<div class="mixrow"><span class="lbl" title="${esc(AN(a))}">${esc(AN(a))}</span><div class="mixtrack"><div class="now" style="width:${w(x.current)}"></div><div class="aft" style="width:${w(x.post)}"></div><i class="tgt" style="left:${w(x.target)}" title="${tgtLabel} ${pct(x.target,1)}"></i>${x.glide!=null&&t.strategy!=='manual'?`<i class="gp" style="left:${w(x.glide)}" title="Glide path ${pct(x.glide,1)}"></i>`:''}</div><span class="v">${pct(x.current,1)} → <b>${pct(x.post,1)}</b></span></div>`}).join('');
  const rows=f.preview.slice().sort((a,b)=>Math.abs(b.trade)-Math.abs(a.trade));
  return `<h3>${f.fund_id} · ${vname(f.vehicle)}: asset mix now vs after</h3>
   <div class="kpis small"><div>NAV ${musd(f.nav_before)} → <b>${musd(f.nav_after)}</b></div><div>Uninvested cash ${musd(f.cash_before)} → <b>${musd(f.cash_after)}</b></div><div>Off target ${pct(gapOf(f,'before'),1)} → <b>${pct(gapOf(f,'after'),1)}</b></div><div>Compliance after ${compChip(f.compliance)}</div></div>
   <div class="legend small"><span><i class="sw now"></i>Now</span><span><i class="sw aft"></i>After trades</span><span><i class="sw tgt"></i>${tgtLabel}</span>${hasG&&t.strategy!=='manual'?'<span><i class="sw gp"></i>Glide path</span>':''}</div>
   <div class="grid2 impgrid"><div>${chart}</div><div class="scroll"><table class="compact"><tr><th>Asset class</th><th class="n">Now</th><th class="n">After</th><th class="n">Change</th><th class="n">${tgtLabel}</th>${hasG?'<th class="n">Glide path</th>':''}<th class="n">Gap now</th><th class="n">Gap after</th></tr>${groups}</table><p class="small muted">Gap = weight minus ${tgtLabel.toLowerCase()}, in percentage points (pp). Negative means under target.</p></div></div>
   ${f.notes.length?`<ul class="small">${f.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}${f.errors.map(e=>`<div class="warnbox">${esc(e)}</div>`).join('')}
   ${f.compliance.results&&f.compliance.results.length?`<div class="warnbox">${f.compliance.results.map(r=>`${esc(r.rule_id)} ${esc(r.status)}: ${esc(r.detail||'')} (measured ${esc(r.measured)}, limit ${esc(r.limit)})`).join('<br>')}</div>`:`<p class="small muted">${esc(f.compliance.detail||'')}</p>`}
   <details><summary>Securities: now vs after (${rows.filter(r=>r.trade).length} traded)</summary><div class="scroll"><table><tr><th>Security</th><th class="n">Now</th><th class="n">Weight now</th><th class="n">Trade</th><th class="n">After</th><th class="n">Weight after</th><th class="n">Target</th><th class="n">vs target after</th></tr>${rows.map(r=>`<tr${r.trade?' class="sel"':''}><td>${esc(r.instrument)} ${!r.has_target&&r.type!=='cash'?chip('no target','warn'):''}${r.excluded?chip('excluded','crit'):''}<br><span class="small muted">${esc(AN(r.asset_class))}</span></td><td class="n">${musd(r.current)}</td><td class="n">${pct(r.current_w)}</td><td class="n ${sgn(r.trade)}">${r.trade?usd(r.trade):'—'}</td><td class="n">${musd(r.post)}</td><td class="n">${pct(r.post_w)}</td><td class="n">${r.target_w?pct(r.target_w):'—'}</td><td class="n">${r.target_w?((r.post_w-r.target_w)*10000).toFixed(1)+' bp':'—'}</td></tr>`).join('')}</table></div></details>
   <details><summary>Orders (${f.orders.length})</summary><table><tr><th>Side</th><th>Security</th><th>Type</th><th class="n">Quantity</th><th class="n">Est. price</th><th class="n">Est. amount</th><th>Destination</th></tr>${f.orders.map(o=>`<tr><td class="${o.side==='BUY'?'pos':'neg'}"><b>${o.side}</b></td><td>${esc(o.instrument)}<br><span class="small muted">${esc(o.name)}</span></td><td>${esc(o.type)}</td><td class="n">${o.quantity.toLocaleString('en-US')} <span class="small muted">${o.quantity_type.toLowerCase()}</span></td><td class="n">${usd(o.price,2)}</td><td class="n">${usd(o.est_amount)}</td><td>${esc(o.route)}</td></tr>`).join('')||'<tr><td colspan=7 class="muted">No orders</td></tr>'}</table></details>`;
}
function bindImpact(key){
  document.querySelectorAll(`[data-impf^="${key}|"]`).forEach(tr=>tr.onclick=()=>{S[key+'ImpF']=tr.dataset.impf.split('|')[1]; if(key==='nt') vTrade(); else { const t=S.st.trade_lists.find(x=>x.id===S.tl); if(t) tlDetail(t); }});
}

document.querySelectorAll('#veh button').forEach(b=>b.onclick=()=>{S.veh=b.dataset.v;sessionStorage.setItem('tr_veh',S.veh);if(S.nt){S.nt.prev=null;if(S.nt.fund&&!funds().some(f=>f.id===S.nt.fund)){S.nt.fund='';S.nt.fd=null;S.nt.orders=[]}}render()});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.pend=null;S.tab=b.dataset.tab;sessionStorage.setItem('tr_tab',S.tab);render()});
S.tl = sessionStorage.getItem('tr_tl');
$('#who').innerHTML = BOOT.can_prepare||BOOT.can_settings||BOOT.can_glide ? '' : '<span class="chip">Read-only</span>';
load().catch(e=>toast(e.message,'error'));
</script></body></html>
