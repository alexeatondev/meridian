<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian · Trading</title>
<style>
:root{--bg:#f4f3f0;--surface:#fcfcfb;--surface-2:#f0efec;--line:#e2e0da;--line-strong:#cfccc4;--text:#0b0b0b;--text-2:#52514e;
--muted:#7a7873;--accent:#1f4e8c;--accent-ink:#fff;--ok:#1d7a46;--ok-bg:#e3f2e8;--warn:#8a5a00;--warn-bg:#fbf0d9;--crit:#a3261b;--crit-bg:#f8e1de;--info-bg:#e4ecf7;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--surface:#1a1a19;--surface-2:#232321;--line:#2e2e2b;--line-strong:#3c3c38;--text:#f0efec;
--text-2:#c3c2b7;--muted:#9a998f;--accent:#7aa7e6;--accent-ink:#0b0b0b;--ok:#6cc08c;--ok-bg:#1d2e23;--warn:#e0b25a;--warn-bg:#2f2717;--crit:#ef8a80;--crit-bg:#331d1b;--info-bg:#1d2633}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{font-size:17px;margin:0}header .sp{flex:1}a{color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:20px 24px 60px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit}
.tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 10px}h3{font-size:13px;margin:14px 0 6px;color:var(--text-2)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}tr.sel td{background:var(--surface-2)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;margin:1px 3px 1px 0;background:var(--surface-2);border:1px solid var(--line)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-bg);color:var(--crit);border-color:transparent}.chip.perm{background:var(--info-bg);border-color:transparent}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
label.f{display:block;font-size:12px;color:var(--text-2);margin:10px 0 4px}input[type=text],input[type=email],textarea,input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 0}.opt input{margin-top:3px}.opt .d{font-size:12px;color:var(--muted)}
.switch{position:relative;width:36px;height:20px;flex:none}.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line-strong);border-radius:999px;transition:.15s}.switch span:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--accent)}.switch input:checked+span:before{transform:translateX(16px)}.switch input:focus-visible+span{outline:2px solid var(--accent)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:13px}.warnbox ul{margin:4px 0 0 18px;padding:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;max-width:90vw;z-index:9}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
</style></head><body>
<style>
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}.seg button{border:0;background:var(--surface);color:var(--text);padding:6px 12px;cursor:pointer;font:inherit}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.banner{background:var(--info-bg);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.kpis{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 10px}.kpis div{min-width:120px}.kpis b{display:block;font-size:16px}
select,input[type=number],input[type=date]{padding:7px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
.pos{color:var(--ok)}.neg{color:var(--crit)}details summary{cursor:pointer;font-weight:600;margin:6px 0}
.sub{background:var(--surface-2)}
</style>
</head><body>
<header><h1>Meridian · Trading</h1><span class="muted small" id="who"></span><span class="sp"></span>
<span class="seg" id="veh" role="group" aria-label="Fund vehicle"><button data-v="all" class="on">All funds</button><button data-v="mutual_fund">Mutual funds</button><button data-v="cit">CITs</button></span>
<a href="/runs/latest">Back to console</a><a href="/regulations">Regulations</a><a href="/logout">Sign out</a></header>
<main>
<div class="banner"><b>Shadow mode.</b> Meridian proposes, checks and records orders and produces the Charles River import file. Nothing is sent or executed. Positions, prices and NAVs are <b>example data</b> until custodian and transfer-agent files are connected.</div>
<div class="tabs" role="tablist">
  <button data-tab="funds" class="active">Funds &amp; securities</button><button data-tab="cashflows">Cashflows</button><button data-tab="trades">Trades</button><button data-tab="settings">Routing &amp; settings</button>
</div>
<section id="funds"></section><section id="cashflows" hidden></section><section id="trades" hidden></section><section id="settings" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const BOOT = /*BOOT*/null;
const S = {veh: sessionStorage.getItem('tr_veh')||'all', tab: sessionStorage.getItem('tr_tab')||'funds', st: null, fund: null, fd: null, tl: null, tlView: 'orders', editW: null};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const usd = (v, d=0) => (v<0?'−':'')+'$'+Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const musd = v => usd(v/1e6, 1)+'m';
const pct = (v, d=2) => (v*100).toFixed(d)+'%';
const sgn = v => v>0?'pos':v<0?'neg':'';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',6000)}
async function api(method, url, body, raw){
  const opt = {method, headers: {'X-CSRF-Token':BOOT.csrf}};
  if (raw) opt.body = raw; else if (body) { opt.headers['Content-Type']='application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt); const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(typeof j.detail==='string' ? j.detail : r.statusText);
  return j;
}
const localDate = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const funds = () => S.st.funds.filter(f => S.veh==='all' || f.vehicle===S.veh);
const fundIds = () => new Set(funds().map(f=>f.id));
const vname = v => ({mutual_fund:'Mutual fund', cit:'CIT'})[v]||v;
const chip = (t, cls='') => `<span class="chip ${cls}">${esc(t)}</span>`;
const statusChip = s => ({held:chip('Held','ok'), no_target:chip('Held · no target','warn'), candidate:chip('Not held · candidate','perm'), not_held:chip('Not held')})[s]||chip(s);
const tlChip = s => ({draft:chip('Draft','warn'), approved:chip('Approved','ok'), exported:chip('Exported for Charles River','perm'), cancelled:chip('Cancelled','crit'), filled:chip('Filled and booked','ok')})[s]||chip(s);
const compChip = c => c.status.startsWith('PASS') ? chip(c.status,'ok') : c.status==='WARN' ? chip('WARN','warn') : c.status==='FAIL' ? chip('FAIL','crit') : chip(c.status);

async function load(){ S.st = await api('GET','/api/trading/state'); render(); }
function render(){
  document.querySelectorAll('#veh button').forEach(b=>b.classList.toggle('on', b.dataset.v===S.veh));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===S.tab));
  for (const t of ['funds','cashflows','trades','settings']) $('#'+t).hidden = t!==S.tab;
  ({funds:vFunds, cashflows:vCashflows, trades:vTrades, settings:vSettings})[S.tab]();
}

// ------------------------------------------------------------------ Funds & securities
function vFunds(){
  const fs = funds();
  const nav = fs.reduce((a,f)=>a+f.nav,0);
  let h = `<div class="card"><h2>Funds (${fs.length})</h2><div class="kpis"><div><span class="muted small">Total NAV</span><b>${musd(nav)}</b></div><div><span class="muted small">Positions as of</span><b>${esc(S.st.as_of)}</b></div><div><span class="muted small">Cash buffer (series)</span><b>${S.st.settings.buffer_bps} bp</b></div></div>
  <table><thead><tr><th>Fund</th><th>Vehicle</th><th>Product line</th><th class="n">NAV</th><th class="n">Cash</th><th>Roll-down</th><th class="n">Buffer</th><th>Strategic table</th><th>Regulations</th><th>Positions</th></tr></thead><tbody>`;
  for (const f of fs) h += `<tr class="click ${S.fund===f.id?'sel':''}" data-fund="${f.id}"><td><b>${f.id}</b> <span class="muted small">${f.account}</span></td><td>${vname(f.vehicle)}</td><td>${esc(f.product_name)}</td><td class="n">${musd(f.nav)}</td><td class="n">${musd(f.cash)}</td><td>${f.roll_down}</td><td class="n">${f.buffer_bps} bp</td><td>${f.strategic_follows?'Follows glide path':chip('Custom','perm')}</td><td>${(f.regulations||[]).map(r=>chip(r,'ok')).join(' ')||'<span class="small muted">—</span>'}</td><td class="small">${f.positions_source.startsWith('Example')?'<span class="muted">Example</span>':esc(f.positions_source.split(' (')[0])+'<br><span class="muted">'+esc(f.positions_as_of)+'</span>'}</td></tr>`;
  h += `</tbody></table></div>`;
  if (BOOT.can_approve) h += `<div class="card"><h2>Load positions (holdings at last close)</h2><p class="small muted">Excel or CSV from the custodian or transfer agent with <span class="mono">as_of, fund_id (or account), security_id (or CUSIP; CASH for cash), quantity and price, or market_value</span>. It replaces the example holdings of every fund in the file; any bad row stops the load. Fills you record on exported trade lists also update positions.</p>
   <input type="file" id="posFile" accept=".xlsx,.xlsm,.csv"> <button class="btn primary" id="posUpload">Upload positions</button> <a href="/api/trading/positions/template.csv">CSV template</a></div>`;
  h += `<div id="fundDetail"></div>`;
  $('#funds').innerHTML = h;
  if ($('#posUpload')) $('#posUpload').onclick = async()=>{const f=$('#posFile').files[0]; if(!f) return toast('Choose a file first'); const fd=new FormData(); fd.append('file', f);
    try{const r=await api('POST','/api/trading/positions/upload',null,fd); await load(); toast(`Positions loaded for ${r.funds.length} funds and recorded`)}catch(e){toast(e.message)}};
  document.querySelectorAll('[data-fund]').forEach(tr=>tr.onclick=()=>openFund(tr.dataset.fund));
  if (S.fund && fundIds().has(S.fund)) openFund(S.fund, true);
}
async function openFund(id, keep){
  S.fund = id; if(!keep) { S.editW = null; S.tk = null; }
  document.querySelectorAll('[data-fund]').forEach(tr=>tr.classList.toggle('sel', tr.dataset.fund===id));
  const d = S.fd = await api('GET', '/api/trading/funds/'+id);
  const held = d.rows.filter(r=>r.status==='held'||r.status==='no_target'), other = d.rows.filter(r=>!(r.status==='held'||r.status==='no_target'));
  const head = `<tr><th>Security</th><th>Type</th><th>Asset class</th><th>Status</th><th class="n">Value</th><th class="n">Weight</th><th class="n">Previous close</th><th class="n">Neutral</th><th class="n">Strategic</th><th class="n">Approved proposal</th></tr>`;
  const row = r => `<tr><td><b>${esc(r.instrument)}</b><br><span class="small muted">${esc(r.name)}</span>${r.note?`<br><span class="small">${esc(r.note)}</span>`:''}</td><td>${esc(r.type)}</td><td>${esc(r.asset_class)}</td><td>${statusChip(r.status)}${r.excluded?chip('Excluded from trading','crit'):''}${r.exiting?chip('Exiting','crit'):''}${r.tilt_bps?chip('Tilt '+(r.tilt_bps>0?'+':'')+r.tilt_bps+' bp','perm'):''}</td><td class="n">${r.value?musd(r.value):'—'}</td><td class="n">${r.value?pct(r.weight):'—'}</td><td class="n">${r.t_previous_close?pct(r.t_previous_close):'—'}</td><td class="n">${r.t_neutral?pct(r.t_neutral):'—'}</td><td class="n">${r.t_strategic?pct(r.t_strategic):'—'}</td><td class="n">${r.t_approved?pct(r.t_approved):'—'}</td></tr>`;
  const f = d.fund;
  let h = `<div class="card"><h2>${f.id} · ${esc(f.product_name)} ${f.vintage}</h2>
  <div class="kpis"><div><span class="muted small">Vehicle</span><b>${vname(f.vehicle)}</b></div><div><span class="muted small">NAV</span><b>${musd(d.nav)}</b></div><div><span class="muted small">Uninvested cash</span><b>${musd(d.cash)}</b></div><div><span class="muted small">Glide-path roll-down</span><b>${f.roll_down}</b></div><div><span class="muted small">Account (Charles River)</span><b>${f.account}</b></div></div>
  <p class="small muted">${esc(d.positions_source)} · as of ${esc(d.as_of)}. A security with no target is never part of cash allocation. Target columns are the three allocation tables before tilts; tilts and exits are applied when trades are generated.</p>
  <h3>Held securities</h3><table>${head}${held.map(row).join('')}</table>
  <h3>Not held: candidates and available securities</h3><table>${head}${other.map(row).join('')||'<tr><td colspan=9 class="muted">None</td></tr>'}</table></div>`;
  h += ticketCard(d) + strategicEditor(d);
  $('#fundDetail').innerHTML = h;
  bindStrategic(d); bindTicket(d);
}
function strategicEditor(d){
  const st = d.strategic, can = BOOT.can_approve;
  const rows = d.rows.filter(r=>r.status!=='no_target');
  const w = S.editW || Object.fromEntries(rows.map(r=>[r.instrument, +(r.t_strategic*100).toFixed(3)]));
  S.editW = w;
  const tot = Object.values(w).reduce((a,b)=>a+(+b||0),0);
  let h = `<div class="card"><h2>Strategic table · version ${st.version||0}</h2>
  <p class="small muted">A separate table for a given trading day. It can follow the glide path (it then equals the neutral table on this fund's roll-down schedule) or hold its own weights. Changes need a reason and are recorded in the ledger.</p>
  <label class="row"><span class="switch"><input type="checkbox" id="stFollow" ${st.follows_glide_path!==false?'checked':''} ${can?'':'disabled'}><span></span></span> Follow the glide path</label>`;
  if (st.follows_glide_path===false || S.stEditing){
    h += `<table id="stTable" style="margin-top:10px"><tr><th>Security</th><th class="n">Neutral</th><th class="n">Strategic weight (%)</th></tr>${rows.map(r=>`<tr><td>${esc(r.instrument)} <span class="small muted">${esc(r.asset_class)}</span></td><td class="n">${pct(r.t_neutral)}</td><td class="n"><input type="number" step="0.01" data-w="${r.instrument}" value="${w[r.instrument]??0}" ${can?'':'disabled'} style="width:110px"></td></tr>`).join('')}
    <tr><td><b>Total</b></td><td></td><td class="n"><b id="stTot" class="${Math.abs(tot-100)>0.01?'neg':''}">${tot.toFixed(2)}%</b></td></tr></table>`;
  }
  if (can) h += `<label class="f" for="stReason">Reason for the change</label><input type="text" id="stReason" placeholder="At least 10 characters"><div class="row" style="margin-top:10px"><button class="btn primary" id="stSave">Save strategic table</button>${(st.follows_glide_path!==false && !S.stEditing)?'<button class="btn" id="stEdit">Set custom weights</button>':''}</div>`;
  else h += `<p class="small muted">Only portfolio managers change target tables.</p>`;
  if ((st.history||[]).length) h += `<h3>History</h3><table>${st.history.slice().reverse().map(x=>`<tr><td class="small">${esc(x.at.slice(0,16).replace('T',' '))}</td><td>v${x.version}</td><td>${esc(x.by.name)}</td><td>${x.follows_glide_path?'Follows glide path':'Custom weights'}</td><td>${esc(x.reason)}</td></tr>`).join('')}</table>`;
  return h+'</div>';
}
function bindStrategic(d){
  document.querySelectorAll('[data-w]').forEach(i=>i.oninput=()=>{S.editW[i.dataset.w]=+i.value||0;const t=Object.values(S.editW).reduce((a,b)=>a+(+b||0),0);const e=$('#stTot');e.textContent=t.toFixed(2)+'%';e.className=Math.abs(t-100)>0.01?'neg':''});
  if ($('#stEdit')) $('#stEdit').onclick=()=>{S.stEditing=true;$('#stFollow').checked=false;openFund(S.fund,true)};
  if ($('#stSave')) $('#stSave').onclick=async()=>{
    const follows = $('#stFollow').checked;
    const body = {follows_glide_path: follows, reason: $('#stReason').value};
    if (!follows) body.weights = Object.fromEntries(Object.entries(S.editW).map(([k,v])=>[k,(+v||0)/100]));
    try { const r = await api('PUT', `/api/trading/targets/${S.fund}/strategic`, body); S.stEditing=false; S.editW=null; await load(); toast(`Strategic table saved (version ${r.version}) and recorded in the ledger`); }
    catch(e){ toast(e.message) }
  };
}

// ------------------------------------------------------------------ Cashflows
function vCashflows(){
  const ids = fundIds(), cfs = S.st.cashflows.filter(c=>ids.has(c.fund_id));
  const today = localDate();
  let h = '';
  if (BOOT.can_prepare) h += `<div class="card"><h2>Load cashflows</h2><div class="grid2"><div>
    <h3>From a file (transfer agent or custodian)</h3><p class="small muted">Excel (.xlsx) or CSV with columns <span class="mono">trade_date, fund_id (or account), type, amount, source, reference</span>. Every row is checked; if any row is wrong nothing is loaded.</p>
    <input type="file" id="cfFile" accept=".xlsx,.xlsm,.csv"> <button class="btn primary" id="cfUpload">Upload</button>
    <p class="small"><a href="/api/trading/cashflows/template.xlsx">Excel template</a> · <a href="/api/trading/cashflows/template.csv">CSV template</a> · Connections can also post to <span class="mono">/api/trading/cashflows</span> with the ingest token.</p></div>
    <div><h3>Enter one by hand</h3><div class="row"><input type="date" id="cfDate" value="${today}"><select id="cfFund">${funds().map(f=>`<option>${f.id}</option>`).join('')}</select><select id="cfType"><option value="subscription">Subscription (in)</option><option value="redemption">Redemption (out)</option></select></div>
    <div class="row" style="margin-top:8px"><input type="number" id="cfAmt" placeholder="Amount (USD)" min="0" step="1000" style="width:170px"><select id="cfSrc">${S.st.sources.map(s=>`<option>${esc(s)}</option>`).join('')}</select><input type="text" id="cfRef" placeholder="Reference (optional)" style="width:180px"></div>
    <div class="row" style="margin-top:8px"><button class="btn" id="cfAdd">Add cashflow</button></div></div></div></div>`;
  const byDate = {};
  for (const c of cfs) if (c.status==='new') byDate[c.trade_date] = (byDate[c.trade_date]||0) + c.amount;
  h += `<div class="card"><h2>Cashflows (${cfs.length})</h2>${Object.keys(byDate).length?`<p class="small">Waiting for a trade list: ${Object.entries(byDate).map(([d,v])=>`${d}: <b class="${sgn(v)}">${usd(v)}</b> net`).join(' · ')}</p>`:''}
  <table><thead><tr><th>Trade date</th><th>Fund</th><th>Type</th><th class="n">Amount</th><th>Source</th><th>Loaded</th><th>Status</th><th></th></tr></thead><tbody>
  ${cfs.map(c=>`<tr><td>${c.trade_date}</td><td>${c.fund_id}</td><td>${c.type}</td><td class="n ${sgn(c.amount)}">${usd(c.amount)}</td><td>${esc(c.source)}${c.reference?`<br><span class="small muted">${esc(c.reference)}</span>`:''}</td><td class="small">${esc(c.loaded_by.name)}<br>${esc(c.how)}${c.file_name?' · '+esc(c.file_name):''}</td><td>${c.status==='new'?chip('New','warn'):c.status==='cancelled'?chip('Cancelled','crit'):chip('In '+c.trade_list,'ok')}</td><td>${c.status==='new'&&BOOT.can_prepare?`<button class="btn small" data-cfx="${c.id}">Cancel</button>`:''}</td></tr>`).join('')||'<tr><td colspan=8 class="muted">No cashflows yet</td></tr>'}</tbody></table></div>`;
  $('#cashflows').innerHTML = h;
  if (!BOOT.can_prepare) return;
  $('#cfUpload').onclick = async()=>{const f=$('#cfFile').files[0]; if(!f) return toast('Choose a file first'); const fd=new FormData(); fd.append('file', f);
    try{const r=await api('POST','/api/trading/cashflows/upload',null,fd); await load(); toast(`Loaded ${r.loaded} cashflows (net ${usd(r.net)}), recorded in the ledger`)}catch(e){toast(e.message)}};
  $('#cfAdd').onclick = async()=>{ try{const r=await api('POST','/api/trading/cashflows',{trade_date:$('#cfDate').value,fund_id:$('#cfFund').value,type:$('#cfType').value,amount:$('#cfAmt').value,source:$('#cfSrc').value,reference:$('#cfRef').value}); await load(); toast(`Cashflow added (${usd(r.net)})`)}catch(e){toast(e.message)} };
  document.querySelectorAll('[data-cfx]').forEach(b=>b.onclick=async()=>{const reason=prompt('Reason for cancelling this cashflow (at least 10 characters)'); if(!reason) return; try{await api('POST',`/api/trading/cashflows/${b.dataset.cfx}/cancel`,{reason}); await load(); toast('Cashflow cancelled')}catch(e){toast(e.message)}});
}

// ------------------------------------------------------------------ Trades
function vTrades(){
  const tls = S.st.trade_lists.filter(t => S.veh==='all' || t.vehicle===S.veh || t.vehicle==='all');
  const dates = [...new Set(S.st.cashflows.filter(c=>c.status==='new'&&fundIds().has(c.fund_id)).map(c=>c.trade_date))].sort();
  let h = '';
  if (BOOT.can_prepare) h += `<div class="card"><h2>Generate trades from cashflows</h2>
   <p class="small muted">Net cashflows per fund are split pro rata across the chosen table. Gaps to target are not closed (that is a rebalance). Securities with no target and excluded securities are not traded; ETF buys keep the cash buffer. Uses the vehicle filter at the top (${S.veh==='all'?'all funds':S.veh==='cit'?'CITs only':'mutual funds only'}).</p>
   <div class="row"><label>Trade date <select id="tgDate">${dates.map(d=>`<option>${d}</option>`).join('')||'<option value="">No new cashflows</option>'}</select></label>
   <label>Allocation strategy <select id="tgStrat">${Object.entries(S.st.strategies).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select></label>
   <button class="btn primary" id="tgGo" ${dates.length?'':'disabled'}>Generate trade list</button></div></div>`;
  if (BOOT.can_approve) h += `<div class="card"><h2>Rebalance to target</h2><p class="small muted">An explicit decision to close the gaps between current holdings and a target table. Uninvested cash is invested; holdings with no target, excluded and exiting securities are left alone; ETF buys keep the cash buffer. <b>Approved proposal</b> uses the latest proposal both PM and Risk approved in the console.</p>
   <div class="row"><label>Target <select id="rbStrat"><option value="approved">Approved proposal</option><option value="neutral">Neutral (glide path)</option><option value="strategic">Strategic</option></select></label>
   <label>Funds <select id="rbFunds"><option value="">All funds in the filter (${funds().length})</option>${funds().map(f=>`<option>${f.id}</option>`).join('')}</select></label>
   <label>Skip drifts under <input type="number" id="rbDrift" value="5" min="0" max="500" step="1" style="width:70px"> bp</label>
   <label>Trade date <input type="date" id="rbDate" value="${localDate()}"></label></div>
   <label class="f" for="rbReason">Reason (kept in the ledger)</label><input type="text" id="rbReason" placeholder="At least 10 characters"><div class="row" style="margin-top:10px"><button class="btn primary" id="rbGo">Create rebalance trade list</button></div></div>`;
  h += `<div class="card"><h2>Trade lists</h2><table><thead><tr><th>Trade list</th><th>Trade date</th><th>Strategy</th><th>Funds</th><th class="n">Orders</th><th class="n">Net flow</th><th class="n">Gross</th><th>Status</th><th>Prepared by</th></tr></thead><tbody>
  ${tls.map(t=>`<tr class="click ${S.tl===t.id?'sel':''}" data-tl="${t.id}"><td><b>${t.id}</b>${t.tranche_summary?' '+chip('Tranched','perm'):''}</td><td>${t.trade_date}</td><td>${esc(t.strategy_name)}</td><td>${t.funds.length}${t.vehicle!=='all'?' · '+vname(t.vehicle):''}</td><td class="n">${t.order_count}</td><td class="n ${sgn(t.net_flow)}">${musd(t.net_flow)}</td><td class="n">${musd(t.gross)}</td><td>${tlChip(t.status)}${t.blocked_funds.length?chip('Blocked','crit'):''}</td><td>${esc(t.created_by.name)}</td></tr>`).join('')||'<tr><td colspan=9 class="muted">None yet</td></tr>'}</tbody></table></div><div id="tlDetail"></div>`;
  $('#trades').innerHTML = h;
  if ($('#rbGo')) $('#rbGo').onclick = async()=>{ try{ const fid=$('#rbFunds').value; const r = await api('POST','/api/trading/rebalance',{strategy:$('#rbStrat').value, trade_date:$('#rbDate').value, min_drift_bps:+$('#rbDrift').value, vehicle:S.veh, fund_ids: fid?[fid]:null, reason:$('#rbReason').value}); S.tl=r.id; await load(); toast(`${r.id}: ${r.order_count} orders for ${r.funds.length} funds, recorded in the ledger`) }catch(e){toast(e.message)} };
  if ($('#tgGo')) $('#tgGo').onclick = async()=>{ try{ const r = await api('POST','/api/trading/trade-lists',{trade_date:$('#tgDate').value, strategy:$('#tgStrat').value, vehicle:S.veh}); S.tl=r.id; await load(); toast(`${r.id}: ${r.order_count} orders for ${r.funds.length} funds, recorded in the ledger`) }catch(e){toast(e.message)} };
  document.querySelectorAll('[data-tl]').forEach(tr=>tr.onclick=()=>{S.tl=tr.dataset.tl;sessionStorage.setItem('tr_tl',S.tl);vTrades()});
  const t = S.st.trade_lists.find(x=>x.id===S.tl); if (t) tlDetail(t);
}
function tlDetail(t){
  const routes = {};
  for (const f of t.funds) for (const o of f.orders) { const r = routes[o.route] ||= {n:0, buy:0, sell:0}; r.n++; r[o.side==='BUY'?'buy':'sell'] += o.est_amount; }
  let h = `<div class="card"><h2>${t.id} · ${tlChip(t.status)} ${t.self_approved?chip('Approved by preparer','warn'):''}</h2>
  <div class="kpis"><div><span class="muted small">Trade date</span><b>${t.trade_date}</b></div><div><span class="muted small">Strategy</span><b>${esc(t.strategy_name)}</b></div><div><span class="muted small">Net cashflow</span><b class="${sgn(t.net_flow)}">${usd(t.net_flow)}</b></div><div><span class="muted small">Orders</span><b>${t.order_count}</b></div><div><span class="muted small">Cash buffer used</span><b>${t.settings_used.buffer_bps} bp</b></div></div>
  <h3>By destination</h3><table><tr><th>Route</th><th class="n">Orders</th><th class="n">Buys</th><th class="n">Sells</th></tr>${Object.entries(routes).map(([k,r])=>`<tr><td>${esc(k)}</td><td class="n">${r.n}</td><td class="n">${usd(r.buy)}</td><td class="n">${usd(r.sell)}</td></tr>`).join('')}</table>
  <p class="small muted">All orders go to Charles River in one import file for its own compliance check and execution; each order carries its destination.</p>
  <div class="row" style="margin:8px 0"><span class="seg" id="tlv"><button data-x="orders" class="${S.tlView==='orders'?'on':''}">Orders</button><button data-x="preview" class="${S.tlView==='preview'?'on':''}">Current vs post-trade</button><button data-x="tranches" class="${S.tlView==='tranches'?'on':''}">Tranches${t.tranche_summary?' ('+t.tranche_summary.orders_tranched+')':''}</button></span></div>`;
  if (S.tlView==='tranches') h += trancheView(t) + (t.status==='draft'&&BOOT.can_prepare ? trancheEditor(t) : '');
  else
  for (const f of t.funds) {
    h += `<details open class="card sub"><summary>${f.fund_id} · ${vname(f.vehicle)} · flow <span class="${sgn(f.flow)}">${usd(f.flow)}</span> · ${f.orders.length} orders · IPS ${compChip({status:f.compliance.ips_status||f.compliance.status})}${f.compliance.regulations?' · regulations '+compChip({status:f.compliance.regulations.some(r=>r.status==='FAIL')?'FAIL':f.compliance.regulations.some(r=>r.status==='WARN')?'WARN':'PASS'}):''} ${f.errors.length?chip('Error','crit'):''}</summary>
    <div class="kpis small"><div>NAV ${musd(f.nav_before)} → <b>${musd(f.nav_after)}</b></div><div>Cash ${musd(f.cash_before)} → <b>${musd(f.cash_after)}</b></div><div>Buffer held <b>${usd(f.buffer_held)}</b> (${f.buffer_bps} bp)</div><div>Rounding left in cash <b>${usd(f.rounding_residual)}</b></div></div>
    ${f.notes.length?`<ul class="small">${f.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}${f.errors.map(e=>`<div class="warnbox">${esc(e)}</div>`).join('')}
    ${f.compliance.results&&f.compliance.results.length?`<div class="warnbox">${f.compliance.results.map(r=>`${esc(r.rule_id)} ${esc(r.status)}: ${esc(r.detail||'')} (measured ${esc(r.measured)}, limit ${esc(r.limit)})`).join('<br>')}</div>`:`<p class="small muted">${esc(f.compliance.detail||'')}${f.compliance.run_id?' · risk model from '+esc(f.compliance.run_id):''}</p>`}`;
    if (S.tlView==='orders') h += `<table><tr><th>Side</th><th>Security</th><th>Type</th><th class="n">Quantity</th><th class="n">Est. price</th><th class="n">Est. amount</th><th>Destination</th></tr>${f.orders.map(o=>`<tr><td class="${o.side==='BUY'?'pos':'neg'}"><b>${o.side}</b></td><td>${esc(o.instrument)}<br><span class="small muted">${esc(o.name)}</span></td><td>${esc(o.type)}</td><td class="n">${o.quantity.toLocaleString('en-US')} <span class="small muted">${o.quantity_type.toLowerCase()}</span></td><td class="n">${usd(o.price,2)}</td><td class="n">${usd(o.est_amount)}</td><td>${esc(o.route)}${o.tranches?'<br>'+chip(o.tranches.length+' tranches','perm'):''}</td></tr>`).join('')||'<tr><td colspan=7 class="muted">No orders</td></tr>'}</table>`;
    else h += `<table><tr><th>Security</th><th class="n">Current</th><th class="n">Current wt</th><th class="n">Trade</th><th class="n">Post-trade</th><th class="n">Post wt</th><th class="n">Target wt</th><th class="n">Post vs target</th></tr>${f.preview.map(r=>`<tr><td>${esc(r.instrument)} ${!r.has_target&&r.type!=='cash'?chip('no target','warn'):''}${r.excluded?chip('excluded','crit'):''}<br><span class="small muted">${esc(r.asset_class)}</span></td><td class="n">${musd(r.current)}</td><td class="n">${pct(r.current_w)}</td><td class="n ${sgn(r.trade)}">${r.trade?usd(r.trade):'—'}</td><td class="n">${musd(r.post)}</td><td class="n">${pct(r.post_w)}</td><td class="n">${r.target_w?pct(r.target_w):'—'}</td><td class="n">${r.target_w?((r.post_w-r.target_w)*10000).toFixed(1)+' bp':'—'}</td></tr>`).join('')}</table>`;
    h += `</details>`;
  }
  if (t.status==='draft' && BOOT.can_approve) h += `<div class="card"><h2>Approve</h2><label class="opt"><input type="checkbox" id="taChk"> <span>I reviewed the orders, the current vs post-trade preview, the IPS check and the notes.</span></label><label class="f" for="taReason">Reason</label><input type="text" id="taReason" placeholder="At least 10 characters"><div class="row" style="margin-top:10px"><button class="btn primary" id="taGo" ${t.blocked_funds.length?'disabled':''}>Approve trade list</button>${t.blocked_funds.length?'<span class="small neg">Blocked by errors or a compliance FAIL</span>':''}</div></div>`;
  else if (t.status==='draft') h += `<p class="small muted">A portfolio manager approves trade lists.</p>`;
  if (['approved','exported'].includes(t.status) && BOOT.can_prepare) h += `<div class="card"><h2>Charles River</h2><p class="small">Download the import file and load it into Charles River, which runs its own compliance check and executes. <b>Mock format</b>: column names are placeholders until mapped to your Charles River import specification. Each download is recorded with a fingerprint (SHA-256).</p><a class="btn primary" id="taCrd" href="/api/trading/trade-lists/${t.id}/crd.csv">Download Charles River import file</a>${(t.exports||[]).map(x=>`<div class="small muted" style="margin-top:6px">Exported ${esc(x.at.slice(0,16).replace('T',' '))} by ${esc(x.by.name)} · ${esc(x.sha256.slice(0,16))}…</div>`).join('')}</div>`;
  if (['exported','filled'].includes(t.status)) {
    const fl = t.fills||{}, n = Object.keys(fl).length;
    h += `<div class="card"><h2>Fills and booking</h2><p class="small">Record what executed so positions and cash update. Upload the fills file (<span class="mono">External Order ID, Filled Quantity, Fill Price, Status</span> = FILLED, PARTIAL or CANCELLED; IDs as in the Charles River file), or in shadow mode mark every open order filled at its estimated price.</p>
     <div class="kpis small"><div>Fill status <b>${esc(t.fill_status||'none')}</b></div><div>Orders with fills <b>${n}</b></div></div>
     ${t.status==='exported'&&BOOT.can_prepare?`<input type="file" id="flFile" accept=".xlsx,.xlsm,.csv"> <button class="btn" id="flUpload">Upload fills</button> <button class="btn primary" id="flAll">Mark all open orders filled at estimated prices</button>`:''}
     ${n?`<details><summary>Fills (${n})</summary><table><tr><th>Order ID</th><th class="n">Ordered</th><th class="n">Filled</th><th class="n">Price</th><th>Status</th></tr>${Object.entries(fl).map(([k,v])=>`<tr><td class="mono small">${esc(k)}</td><td class="n">${v.ordered.toLocaleString('en-US')}</td><td class="n">${v.filled.toLocaleString('en-US')}</td><td class="n">${usd(v.price,2)}</td><td>${esc(v.status)}</td></tr>`).join('')}</table></details>`:''}</div>`;
  }
  if (['draft','approved'].includes(t.status) && BOOT.can_prepare) h += `<div class="row"><button class="btn danger" id="taCancel">Cancel trade list and release cashflows</button></div>`;
  h += `<h3>History</h3><table>${t.history.map(x=>`<tr><td class="small">${esc(x.at.slice(0,16).replace('T',' '))}</td><td>${esc(x.action)}</td><td>${esc(x.by.name)}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></div>`;
  $('#tlDetail').innerHTML = h;
  document.querySelectorAll('#tlv button').forEach(b=>b.onclick=()=>{S.tlView=b.dataset.x;tlDetail(t)});
  bindTranches(t);
  if ($('#taGo')) $('#taGo').onclick = async()=>{ try{ const r=await api('POST',`/api/trading/trade-lists/${t.id}/approve`,{checked:$('#taChk').checked, reason:$('#taReason').value}); await load(); toast('Trade list approved and recorded'+(r.self_approved?' (you also prepared it; this is flagged)':'')) }catch(e){toast(e.message)} };
  if ($('#taCrd')) $('#taCrd').onclick = ()=>setTimeout(load, 1500);
  if ($('#flAll')) $('#flAll').onclick = async()=>{ try{ const r=await api('POST',`/api/trading/trade-lists/${t.id}/fills`,{all:true}); await load(); toast(`Fills booked for ${r.booked_funds.length} funds; status ${r.fill_status}`) }catch(e){toast(e.message)} };
  if ($('#flUpload')) $('#flUpload').onclick = async()=>{ const f=$('#flFile').files[0]; if(!f) return toast('Choose a file first'); const fd=new FormData(); fd.append('file', f); try{ const r=await api('POST',`/api/trading/trade-lists/${t.id}/fills`,null,fd); await load(); toast(`Fills booked for ${r.booked_funds.length} funds; status ${r.fill_status}`) }catch(e){toast(e.message)} };
  if ($('#taCancel')) $('#taCancel').onclick = async()=>{ const reason=prompt('Reason for cancelling (at least 10 characters)'); if(!reason) return; try{await api('POST',`/api/trading/trade-lists/${t.id}/cancel`,{reason}); await load(); toast('Trade list cancelled; its cashflows are available again')}catch(e){toast(e.message)} };
}

// ------------------------------------------------------------------ Routing & settings
function vSettings(){
  const st = S.st.settings, can = BOOT.can_settings, canR = BOOT.can_routes, canPM = BOOT.can_approve;
  const types = Object.keys(st.routes), insts = S.st.instruments;
  const P = S.pend ||= {excluded:(st.excluded||[]).slice(), tilts:(st.tilts||[]).slice(), exits:(st.exits||[]).slice()};
  const instSel = id => `<select id="${id}">${insts.map(i=>`<option value="${i.id}">${esc(i.id)} · ${esc(i.name)}</option>`).join('')}</select>`;
  const fundSel = id => `<select id="${id}"><option value="*">All funds</option>${S.st.funds.map(f=>`<option>${f.id}</option>`).join('')}</select>`;
  const entryRows = (key, extra, edit) => P[key].map((e,i)=>`<tr><td>${esc(e.instrument)}</td><td>${e.fund==='*'?'All funds':esc(e.fund)}</td>${extra(e)}<td>${esc(e.reason||'(this change)')}</td><td>${esc(e.until||'—')}</td><td>${esc(e.by?.name||'(you)')}</td><td>${edit?`<button class="btn small" data-del="${key}:${i}">Remove</button>`:''}</td></tr>`).join('');
  let h = `<div class="card"><h2>Order routing</h2><p class="small muted">Destination by the type of security traded. Charles River receives every order with its destination. Changing a route needs the <b>Trade route manager</b> permission and a reason; every change is recorded in the ledger as <span class="mono">routes.change</span>.</p>
  <table><tr><th>Security type</th><th>Destination</th></tr>${types.map(k=>`<tr><td>${esc(k.replace('_',' '))}</td><td><select data-route="${k}" ${canR?'':'disabled'}>${S.st.route_names.map(n=>`<option ${n===st.routes[k]?'selected':''}>${esc(n)}</option>`).join('')}</select></td></tr>`).join('')}</table>
  <p class="small" id="rtWho">${canR?'':'You do not hold the route permission. '}<span class="muted">Loading who can change routes…</span></p></div>
  <div class="card"><h2>Cash buffer for ETF trades</h2><p class="small muted">Set once for the whole series; it applies to every fund. Each ETF buy is cut by this share and that amount stays in cash, so a price move can't overdraw the account. A fund can only be set stricter.</p>
  <div class="row"><label>Series buffer <input type="number" id="bufBps" min="0" max="500" step="5" value="${st.buffer_bps}" ${can?'':'disabled'} style="width:90px"> bp</label></div>
  <details><summary>Fund overrides (${Object.keys(st.buffer_overrides||{}).length})</summary><table>${S.st.funds.map(f=>`<tr><td>${f.id}</td><td><input type="number" min="0" step="5" data-ovr="${f.id}" value="${(st.buffer_overrides||{})[f.id]??''}" placeholder="series" ${can?'':'disabled'} style="width:90px"> bp</td></tr>`).join('')}</table></details></div>
  <div class="card" id="cardTilts"><h2>Tilts toward or away from holdings</h2><p class="small muted">Adds (+) or removes (−) basis points from a security's weight in whichever allocation table is used. The tilt is funded pro rata from the other holdings, so the table still totals 100%. A fund-specific tilt replaces an all-funds tilt on the same security. Portfolio managers only.</p>
  <table><tr><th>Security</th><th>Fund</th><th class="n">Tilt</th><th>Reason</th><th>Until</th><th>By</th><th></th></tr>${entryRows('tilts', e=>`<td class="n ${sgn(e.bps)}">${e.bps>0?'+':''}${e.bps} bp</td>`, canPM)||'<tr><td colspan=7 class="muted">None</td></tr>'}</table>
  ${canPM?`<div class="row" style="margin-top:8px">${instSel('tiInst')}${fundSel('tiFund')}<input type="number" id="tiBps" placeholder="± bp" step="5" style="width:90px"><input type="date" id="tiUntil" title="Until (optional)"><button class="btn" id="tiAdd">Add tilt</button></div>`:''}</div>
  <div class="card" id="cardExits"><h2>Full exits</h2><p class="small muted">Flag a security to stop trading it: it gets no cashflow trades and no new buys, and its share of each cashflow goes to the other holdings. Then sell the whole position from the fund's page (in one go or in tranches). Portfolio managers only.</p>
  <table><tr><th>Security</th><th>Fund</th><th>Reason</th><th>Until</th><th>By</th><th></th></tr>${entryRows('exits', ()=>'', canPM)||'<tr><td colspan=6 class="muted">None</td></tr>'}</table>
  ${canPM?`<div class="row" style="margin-top:8px">${instSel('exitInst')}${fundSel('exitFund')}<button class="btn" id="exitAdd">Flag for exit</button></div>`:''}</div>
  <div class="card" id="cardExcl"><h2>Excluded from trading</h2><p class="small muted">Excluded securities keep their position and are not traded.</p>
  <label>When excluded, its share of a cashflow <select id="exShare" ${can?'':'disabled'}><option value="redistribute" ${st.excluded_share!=='cash'?'selected':''}>is spread over the other holdings</option><option value="cash" ${st.excluded_share==='cash'?'selected':''}>stays in cash</option></select></label>
  <table style="margin-top:8px"><tr><th>Security</th><th>Fund</th><th>Reason</th><th>Until</th><th>By</th><th></th></tr>${entryRows('excluded', ()=>'', can)||'<tr><td colspan=6 class="muted">None</td></tr>'}</table>
  ${can?`<div class="row" style="margin-top:8px">${instSel('exInst')}${fundSel('exFund')}<input type="date" id="exUntil" title="Until (optional)"><button class="btn" id="exAdd">Add exclusion</button></div>`:''}</div>`;
  if (can||canR||canPM) h += `<div class="card"><label class="f" for="setReason">Reason for these changes</label><input type="text" id="setReason" placeholder="At least 10 characters"><div class="row" style="margin-top:10px"><button class="btn primary" id="setSave">Save settings</button><span class="small muted">Everything changed on this tab is saved together and recorded.</span></div></div>`;
  else h += `<p class="small muted">Portfolio managers and admins change these settings; routes need the Trade route manager permission.</p>`;
  const recs = S.st.trading_records.slice().reverse();
  h += `<div class="card"><h2>Trading change log (${recs.length})</h2><p class="small muted">From the hash-chained governance ledger. Compliance and Audit can also search it in the console's Decision ledger.</p><table><tr><th>When</th><th>Step</th><th>Who</th><th>What</th><th>Reason</th></tr>${recs.slice(0,60).map(r=>`<tr><td class="small">${esc(r.created_at.slice(0,16).replace('T',' '))}</td><td class="mono">${esc(r.step)}</td><td>${esc(r.actor.id)}</td><td>${esc(r.summary)}</td><td class="small">${esc(r.rationale)}</td></tr>`).join('')||'<tr><td colspan=5 class="muted">No trading records yet</td></tr>'}</table></div>`;
  $('#settings').innerHTML = h;
  api('GET','/api/trading/route-managers').then(j=>{ const e=$('#rtWho'); if(!e) return; e.innerHTML = (canR?'':'You do not hold the route permission. ') + (j.holders.length ? 'Can change routes now: <b>'+j.holders.map(x=>esc(x.name)+(x.enabled?'':' (disabled)')).join(', ')+'</b>.' : '<b>Nobody holds the route permission yet.</b>') + ' <span class="muted">An admin switches it on or off in User access, where the access log shows who granted it and when.</span>'; }).catch(()=>{});
  const add = (btn, fn) => { if ($(btn)) $(btn).onclick = () => { const e = fn(); if (e) { toast('Added; give a reason and save'); vSettings(); } }; };
  add('#exAdd', ()=>P.excluded.push({instrument:$('#exInst').value, fund:$('#exFund').value, until:$('#exUntil').value, reason:''}));
  add('#exitAdd', ()=>P.exits.push({instrument:$('#exitInst').value, fund:$('#exitFund').value, reason:''}));
  add('#tiAdd', ()=>{ const b=+$('#tiBps').value; if(!b){toast('Enter the tilt in basis points, e.g. 50 or -25'); return 0;} return P.tilts.push({instrument:$('#tiInst').value, fund:$('#tiFund').value, bps:b, until:$('#tiUntil').value, reason:''}); });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const [k,i]=b.dataset.del.split(':'); P[k].splice(+i,1); vSettings(); });
  if ($('#setSave')) $('#setSave').onclick = async()=>{
    const body = {reason: $('#setReason').value};
    if (canR) body.routes = Object.fromEntries([...document.querySelectorAll('[data-route]')].map(s=>[s.dataset.route, s.value]));
    if (can) Object.assign(body, {buffer_bps:+$('#bufBps').value, buffer_overrides:Object.fromEntries([...document.querySelectorAll('[data-ovr]')].filter(i=>i.value!=='').map(i=>[i.dataset.ovr, +i.value])), excluded:P.excluded, excluded_share:$('#exShare').value});
    if (canPM) Object.assign(body, {tilts:P.tilts, exits:P.exits});
    try{ const r = await api('PUT','/api/trading/settings',body); S.pend=null; await load(); toast('Saved and recorded: '+r.changed.join(', ')) }catch(e){toast(e.message)}
  };
}

// ------------------------------------------------------------------ Tranches (trade bucket)
const okey = (f,i) => f+'|'+i;
function trancheView(t){
  const sm = t.tranche_summary;
  if (!sm) return `<p class="small muted">No tranches: every order trades in full on ${t.trade_date}.</p>`;
  let h = `<h3>Bucket by date</h3><table><tr><th>Date</th><th class="n">Tranche orders</th><th class="n">Buys</th><th class="n">Sells</th></tr>${sm.by_date.map(d=>`<tr><td>${d.date}</td><td class="n">${d.orders}</td><td class="n">${usd(d.buys)}</td><td class="n">${usd(d.sells)}</td></tr>`).join('')}</table>
  <p class="small">${sm.orders_tranched} orders tranched · ${sm.orders_whole} trade in full on ${t.trade_date}. Checks passed: ${sm.checks.map(c=>'✓ '+esc(c)).join(' · ')}</p>`;
  for (const f of t.funds) {
    h += `<details open class="card sub"><summary>${f.fund_id} · ${f.orders.length} orders</summary><table><tr><th>Security</th><th>Side</th><th>Series</th><th>Tranche</th><th>Date</th><th class="n">%</th><th class="n">Quantity</th><th class="n">Est. amount</th></tr>`;
    for (const o of f.orders) {
      const tr = o.tranches || [{n:1, date:t.trade_date, pct:100, quantity:o.quantity, est_amount:o.est_amount}];
      tr.forEach((x,i)=>{ h += `<tr>${i===0?`<td rowspan="${tr.length}"><b>${esc(o.instrument)}</b><br><span class="small muted">${o.quantity.toLocaleString('en-US')} ${o.quantity_type.toLowerCase()} · ${usd(o.est_amount)}</span></td><td rowspan="${tr.length}" class="${o.side==='BUY'?'pos':'neg'}">${o.side}</td><td rowspan="${tr.length}">${o.tranches?chip(({list:'Whole list',fund:'Fund',security:'Security'})[o.tranche_level],'perm'):chip('Not tranched')}</td>`:''}<td>${x.n} of ${tr.length}</td><td>${x.date}</td><td class="n">${(+x.pct).toFixed(2)}%</td><td class="n">${x.quantity.toLocaleString('en-US')}</td><td class="n">${usd(x.est_amount)}</td></tr>`; });
    }
    h += `</table></details>`;
  }
  return h;
}
function nextWeekday(d){ const x=new Date(d+'T12:00:00Z'); do { x.setUTCDate(x.getUTCDate()+1) } while ([0,6].includes(x.getUTCDay())); return x.toISOString().slice(0,10); }
function trancheEditor(t){
  if (!S.plan || S.planFor!==t.id) { const p=t.tranche_plan||{}; S.plan={default:p.default||null, funds:{...(p.funds||{})}, securities:{...(p.securities||{})}, excluded:[...(p.excluded||[])]}; S.planFor=t.id; S.sched=[{date:t.trade_date,pct:50},{date:nextWeekday(t.trade_date),pct:50}]; }
  const P = S.plan, tot = S.sched.reduce((a,x)=>a+(+x.pct||0),0);
  const scopes = [`<option value="list">Whole trade list</option>`, ...t.funds.map(f=>`<option value="fund:${f.fund_id}">Fund ${f.fund_id}</option>`), ...t.funds.flatMap(f=>f.orders.map(o=>`<option value="sec:${okey(f.fund_id,o.instrument)}">Security ${f.fund_id} · ${esc(o.instrument)}</option>`))];
  const fmt = s => s.map(x=>`${x.date} ${(+x.pct).toFixed(2).replace(/\.00$/,'')}%`).join(', ');
  const lines = [];
  if (P.default) lines.push(['Whole trade list', fmt(P.default), 'list']);
  for (const [k,v] of Object.entries(P.funds)) lines.push(['Fund '+k, fmt(v), 'fund:'+k]);
  for (const [k,v] of Object.entries(P.securities)) lines.push(['Security '+k.replace('|',' · '), fmt(v), 'sec:'+k]);
  for (const k of P.excluded) lines.push(['Security '+k.replace('|',' · '), 'Not tranched: trades in full on '+t.trade_date, 'exc:'+k]);
  return `<div class="card"><h2>Tranche this trade list</h2><p class="small muted">Build a series of dates and percentages, then apply it to the whole list, one fund or one security. The most specific series wins (security, then fund, then whole list), so you can run several series in one bucket. Percentages can be equal or unequal and must total 100%.</p>
  <table id="trSched"><tr><th>#</th><th>Date</th><th class="n">% of order</th><th></th></tr>${S.sched.map((x,i)=>`<tr><td>${i+1}</td><td><input type="date" data-sd="${i}" value="${x.date}"></td><td class="n"><input type="number" data-sp="${i}" value="${x.pct}" min="0" max="100" step="0.01" style="width:100px"></td><td>${S.sched.length>1?`<button class="btn small" data-sx="${i}">Remove</button>`:''}</td></tr>`).join('')}<tr><td></td><td><b>Total</b></td><td class="n"><b id="trTot" class="${Math.abs(tot-100)>0.01?'neg':'pos'}">${tot.toFixed(2)}%</b></td><td></td></tr></table>
  <div class="row" style="margin-top:8px"><button class="btn" id="trAddDate">Add a date</button><button class="btn" id="trEqual">Split equally</button></div>
  <div class="row" style="margin-top:8px"><label>Apply to <select id="trScope">${scopes.join('')}</select></label><button class="btn" id="trApply">Apply series</button><button class="btn" id="trExclude">Don't tranche this security</button></div>
  <h3>Series in this bucket</h3><table>${lines.map(l=>`<tr><td>${esc(l[0])}</td><td>${esc(l[1])}</td><td><button class="btn small" data-pl="${esc(l[2])}">Remove</button></td></tr>`).join('')||'<tr><td class="muted">None yet</td></tr>'}</table>
  <div class="row" style="margin-top:10px"><input type="text" id="trNote" placeholder="Note (optional)" style="max-width:320px"><button class="btn primary" id="trSave">Save tranches</button><span class="small muted">Saving runs the data checks and records the plan.</span></div></div>`;
}
function bindTranches(t){
  if (!$('#trSave')) return;
  const redraw = () => tlDetail(t);
  document.querySelectorAll('[data-sd]').forEach(i=>i.onchange=()=>{S.sched[+i.dataset.sd].date=i.value});
  document.querySelectorAll('[data-sp]').forEach(i=>i.oninput=()=>{S.sched[+i.dataset.sp].pct=+i.value||0; const tt=S.sched.reduce((a,x)=>a+(+x.pct||0),0); const e=$('#trTot'); e.textContent=tt.toFixed(2)+'%'; e.className=Math.abs(tt-100)>0.01?'neg':'pos'});
  document.querySelectorAll('[data-sx]').forEach(b=>b.onclick=()=>{S.sched.splice(+b.dataset.sx,1); redraw()});
  $('#trAddDate').onclick=()=>{S.sched.push({date:nextWeekday(S.sched[S.sched.length-1].date), pct:0}); redraw()};
  $('#trEqual').onclick=()=>{const n=S.sched.length, each=Math.floor(10000/n)/100; S.sched.forEach((x,i)=>x.pct=i===n-1?+(100-each*(n-1)).toFixed(2):each); redraw()};
  $('#trApply').onclick=()=>{ const tt=S.sched.reduce((a,x)=>a+(+x.pct||0),0); if(Math.abs(tt-100)>0.01) return toast(`Percentages add up to ${tt.toFixed(2)}%, not 100%`);
    const v=$('#trScope').value, sch=S.sched.map(x=>({date:x.date,pct:+x.pct}));
    if (v==='list') S.plan.default=sch; else if (v.startsWith('fund:')) S.plan.funds[v.slice(5)]=sch; else { const k=v.slice(4); S.plan.securities[k]=sch; S.plan.excluded=S.plan.excluded.filter(x=>x!==k); }
    redraw(); };
  $('#trExclude').onclick=()=>{ const v=$('#trScope').value; if(!v.startsWith('sec:')) return toast('Choose a security in "Apply to" first'); const k=v.slice(4); delete S.plan.securities[k]; if(!S.plan.excluded.includes(k)) S.plan.excluded.push(k); redraw(); };
  document.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{ const v=b.dataset.pl; if(v==='list') S.plan.default=null; else if(v.startsWith('fund:')) delete S.plan.funds[v.slice(5)]; else if(v.startsWith('sec:')) delete S.plan.securities[v.slice(4)]; else S.plan.excluded=S.plan.excluded.filter(x=>x!==v.slice(4)); redraw(); });
  $('#trSave').onclick=async()=>{ try{ const r=await api('PUT',`/api/trading/trade-lists/${t.id}/tranches`,{...S.plan, note:$('#trNote').value}); S.plan=null; S.tlView='tranches'; await load(); toast(r.tranche_summary?`Tranches saved: ${r.tranche_summary.orders_tranched} orders across ${r.tranche_summary.by_date.length} dates; checks passed`:'Tranches cleared') }catch(e){toast(e.message)} };
}

// ------------------------------------------------------------------ Tickets and exits (fund page)
function ticketCard(d){
  if (!BOOT.can_prepare) return '';
  const today = localDate();
  S.tk ||= [{instrument:d.rows[0].instrument, side:'BUY', amount:''}];
  const exiting = d.rows.filter(r=>r.exiting && r.value>0);
  return `<div class="card"><h2>Trade individual securities</h2><p class="small muted">Hand-entered orders in this fund. Buys are paid from the fund's cash and sells add to it. The ticket becomes a draft trade list with the same preview, IPS check, approval, tranching and Charles River export.</p>
  <table>${S.tk.map((x,i)=>`<tr><td><select data-tki="${i}">${d.rows.map(r=>`<option value="${r.instrument}" ${r.instrument===x.instrument?'selected':''}>${esc(r.instrument)} · ${r.value?musd(r.value)+' held':'not held'}</option>`).join('')}</select></td><td><select data-tks="${i}"><option ${x.side==='BUY'?'selected':''}>BUY</option><option ${x.side==='SELL'?'selected':''}>SELL</option></select></td><td><input type="number" data-tka="${i}" value="${x.amount}" placeholder="Amount (USD)" min="0" step="1000" style="width:160px"></td><td>${S.tk.length>1?`<button class="btn small" data-tkx="${i}">Remove</button>`:''}</td></tr>`).join('')}</table>
  <div class="row" style="margin-top:8px"><button class="btn" id="tkAdd">Add another security</button><label>Trade date <input type="date" id="tkDate" value="${today}"></label></div>
  <label class="f" for="tkReason">Reason</label><input type="text" id="tkReason" placeholder="At least 10 characters"><div class="row" style="margin-top:10px"><button class="btn primary" id="tkGo">Create ticket</button></div>
  ${exiting.length?`<h3>Full exit</h3><p class="small">Flagged for exit and still held: <b>${exiting.map(r=>esc(r.instrument)).join(', ')}</b>. This creates a draft trade list that sells each whole position (you can tranche it before approval). Uses the trade date and reason above.</p><button class="btn danger" id="tkExit">Create exit trade list</button>`:''}</div>`;
}
function bindTicket(d){
  if (!$('#tkGo')) return;
  const sync = () => { document.querySelectorAll('[data-tki]').forEach(e=>S.tk[+e.dataset.tki].instrument=e.value); document.querySelectorAll('[data-tks]').forEach(e=>S.tk[+e.dataset.tks].side=e.value); document.querySelectorAll('[data-tka]').forEach(e=>S.tk[+e.dataset.tka].amount=e.value); };
  $('#tkAdd').onclick=()=>{sync(); S.tk.push({instrument:d.rows[0].instrument, side:'BUY', amount:''}); openFund(S.fund,true)};
  document.querySelectorAll('[data-tkx]').forEach(b=>b.onclick=()=>{sync(); S.tk.splice(+b.dataset.tkx,1); openFund(S.fund,true)});
  const send = async (body, msg) => { try{ const r=await api('POST','/api/trading/tickets',{fund_id:S.fund, trade_date:$('#tkDate').value, reason:$('#tkReason').value, ...body}); S.tk=null; S.tl=r.id; S.tab='trades'; sessionStorage.setItem('tr_tab','trades'); await load(); toast(`${r.id}: ${msg}, ${r.order_count} orders, recorded in the ledger`) }catch(e){toast(e.message)} };
  $('#tkGo').onclick=()=>{sync(); send({orders:S.tk.map(x=>({instrument:x.instrument, side:x.side, amount:+x.amount||0}))}, 'ticket created')};
  if ($('#tkExit')) $('#tkExit').onclick=()=>send({kind:'exit', orders:d.rows.filter(r=>r.exiting&&r.value>0).map(r=>({instrument:r.instrument}))}, 'exit trade list created');
}

document.querySelectorAll('#veh button').forEach(b=>b.onclick=()=>{S.veh=b.dataset.v;sessionStorage.setItem('tr_veh',S.veh);render()});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.pend=null;S.tab=b.dataset.tab;sessionStorage.setItem('tr_tab',S.tab);render()});
S.tl = sessionStorage.getItem('tr_tl');
$('#who').textContent = BOOT.user.name + ' · ' + BOOT.user.roles.filter(r=>!['investment_committee','chief_compliance_officer','route_manager'].includes(r)).join(', ');
load().catch(e=>toast(e.message));
</script></body></html>
