<!-- Meridian shared shell: app bar, My work, dialogs, toasts, busy states, session expiry, accessibility -->
<style id="mshell-css">
:root{--appbar-h:52px}
.mskip{position:absolute;left:8px;top:-60px;z-index:1000;background:var(--accent,#1f4e8c);color:var(--accent-ink,#fff);padding:8px 12px;border-radius:var(--radius-sm,6px);text-decoration:none;font:600 14px ui-sans-serif,system-ui,sans-serif}
.mskip:focus{top:8px}
.mbar{position:sticky;top:0;z-index:50;height:var(--appbar-h);display:flex;align-items:center;gap:6px;padding:0 16px;background:var(--appbar-bg,#14233b);color:var(--appbar-text,#f3f5f9);
  font:14px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.mbar a,.mbar button{color:inherit;font:inherit}
.mbar .mbrand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;text-decoration:none;margin-right:14px;white-space:nowrap}
.mbar .mbrand img{height:24px;width:auto;display:block}.mbar .mbrand .mco{font-weight:400;font-size:12px;color:var(--appbar-muted,#c9d3e3);border-left:1px solid rgba(255,255,255,.3);padding-left:8px}
.mbar .mbrand i{display:inline-block;width:22px;height:22px;border-radius:var(--radius-sm,6px);background:var(--appbar-mark,linear-gradient(135deg,#7aa7e6,#2f6bc1))}
.mbar nav{display:flex!important;flex-direction:row!important;gap:2px!important;height:100%;align-items:stretch;overflow-x:auto;scrollbar-width:none}
.mbar nav a{display:flex;align-items:center;padding:0 12px;text-decoration:none;color:var(--appbar-muted,#c9d3e3);border-bottom:3px solid transparent;white-space:nowrap}
.mbar nav a:hover{color:var(--appbar-text,#fff);background:rgba(255,255,255,.06)}
.mbar nav a[aria-current=page]{color:var(--appbar-text,#fff);border-bottom-color:var(--appbar-accent,#7aa7e6);font-weight:600}
.mbar .msp{flex:1}
.mbar .mbtn{background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:var(--radius-sm,8px);padding:6px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none}
.mbar .mbtn:hover{background:rgba(255,255,255,.08)}
.mbar .mbadge{min-width:20px;padding:0 6px;border-radius:999px;background:var(--appbar-badge,#e0b25a);color:var(--appbar-badge-text,#14233b);font-weight:700;font-size:12px;text-align:center}
.mbar .mbadge.crit{background:var(--appbar-badge-crit,#ef8a80)}.mbar .mbadge.zero{background:rgba(255,255,255,.18);color:#fff}
.mpop{position:fixed;right:12px;top:calc(var(--appbar-h) + 4px);width:min(440px,94vw);max-height:70vh;overflow:auto;background:var(--surface,#fff);color:var(--text,#111);
  border:1px solid var(--line,#ddd);border-radius:var(--radius-lg,12px);box-shadow:0 12px 32px rgba(0,0,0,.22);z-index:60;padding:8px}
.mpop h2{font-size:14px;margin:6px 8px 8px}.mpop .mhint{font-size:12px;color:var(--muted,#777);margin:0 8px 8px}
.mpop a.mi{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:start;padding:9px 8px;border-radius:var(--radius-sm,8px);text-decoration:none;color:inherit}
.mpop a.mi:hover,.mpop a.mi:focus{background:var(--surface-2,#f0efec);outline:none}
.mpop .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--accent,#7aa7e6)}.mpop .dot.warn{background:#d39a2a}.mpop .dot.crit{background:#c0392b}
.mpop .mt{font-weight:600;font-size:13px}.mpop .md{font-size:12px;color:var(--muted,#777)}.mpop .mk{font-size:11px;color:var(--muted,#777);white-space:nowrap;text-align:right}
.mpop .mempty{padding:18px 8px;text-align:center;color:var(--muted,#777);font-size:13px}
.muser{font-size:12px;color:var(--appbar-muted,#c9d3e3);text-align:right;line-height:1.2;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muser b{color:var(--appbar-text,#fff);font-size:13px}
@media (max-width:900px){.muser{display:none}.mbar nav a{padding:0 8px}.mbar .mlabel{display:none}}
/* focus + motion */
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--focus,#2f6bc1);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* busy */
[aria-busy=true]{position:relative;cursor:progress!important;opacity:.75}
button[aria-busy=true]::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:mspin .7s linear infinite}
@keyframes mspin{to{transform:rotate(360deg)}}
/* toasts */
#mtoasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(440px,92vw)}
.mtoast{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--radius-lg,10px);box-shadow:0 8px 24px rgba(0,0,0,.2);font:13px/1.4 ui-sans-serif,system-ui,sans-serif;
  background:var(--appbar-bg,#14233b);color:var(--appbar-text,#fff);border-left:4px solid var(--appbar-accent,#7aa7e6)}
.mtoast.success{border-left-color:var(--ok,#3aa66b)}.mtoast.error{background:#4a1714;border-left-color:#ef8a80}.mtoast.warn{border-left-color:#e0b25a}
.mtoast .mx{margin-left:auto;background:none;border:0;color:inherit;cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
#toast{display:none!important}
/* dialogs */
dialog.mdlg{border:0;border-radius:var(--radius-lg,14px);padding:0;width:min(520px,94vw);background:var(--surface,#fff);color:var(--text,#111);box-shadow:0 24px 64px rgba(0,0,0,.35)}
dialog.mdlg::backdrop{background:rgba(10,16,28,.45)}
dialog.mdlg form{padding:20px 22px}dialog.mdlg h2{margin:0 0 8px;font-size:17px}
dialog.mdlg p{margin:0 0 12px;color:var(--text-2,#444);font-size:14px;white-space:pre-line}
dialog.mdlg label{display:block;font-size:12px;color:var(--text-2,#444);margin:8px 0 4px;font-weight:600}
dialog.mdlg textarea{width:100%;min-height:76px;padding:8px 10px;border:1px solid var(--line-strong,#ccc);border-radius:var(--radius-sm,8px);background:var(--surface,#fff);color:inherit;font:inherit;box-sizing:border-box}
dialog.mdlg .mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
dialog.mdlg .mb{border:1px solid var(--line-strong,#ccc);background:var(--surface,#fff);color:inherit;padding:8px 14px;border-radius:var(--radius-sm,8px);cursor:pointer;font:inherit;font-weight:600}
dialog.mdlg .mb.p{background:var(--accent,#1f4e8c);border-color:var(--accent,#1f4e8c);color:var(--accent-ink,#fff)}dialog.mdlg .mb.d{background:var(--crit,#a3261b);border-color:var(--crit,#a3261b);color:#fff}
dialog.mdlg .mb:disabled{opacity:.5;cursor:not-allowed}
/* reason counter */
.mcount{display:block;font-size:11px;color:var(--muted,#777);margin-top:3px}.mcount.ok{color:var(--ok,#1d7a46)}
/* page headers become slim sub-headers under the app bar */
body>header{position:static}
.mbar ~ .app aside{top:var(--appbar-h);height:calc(100vh - var(--appbar-h))}
.mbar ~ .app aside .brand{display:none}
</style>
<script>
(function(){
'use strict';
const NAV = () => window.MERIDIAN_NAV || null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MUI = window.MUI = {};

/* ---------- toasts: info / success / warn auto-dismiss; errors stay until closed ---------- */
function region(){let r=document.getElementById('mtoasts');if(!r){r=document.createElement('div');r.id='mtoasts';r.setAttribute('aria-live','polite');r.setAttribute('role','status');document.body.appendChild(r)}return r}
MUI.toast = function(msg, type){
  type = type || (/^(error|failed|cannot|blocked|forbidden|not allowed|denied)\b/i.test(String(msg))?'error':
                  /\b(recorded|saved|approved|created|added|updated|cancelled|booked|exported|invited|removed|applied)\b/i.test(String(msg))?'success':'info');
  const t=document.createElement('div'); t.className='mtoast '+type; if(type==='error') t.setAttribute('role','alert');
  t.innerHTML=`<span>${esc(msg)}</span><button class="mx" aria-label="Dismiss">×</button>`;
  t.querySelector('.mx').onclick=()=>t.remove(); region().appendChild(t);
  if(type!=='error') setTimeout(()=>t.remove(), type==='warn'?7000:4500);
  while(region().children.length>4) region().firstChild.remove();
};

/* ---------- dialogs: replace browser prompts with accessible in-page dialogs ---------- */
function dlg(opts){
  return new Promise(resolve=>{
    const d=document.createElement('dialog'); d.className='mdlg'; const id='md'+Math.random().toString(36).slice(2,8);
    const min=opts.minLength||0, field=opts.input;
    d.setAttribute('aria-labelledby',id+'t');
    d.innerHTML=`<form method="dialog"><h2 id="${id}t">${esc(opts.title||'Confirm')}</h2>${opts.message?`<p>${esc(opts.message)}</p>`:''}
      ${field?`<label for="${id}i">${esc(opts.label||'Reason')}${min&&opts.match==null?` <span style="font-weight:400">(at least ${min} characters)</span>`:''}</label><textarea id="${id}i" data-minlen="${min}">${esc(opts.value||'')}</textarea>`:''}
      <div class="mrow"><button type="button" class="mb" value="cancel">${esc(opts.cancelText||'Cancel')}</button>
      <button type="submit" class="mb ${opts.danger?'d':'p'}" value="ok">${esc(opts.okText||'Confirm')}</button></div></form>`;
    document.body.appendChild(d);
    const ta=d.querySelector('textarea'), ok=d.querySelector('[value=ok]');
    const bad=()=>ta && (ta.value.trim().length<min || (opts.match!=null && ta.value.trim()!==opts.match));
    const check=()=>{ if(ta) ok.disabled = bad(); };
    if(ta){ ta.addEventListener('input',check); check(); }
    let result=null;
    d.querySelector('[value=cancel]').onclick=()=>d.close();
    d.querySelector('form').addEventListener('submit',e=>{ if(bad()){e.preventDefault();return} result = ta ? ta.value.trim() : true; });
    d.addEventListener('close',()=>{ d.remove(); resolve(result); });
    d.showModal(); (ta||ok).focus();
  });
}
MUI.confirm = (title, message, o={}) => dlg({title, message, okText:o.okText||'Confirm', danger:o.danger}).then(v=>!!v);
MUI.ask = (title, o={}) => dlg({title, message:o.message, input:true, label:o.label||'Reason', minLength:o.minLength??10, cancelText:o.cancelText||'Go back',
                                okText:o.okText||'Submit', danger:o.danger, value:o.value, match:o.match});
/* Management style editor, from anywhere: MUI.editStyles({funds:[{id, label, style}], csrf}) -> saved styles or null.
   One fund or many: a style per fund (or one for all), a reason, saved to PUT /api/trading/fund-styles. */
MUI.editStyles = (o) => new Promise(resolve=>{
  const ST=[['active','Active'],['passive','Passive'],['hybrid','Hybrid']], fs=o.funds||[];
  const d=document.createElement('dialog'); d.className='mdlg msty'; d.setAttribute('aria-labelledby','mstyT');
  const sel=(id,v)=>`<select data-msty="${esc(id)}" aria-label="Management style ${esc(id)}"><option value="" ${!v?'selected':''}>Not set</option>${ST.map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('')}</select>`;
  d.innerHTML=`<form method="dialog"><h2 id="mstyT">Management style${fs.length===1?': '+esc(fs[0].id):''}</h2>
    <p>Active: security selection and tilts away from the glide path. Passive: index holdings that follow the glide path. Hybrid: a passive core with active sleeves. Recorded in the ledger with your reason.</p>
    ${fs.length>1?`<div class="mrow" style="justify-content:flex-start;gap:6px;margin:0 0 6px"><span style="font-size:12px">Set all to</span>${ST.map(([k,l])=>`<button type="button" class="mb" data-mstyall="${k}">${l}</button>`).join('')}</div>`:''}
    <div style="max-height:46vh;overflow:auto"><table style="width:100%;font-size:13px;border-collapse:collapse">${fs.map(f=>`<tr><td style="padding:3px 6px"><b>${esc(f.id)}</b> <span style="color:var(--muted)">${esc(f.label||'')}</span></td><td style="padding:3px 6px;text-align:right">${sel(f.id,f.style)}</td></tr>`).join('')}</table></div>
    <label for="mstyR">Reason <span style="font-weight:400">(at least 10 characters)</span></label><textarea id="mstyR"></textarea>
    <div class="msty-err" role="alert" style="color:var(--crit,#b42318);font-size:13px;min-height:1em"></div>
    <div class="mrow"><button type="button" class="mb" value="cancel">Cancel</button><button type="submit" class="mb p" value="ok">Save</button></div></form>`;
  document.body.appendChild(d);
  const ta=d.querySelector('textarea'), ok=d.querySelector('[value=ok]'), err=d.querySelector('.msty-err');
  const check=()=>{ ok.disabled=ta.value.trim().length<10; }; ta.addEventListener('input',check); check();
  d.querySelectorAll('[data-mstyall]').forEach(b=>b.onclick=()=>d.querySelectorAll('[data-msty]').forEach(x=>x.value=b.dataset.mstyall));
  let result=null;
  d.querySelector('[value=cancel]').onclick=()=>d.close();
  d.querySelector('form').addEventListener('submit',async e=>{ e.preventDefault();
    const funds={}; d.querySelectorAll('[data-msty]').forEach(x=>{ const f=fs.find(z=>z.id===x.dataset.msty); if((f.style||'')!==x.value) funds[f.id]=x.value||null; });
    if(!Object.keys(funds).length){ err.textContent='Nothing changed'; return; }
    ok.disabled=true; err.textContent='';
    try{ const r=await fetch('/api/trading/fund-styles',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':o.csrf},body:JSON.stringify({funds, reason:ta.value.trim()})});
      const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(typeof j.detail==='string'?j.detail:'Could not save ('+r.status+')');
      result=j; MUI.toast(`Management style saved for ${Object.keys(funds).length} fund${Object.keys(funds).length===1?'':'s'} and recorded`); d.close();
    }catch(x){ err.textContent=x.message; ok.disabled=false; } });
  d.addEventListener('close',()=>{ d.remove(); resolve(result); });
  d.showModal(); (d.querySelector('[data-msty]')||ta).focus();
});

/* ---------- fetch: busy state on the button that started it; session expiry dialog ---------- */
let lastBtn=null, lastAt=0, expiredShown=false;
document.addEventListener('click',e=>{const b=e.target.closest('button, .btn'); if(b && !b.closest('.mbar,dialog,#mtoasts')){lastBtn=b;lastAt=performance.now()}},true);
const _fetch = window.fetch.bind(window);
window.fetch = async function(input, init){
  const url = typeof input==='string'?input:(input&&input.url)||'';
  const method = ((init&&init.method)||'GET').toUpperCase();
  let btn=null;
  if(method!=='GET' && lastBtn && performance.now()-lastAt<400 && !lastBtn.disabled){btn=lastBtn;btn.setAttribute('aria-busy','true');btn.disabled=true;}
  try{
    const r = await _fetch(input, init);
    if(r.status===401 && !expiredShown && !/\/api\/my-work/.test(url)){
      expiredShown=true;
      dlg({title:'Your session has expired', message:'For security, you were signed out after a period of inactivity. Sign in again to continue; anything you had not saved will need to be re-entered.', okText:'Sign in', cancelText:'Stay on page'})
        .then(v=>{expiredShown=false; if(v) location.href='/login?go=1'});
    }
    return r;
  } finally { if(btn){btn.removeAttribute('aria-busy');btn.disabled=false;} }
};

/* ---------- reason fields: live character counter (server requires 10+) ---------- */
function isReason(el){return el && el.matches && el.matches('input[type=text],input:not([type]),textarea') && !el.closest('dialog') &&
  (/reason|rationale|justification/i.test((el.id||'')+' '+(el.name||'')+' '+(el.placeholder||'')+' '+(el.getAttribute('aria-label')||'')))}
function counter(el){
  const min = +(el.dataset.minlen||10); let c = el.nextElementSibling;
  if(!c || !c.classList.contains('mcount')){ c=document.createElement('span'); c.className='mcount'; c.setAttribute('aria-live','polite'); el.insertAdjacentElement('afterend',c);
    if(!el.id) el.id='r'+Math.random().toString(36).slice(2,8); c.id=el.id+'-cnt'; el.setAttribute('aria-describedby',c.id); }
  const n=el.value.trim().length; c.textContent = n>=min ? `✓ ${n} characters` : `${n}/${min} characters minimum`; c.classList.toggle('ok', n>=min);
}
document.addEventListener('input',e=>{ if(isReason(e.target)) counter(e.target) });
document.addEventListener('focusin',e=>{ if(isReason(e.target)) counter(e.target) });

/* ---------- tab bars: ARIA roles + arrow-key navigation ---------- */
function syncTabs(root){
  (root||document).querySelectorAll('.tabs, #nav').forEach(bar=>{
    if(bar.id!=='nav') bar.setAttribute('role','tablist');
    bar.querySelectorAll('button').forEach(b=>{ const on=b.classList.contains('active');
      if(bar.id==='nav'){ b.setAttribute('aria-current', on?'page':'false'); }
      else { b.setAttribute('role','tab'); b.setAttribute('aria-selected', on?'true':'false'); b.tabIndex = on?0:-1; } });
  });
}
document.addEventListener('keydown',e=>{
  const b=e.target.closest && e.target.closest('[role=tablist] button'); if(!b) return;
  const all=[...b.parentElement.querySelectorAll('button')]; let i=all.indexOf(b);
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ i=(i+(e.key==='ArrowRight'?1:-1)+all.length)%all.length; }
  else if(e.key==='Home') i=0; else if(e.key==='End') i=all.length-1; else return;
  e.preventDefault(); all[i].focus(); all[i].click();
});
let _st=0;new MutationObserver(()=>{if(_st)return;_st=requestAnimationFrame(()=>{_st=0;syncTabs()})}).observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class'],childList:true});

/* ---------- My work ---------- */
let work=null, pop=null;
async function loadWork(){
  try{ const r=await _fetch('/api/my-work',{credentials:'same-origin'}); if(!r.ok) return; work=await r.json(); }catch(e){ return; }
  const b=document.getElementById('mworkN'); if(!b) return;
  const crit=work.items.some(i=>i.severity==='crit');
  b.textContent=work.count; b.className='mbadge'+(work.count===0?' zero':crit?' crit':'');
  document.getElementById('mwork').setAttribute('aria-label',`My work, ${work.count} item${work.count===1?'':'s'}${crit?', some overdue':''}`);
  if(pop) renderPop();
}
function go(it){ try{ Object.entries(it.go||{}).forEach(([k,v])=>sessionStorage.setItem(k,v)); }catch(e){}
  if(location.pathname===it.link || (it.link==='/runs/latest' && location.pathname.startsWith('/runs/'))) location.reload(); else location.href=it.link; }
function renderPop(){
  const items=(work&&work.items)||[];
  pop.innerHTML=`<h2 id="mpopT">My work</h2><p class="mhint">Things waiting for you across Meridian, most urgent first.</p>`+
    (items.length? items.map((it,i)=>`<a href="${esc(it.link)}" class="mi" data-i="${i}"><span class="dot ${it.severity}"></span>
      <span><span class="mt">${esc(it.title)}</span><br><span class="md">${esc(it.kind)} · ${esc(it.detail)}</span></span>
      <span class="mk">${it.due?(it.severity==='crit'?'Overdue · ':'Due ')+esc(it.due):''}</span></a>`).join('')
     : `<div class="mempty">Nothing waiting for you. You're all caught up.</div>`);
  pop.querySelectorAll('a.mi').forEach(a=>a.onclick=e=>{e.preventDefault();go(items[+a.dataset.i])});
}
function togglePop(force){
  const btn=document.getElementById('mwork');
  if(pop && force!==true){ pop.remove(); pop=null; btn.setAttribute('aria-expanded','false'); btn.focus(); return; }
  if(pop) return;
  pop=document.createElement('div'); pop.className='mpop'; pop.id='mworkPop'; pop.setAttribute('role','dialog'); pop.setAttribute('aria-labelledby','mpopT');
  document.body.appendChild(pop); renderPop(); btn.setAttribute('aria-expanded','true');
  const f=pop.querySelector('a.mi'); if(f) f.focus();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && pop) togglePop(); });
document.addEventListener('click',e=>{ if(pop && !e.target.closest('#mworkPop,#mwork')) togglePop(); });

/* ---------- app bar ---------- */
function bar(){
  const n=NAV(); if(!n || document.querySelector('.mbar')) return;
  const main=document.querySelector('main, #main, .main'); if(main && !main.id) main.id='main';
  const skip=document.createElement('a'); skip.className='mskip'; skip.href='#'+(main?main.id:'main'); skip.textContent='Skip to main content';
  const h=document.createElement('div'); h.className='mbar'; h.setAttribute('role','banner');
  const u=n.user, roleTxt=(u.roles||[]).map(r=>r.replace(/_/g,' ')).join(', ')+((u.permissions||[]).length?' · '+u.permissions.join(', '):'');
  const B=n.brand||{product:"Meridian"};
  h.innerHTML=`<a class="mbrand" href="/runs/latest" aria-label="${esc(B.product)} home">${B.logo?`<img src="${B.logo}" alt="${esc(B.company||B.product)}">`:'<i aria-hidden="true"></i>'}${esc(B.product)}${B.company?`<span class="mco">${esc(B.company)}</span>`:''}</a>
    <nav aria-label="Primary">${n.links.map(l=>`<a href="${l.href}" ${l.key===n.current?'aria-current="page"':''}>${esc(l.label)}</a>`).join('')}</nav>
    <span class="msp"></span>
    <button class="mbtn" id="mwork" aria-haspopup="dialog" aria-expanded="false" aria-controls="mworkPop" title="My work"><span class="mlabel">My work</span><span class="mbadge zero" id="mworkN">·</span></button>
    <a class="mbtn" href="${n.help}" ${n.current==='help'?'aria-current="page"':''} title="User guide for this page"><span aria-hidden="true">?</span><span class="mlabel">Help</span></a>
    <span class="muser" title="${esc(u.email)}"><b>${esc(u.name)}</b><br>${esc(roleTxt)}</span>
    <a class="mbtn" href="/logout">Sign out</a>`;
  document.body.prepend(h); document.body.prepend(skip); region();
  document.getElementById('mwork').onclick=e=>{e.stopPropagation();togglePop()};
  loadWork(); setInterval(()=>{ if(!document.hidden) loadWork() }, 60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) loadWork() });
  syncTabs();
}
MUI.refreshWork = loadWork;
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bar); else bar();
})();
</script>
