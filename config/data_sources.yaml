# Data connectivity — plug sources in or out without code changes.
#
# A *source* = provider (who owns the data) + transport (how Meridian reaches it).
#   transport: http       -> free/public web sources (FRED, Yahoo Finance, any CSV URL)
#   transport: manual     -> hand-maintained values with a cited source (config/manual_inputs.yaml)
#   transport: file       -> Parquet/CSV files (incl. data/cache, written by `meridian data refresh`)
#   transport: direct     -> licensed vendor API/SDK (Bloomberg, FactSet, S&P, Moody's, Fitch)
#   transport: snowflake  -> vendor data delivered into Snowflake
#   transport: generated  -> deterministic synthetic data (testing only; always flagged SYNTHETIC)
#
# Plug / unplug from the command line (comments in this file are preserved):
#   meridian data list                                  # sources, status, routing
#   meridian data enable bloomberg_snowflake            # plug in
#   meridian data disable yahoo                         # unplug
#   meridian data route returns.monthly yahoo fred cache --mode merge --fallback synthetic
#   meridian data test fred                             # try a source live
#   meridian data refresh                               # fetch live sources -> data/cache (point-in-time)
#
# Routing per canonical dataset:
#   [a, b, c]                                -> "first": first source that succeeds serves everything
#   {mode: merge, sources: [...], fallback: [...]}
#                                            -> all sources combined, earlier wins per key; each row records
#                                               its source. Fallback is used only for assets/keys nobody covered.
# Credentials are never stored here — only environment-variable names.

connections:
  snowflake_main:
    account_env: SNOWFLAKE_ACCOUNT
    user_env: SNOWFLAKE_USER
    private_key_path_env: SNOWFLAKE_PRIVATE_KEY_PATH   # key-pair auth recommended
    role: MERIDIAN_READER
    warehouse: MERIDIAN_WH
    database: MARKET_DATA

sources:
  # ------------------------------------------------------------------ free / public (enabled)
  yahoo:
    provider: yahoo
    transport: http
    enabled: true
    # tickers per asset class: config/universe.yaml -> identifiers.yahoo (first = primary, rest extend history)

  fred:
    provider: fred
    transport: http
    enabled: true
    options:
      api_key_env: FRED_API_KEY       # free key; uses the official API when set, else keyless CSV download
      indicators:
        real_gdp_growth_yoy:    {series: GDPC1, transform: yoy_pct, periods: 4}
        cpi_yoy:                {series: CPIAUCSL, transform: yoy_pct, periods: 12}
        core_cpi_yoy:           {series: CPILFESL, transform: yoy_pct, periods: 12}
        unemployment_rate:      {series: UNRATE}
        unemployment_change_6m: {series: UNRATE, transform: diff, periods: 6}
        policy_rate:            {series: FEDFUNDS}
        policy_rate_change_6m:  {series: FEDFUNDS, transform: diff, periods: 6}
        ig_spread_bp:           {series: BAMLC0A0CM, transform: x100}
        hy_spread_bp:           {series: BAMLH0A0HYM2, transform: x100}
        yield_curve_10y2y_bp:   {series: T10Y2Y, transform: x100}
        cfnai_ma3:              {series: CFNAIMA3}          # Chicago Fed activity index (free PMI substitute)
      yields:                                               # starting yields -> fixed-income CMAs
        cash:             {series: DTB3, duration: 0.25}
        us_core_bond:     {series: [DGS5, BAMLC0A0CMEY], duration: 6.0, expected_loss: 0.0010}   # approx: avg of 5y UST and IG corp yield
        us_long_treasury: {series: DGS30, duration: 15.5}
        us_tips_short:    {series: DGS5, duration: 2.5}      # real yield + breakeven ≈ nominal 5y
        us_high_yield:    {series: BAMLH0A0HYM2EY, duration: 3.3, expected_loss: 0.0150}
        intl_bond_hedged: {series: DGS10, duration: 7.0, expected_loss: 0.0005}             # approx: hedged yield ≈ USD rates
        em_debt:          {series: BAMLEMCBPIEY, duration: 7.0, expected_loss: 0.0090}
        commodities:      {series: DTB3, duration: 0.0}      # collateral yield
      return_series:
        cash: {series: DTB3}                                 # monthly T-bill return = prior yield / 12

  treasury:
    provider: treasury
    transport: http
    enabled: true
    options:
      yields:
        cash:             {tenor: "3 Mo", duration: 0.25}
        us_long_treasury: {tenor: "30 Yr", duration: 15.5}
        us_tips_short:    {tenor: "5 Yr", duration: 2.5}
        intl_bond_hedged: {tenor: "10 Yr", duration: 7.0, expected_loss: 0.0005}

  manual:
    provider: manual
    transport: manual
    enabled: true
    options: {path: config/manual_inputs.yaml}

  cache:
    provider: file
    transport: file
    enabled: true
    options: {root: data/cache}                              # written by `meridian data refresh`

  synthetic:
    provider: synthetic
    transport: generated
    enabled: true
    options: {seed: 20261031, start: "1999-01-31"}

  files:
    provider: file
    transport: file
    enabled: false
    options: {root: data/drops}

  # ------------------------------------------------------------------ licensed vendors (plug in when available)
  bloomberg_direct:
    provider: bloomberg
    transport: direct
    enabled: false
    options: {host: localhost, port: 8194, field_total_return: TOT_RETURN_INDEX_GROSS_DVDS}

  bloomberg_snowflake:
    provider: bloomberg
    transport: snowflake
    connection: snowflake_main
    enabled: false
    datasets:
      returns.monthly:
        sql: >
          SELECT asset_key AS asset_id, month_end AS date, total_return AS ret
          FROM BLOOMBERG.MONTHLY_TOTAL_RETURNS
          WHERE asset_key IN (%(asset_keys)s) AND month_end BETWEEN %(start)s AND %(end)s
        key_field: snowflake_key

  factset_direct:
    provider: factset
    transport: direct
    enabled: false
    options: {base_url: "https://api.factset.com", username_env: FACTSET_USERNAME, api_key_env: FACTSET_API_KEY}

  factset_snowflake:
    provider: factset
    transport: snowflake
    connection: snowflake_main
    enabled: false
    datasets:
      returns.monthly:
        sql: >
          SELECT asset_key AS asset_id, month_end AS date, total_return AS ret
          FROM FACTSET.MONTHLY_TOTAL_RETURNS
          WHERE asset_key IN (%(asset_keys)s) AND month_end BETWEEN %(start)s AND %(end)s
        key_field: snowflake_key

  sp_snowflake:
    provider: sp_global
    transport: snowflake
    connection: snowflake_main
    enabled: false
    datasets:
      credit.ratings:
        sql: >
          SELECT entity_id, 'S&P' AS agency, rating, outlook, rating_date AS date
          FROM SP_GLOBAL.ISSUER_RATINGS WHERE rating_date <= %(as_of)s
      fundamentals.valuation:
        sql: >
          SELECT asset_key AS asset_id, as_of_date AS date, cape, dividend_yield, earnings_growth
          FROM SP_GLOBAL.INDEX_VALUATIONS WHERE as_of_date <= %(as_of)s
        key_field: snowflake_key

  moodys_snowflake:
    provider: moodys
    transport: snowflake
    connection: snowflake_main
    enabled: false
    datasets:
      credit.ratings:
        sql: >
          SELECT entity_id, 'Moodys' AS agency, rating, outlook, rating_date AS date
          FROM MOODYS.ISSUER_RATINGS WHERE rating_date <= %(as_of)s

  fitch_snowflake:
    provider: fitch
    transport: snowflake
    connection: snowflake_main
    enabled: false
    datasets:
      credit.ratings:
        sql: >
          SELECT entity_id, 'Fitch' AS agency, rating, outlook, rating_date AS date
          FROM FITCH.ISSUER_RATINGS WHERE rating_date <= %(as_of)s

  moodys_direct:
    provider: moodys
    transport: direct
    enabled: false
    options: {base_url_env: MOODYS_API_URL, api_key_env: MOODYS_API_KEY}

  fitch_direct:
    provider: fitch
    transport: direct
    enabled: false
    options: {base_url_env: FITCH_API_URL, api_key_env: FITCH_API_KEY}

  sp_direct:
    provider: sp_global
    transport: direct
    enabled: false
    options: {base_url_env: SP_API_URL, api_key_env: SP_API_KEY}

routing:
  returns.monthly:
    mode: merge
    sources: [bloomberg_snowflake, factset_snowflake, bloomberg_direct, factset_direct, yahoo, fred, files, cache]
    fallback: [synthetic]
  macro.indicators:
    mode: merge
    sources: [bloomberg_snowflake, fred, treasury, manual, cache]
    fallback: [synthetic]
  fundamentals.valuation:
    mode: merge
    sources: [sp_snowflake, factset_snowflake, manual, cache]
    fallback: [synthetic]
  yields.current:
    mode: merge
    sources: [bloomberg_snowflake, bloomberg_direct, fred, treasury, manual, cache]
    fallback: [synthetic]
  credit.ratings:
    mode: merge
    sources: [moodys_snowflake, sp_snowflake, fitch_snowflake, moodys_direct, sp_direct, fitch_direct, files]

# Licensing / terms review per provider. Keep current before any production or external use.
license_review:
  fred: "public; some series (e.g. ICE BofA) are copyrighted — check series-level terms before redistribution"
  yahoo: "unofficial endpoint; personal/non-commercial use — replace with a licensed source before production"
  treasury: "US government data, public domain"
  manual: "each value cites its source in config/manual_inputs.yaml"
  file: "n/a"
  synthetic: "n/a"
  bloomberg: pending
  factset: pending
  sp_global: pending
  moodys: pending
  fitch: pending
