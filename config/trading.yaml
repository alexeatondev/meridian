# Trading and implementation configuration (doc 17). Change-controlled like policies/.
# EXAMPLE DATA: product lines, instruments, prices and NAVs below are illustrative so the workflow can be
# exercised end to end. Real holdings, prices and cashflows come from custodian / transfer-agent files or APIs.

as_of: "2026-11-09"            # previous night close used for example positions

# Product lines. A vintage exists in every product line; each (product, vintage) is a fund.
products:
  - id: mf
    name: Meridian Target Retirement Funds
    vehicle: mutual_fund        # registered '40 Act target-date mutual funds
    fund_prefix: MTRS           # fund ids: MTRS-2050 (same ids the console already uses)
    account_prefix: MF
    nav_musd: {2030: 4200, 2035: 5100, 2040: 4800, 2045: 4300, 2050: 3600, 2055: 2400, 2060: 1500, 2065: 700, 2070: 120}
    roll_down: monthly          # glide-path roll-down frequency: monthly | quarterly | semiannual | annual
    roll_down_overrides: {2065: annual, 2070: annual}
  - id: cit
    name: Meridian Target Retirement Trust
    vehicle: cit                # collective investment trusts for ERISA plans
    fund_prefix: MTRT
    account_prefix: CIT
    nav_musd: {2030: 2600, 2035: 3000, 2040: 2900, 2045: 2500, 2050: 2100, 2055: 1400, 2060: 800, 2065: 300, 2070: 60}
    roll_down: semiannual
    roll_down_overrides: {}

# Uninvested cash held in each fund's custody account at last close (share of NAV)
cash_account_pct: 0.006

# Where orders go, by the type of instrument traded. Every order is also written to the Charles River import
# file, which runs Charles River's compliance check and execution; the route is carried on each order.
routes:
  mutual_fund: "SS&C (formerly DST)"
  cit: "State Street"
  etf: "Internal trading desk"
  stock: "Internal trading desk"
  bond: "Internal trading desk"
route_names: ["SS&C (formerly DST)", "State Street", "Internal trading desk"]

# Series-level cash buffer for ETF trades (basis points of fund NAV). Fund overrides may only be stricter.
cash_buffer_bps: 50

# Security master. type: mutual_fund | cit | etf | stock | bond. price: per unit (bond: per 100 face).
# products: which product lines may hold it. asset_class: the policy asset class it implements.
# share: split of the asset class between instruments in the neutral table (shares per product sum to 1).
# status: held (in example positions) | candidate (approved, not held) | no_target (held, but no target)
