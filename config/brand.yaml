# Look and feel (brand theme) for every screen of the hosted app and the local console.
#
# Pick the theme with `active` below, or per deployment with the MERIDIAN_BRAND environment variable.
# To add a company: copy a theme block, give it a new key, change the values, set `active`. No code changes.
#   colors        light-mode tokens used by every page (CSS variables --bg, --surface, --accent, ...)
#   dark          dark-mode overrides (used when the person's system is in dark mode); omit to force light
#   appbar        the dark bar across the top of every screen
#   charts        series colours for charts, in order
#   fonts.body    CSS font stack; list the brand font first, then safe fallbacks
#   fonts.css     optional URL of a stylesheet that loads a *licensed* web font (left empty unless licensed)
#   logo          optional image file under config/brand/ (e.g. logo.svg), shown in the app bar. Only add a
#                 logo the company has licensed for this use; none is shipped
#   radius        corner rounding of cards (lg) and controls (sm)
# Text colours must keep WCAG AA contrast (4.5:1) on --surface; `meridian brand check` tests every theme.

active: principal

themes:
  meridian:
    label: Meridian (original)
    product: Meridian
    company: ""
    logo: ""
    fonts: {body: 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif',
            mono: 'ui-monospace, SFMono-Regular, Menlo, monospace', css: ""}
    radius: {lg: 12px, sm: 8px}
    colors: {bg: "#f4f3f0", surface: "#fcfcfb", surface-2: "#f0efec", line: "#e2e0da", line-strong: "#cfccc4",
             text: "#0b0b0b", text-2: "#52514e", muted: "#6b6964", accent: "#1f4e8c", accent-hover: "#173c6c",
             accent-ink: "#ffffff", ok: "#1d7a46", ok-bg: "#e3f2e8", warn: "#8a5a00", warn-bg: "#fbf0d9",
             crit: "#a3261b", crit-bg: "#f8e1de", info-bg: "#e4ecf7", focus: "#2f6bc1"}
    dark: {bg: "#121211", surface: "#1a1a19", surface-2: "#232321", line: "#2e2e2b", line-strong: "#3c3c38",
           text: "#f0efec", text-2: "#c3c2b7", muted: "#9a998f", accent: "#7aa7e6", accent-hover: "#9bbdee",
           accent-ink: "#0b0b0b", ok: "#6cc08c", ok-bg: "#1d2e23", warn: "#e0b25a", warn-bg: "#2f2717",
           crit: "#ef8a80", crit-bg: "#331d1b", info-bg: "#1d2633", focus: "#7aa7e6"}
    appbar: {bg: "#14233b", text: "#f3f5f9", muted: "#c9d3e3", accent: "#7aa7e6", mark: "linear-gradient(135deg,#7aa7e6,#2f6bc1)",
             badge: "#e0b25a", badge-text: "#14233b", badge-crit: "#ef8a80"}
    charts: ["#2a78d6", "#e07b39", "#3a9d6a", "#8a5cc7", "#c94f6d", "#2fa3a8", "#b58a1d", "#6b7a8f"]

  principal:
    # Principal Financial Group, from the public Principal Design System colour tokens (ux.principal.com,
    # read 2026-11-18): Principal blue #0076CF, Admiral blue #0061A0, Navy #004C97, Dark Prussian #002855,
    # sky blues, cyan, neutrals Gray 1-7, utility success #00A29B / warning #F76800 / error #C00000,
    # data orange #FFC82E and purple #9E8BFF. PDS marks success and warning "not for text", so text uses
    # darker shades of them (derived here for contrast). Brand typeface FS Elliot is licensed by Fontsmith:
    # it is used if installed or loaded through fonts.css; otherwise the fallbacks apply.
    label: Principal Financial Group
    product: Meridian
    company: ""
    logo: ""
    fonts: {body: '"FS Elliot Pro", "FS Elliot", "Helvetica Neue", Arial, sans-serif',
            mono: 'ui-monospace, SFMono-Regular, Menlo, monospace', css: ""}
    radius: {lg: 6px, sm: 4px}
    colors: {bg: "#F6F6F8", surface: "#FFFFFF", surface-2: "#F0FBFE", line: "#E8E8E8", line-strong: "#C5C6C5",
             text: "#333333", text-2: "#616267", muted: "#616267", accent: "#0076CF", accent-hover: "#005DB6",
             accent-ink: "#FFFFFF", ok: "#00756F", ok-bg: "#E0F4F3", warn: "#A84700", warn-bg: "#FEF0E5",
             crit: "#C00000", crit-bg: "#FBE5E5", info-bg: "#E3F5FD", focus: "#0091DA", heading: "#002855",
             pos: "#0076CF", neg: "#F76800", off-bg: "#E8E8E8"}
    dark: {bg: "#000F3C", surface: "#002855", surface-2: "#1A426F", line: "#1A426F", line-strong: "#335B88",
           text: "#FBFBFB", text-2: "#D2F1FD", muted: "#BBE6FC", accent: "#94D8FA", accent-hover: "#BBE6FC",
           accent-ink: "#002855", ok: "#5FD3CC", ok-bg: "#0B3A44", warn: "#FFB27A", warn-bg: "#3A2A1A",
           crit: "#FF8A8A", crit-bg: "#3D1424", info-bg: "#1A426F", focus: "#94D8FA", heading: "#FFFFFF",
           pos: "#62B5E5", neg: "#FFB27A", off-bg: "#1A426F"}
    appbar: {bg: "#002855", text: "#FFFFFF", muted: "#D2F1FD", accent: "#94D8FA", mark: "linear-gradient(135deg,#0091DA,#0076CF 55%,#004C97)",
             badge: "#FFC82E", badge-text: "#002855", badge-crit: "#FF8A8A"}
    charts: ["#0076CF", "#00C4D9", "#FFC82E", "#9E8BFF", "#004C97", "#62B5E5", "#007FA3", "#616267"]
