<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Console</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f3f0; --surface:#fcfcfb; --surface-2:#f0efec; --line:#e2e0da; --line-strong:#cfccc4;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7a7873; --accent:#1f4e8c; --accent-ink:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --pos:#2a78d6; --neg:#eb6834; --mid:#b9b7b0;
  --good:#1a7f37; --good-bg:#e6f4ea; --warn:#9a6700; --warn-bg:#fff4d6; --crit:#b42318; --crit-bg:#fde8e6; --info:#1f4e8c; --info-bg:#e8eef8; --off-bg:#eeedea;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 1px rgba(0,0,0,.03);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --line:#2e2e2b; --line-strong:#3c3c38;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#9a998f; --accent:#7aa7e6; --accent-ink:#0b0b0b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --pos:#3987e5; --neg:#d95926; --mid:#5a5a55;
  --good:#5cc27a; --good-bg:#16301f; --warn:#e3b341; --warn-bg:#352a0e; --crit:#f2766b; --crit-bg:#3a1714; --info:#7aa7e6; --info-bg:#172338; --off-bg:#262624;
}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px} .brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
label.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:block;margin-bottom:6px}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;color:var(--text-2)}
nav button:hover{background:var(--surface-2)} nav button.active{background:var(--info-bg);color:var(--info);font-weight:600}
nav button:focus-visible{outline:2px solid var(--accent)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted)}
main{padding:20px 28px 60px;max-width:1280px}
.topbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:14px}
.topbar h1{font-size:20px;margin:0 12px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--off-bg);color:var(--text-2);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)} .chip.info{background:var(--info-bg);color:var(--info)}
.banner{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);padding:10px 14px;border-radius:var(--radius);margin-bottom:16px;font-size:13px}
.grid{display:grid;gap:14px} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1000px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}.app{grid-template-columns:1fr}aside{position:static;height:auto}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 10px} .card h3{font-size:13px;margin:14px 0 6px;color:var(--text-2)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.3px} .kpi .l{font-size:12px;color:var(--muted)} .kpi .s{font-size:12px;color:var(--text-2);margin-top:2px}
.section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:22px 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--text-2);font-size:12px;background:var(--surface-2);position:sticky;top:0} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)} tr.sel td{background:var(--info-bg)}
.scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.muted{color:var(--muted)} .small{font-size:12px} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.btn{cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill-list{display:flex;flex-wrap:wrap;gap:6px}
.why{border-left:3px solid var(--accent);padding:6px 12px;background:var(--surface-2);border-radius:0 8px 8px 0}
.md h1{font-size:20px}.md h2{font-size:16px;margin-top:22px}.md table{margin:8px 0}.md blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--warn);background:var(--warn-bg);color:var(--warn)}
.md code{background:var(--surface-2);padding:1px 4px;border-radius:4px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--surface-2);padding:10px;border-radius:8px;font-size:12px;max-height:420px;overflow:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:4px 0 8px} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{position:relative} .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;z-index:5;min-width:150px}
.tip b{display:block;margin-bottom:4px}
svg text{fill:var(--muted);font-size:11px}
.vt-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.vt-tabs button{cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600}
.vt-tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--text);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:13px;display:none}
.caret{all:unset;cursor:pointer;width:16px;display:inline-block;color:var(--text-2)}.caret-sp{display:inline-block;width:16px}
tr.lvl0 td{font-weight:600}.up{color:var(--pos)}.down{color:var(--neg)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.filters>*{width:auto;min-width:160px}
</style>
</head>

ersifier (-10).  \nEffective N 4.8; simulated max drawdown -39.5% vs glide path -41.0%.\n\n**2045** \u2014 ensemble: `inverse_tracking_error`. Peer-vote leaders: risk_budget_tilt (+10), max_sharpe_tilt (+7), black_litterman_tilt (+8). Lowest ranked: adversarial_diversifier (-8).  \nEffective N 4.3; simulated max drawdown -42.8% vs glide path -44.7%.\n\n**2050** \u2014 ensemble: `inverse_tracking_error`. Peer-vote leaders: risk_budget_tilt (+11), max_sharpe_tilt (+7), black_litterman_tilt (+9). Lowest ranked: adversarial_diversifier (-8).  \nEffective N 3.8; simulated max drawdown -45.4% vs glide path -47.3%.\n\n**2055** \u2014 ensemble: `inverse_tracking_error`. Peer-vote leaders: risk_budget_tilt (+11), max_sharpe_tilt (+7), black_litterman_tilt (+8). Lowest ranked: adversarial_diversifier (-8).  \nEffective N 3.6; simulated max drawdown -46.7% vs glide path -48.5%.\n\n**2060** \u2014 ensemble: `inverse_tracking_error`. Peer-vote leaders: risk_budget_tilt (+11), max_sharpe_tilt (+7), black_litterman_tilt (+8). Lowest ranked: adversarial_diversifier (-8).  \nEffective N 3.6; simulated max drawdown -47.1% vs glide path -48.9%.\n\n**2065** \u2014 ensemble: `inverse_tracking_error`. Peer-vote leaders: risk_budget_tilt (+11), max_sharpe_tilt (+7), black_litterman_tilt (+8). Lowest ranked: adversarial_diversifier (-8).  \nEffective N 3.5; simulated max drawdown -47.6% vs glide path -49.3%.\n\n**2070** \u2014 ensemble: `inverse_tracking_error`. Peer-vote leaders: risk_budget_tilt (+11), max_sharpe_tilt (+7), black_litterman_tilt (+8). Lowest ranked: adversarial_diversifier (-8).  \nEffective N 3.5; simulated max drawdown -47.8% vs glide path -49.5%.\n\n## 5. Rationale and what would make this wrong\n\n*CIO agent reasoning for the 2030 vintage shown; every vintage's reasoning is in the Console and the decision ledger.*\n\nInverse-tracking-error ensemble (paper \u00a74.4): weights methods closer to the consensus more heavily, keeps every method's information, and stays well     research:'Review the capital market assumptions, the CMA judge\'s reasoning, and how the agents voted.',
    mgr:'Monitor the underlying building-block funds every vintage invests in, and their liquidity and derivatives use.',
    lead:'Read the board memo, track outstanding approvals and production blockers, and approve glide-path changes.',
    compliance:'Review rule results, attestations and obligations for the selected entity types, and sign off.',
    audit:'Reconstruct any decision: who or what decided, from which inputs, under which policy, and whether the record is intact.'}[r];
  let k='';
  if(r==='pm') k=kp(myQueue.length,'Proposals awaiting you','vintages')+kp(pct(Math.max(...vs.map(v=>Math.abs(v.equity_final-v.equity_neutral)))),'Largest equity tilt','vs glide path')+kp(pct(vs[0].exp_ret),'Exp. return (2030)','10-yr nominal')+kp(pct(vs[vs.length-1].exp_ret),'Exp. return (2070)','10-yr nominal');
  if(r==='risk') k=kp(pct(maxTE,2),'Max tracking error','limit '+pct(teLim,2))+kp(pct(Math.min(...vs.map(v=>v.backtest.max_drawdown))),'Worst simulated drawdown','hypothetical')+kp(counts.WARN,'Risk warnings','across vintages')+kp(myQueue.length,'Awaiting your co-approval','vintages');
  if(r==='research'){const big=[...R.cma].sort((a,b)=>Math.abs(b.judge_minus_blend)-Math.abs(a.judge_minus_blend))[0];
    k=kp(R.macro.regime.replace('_','-'),'Macro regime','confidence '+R.macro.confidence)+kp(R.cma.length,'Asset classes','CMAs produced')+kp(pp(big.judge_minus_blend),'Largest judge adjustment',esc(big.name))+kp(Object.keys(vs[0].candidates).length,'PC methods competing','per vintage');}
  if(r==='mgr'){const ud=Object.values(U); k=kp(ud.length,'Underlying funds','building blocks')+kp(ud.filter(u=>u.uses_derivatives).length,'Use derivatives','FX hedge / futures')+kp(ud.filter(u=>u.liquidity==='daily').length+'/'+ud.length,'Daily liquidity','IPS §7.4')+kp(VINT.length,'Vintages served','2030–2070');}
  if(r==='lead') k=kp(Math.max(pending,0),'Approvals outstanding','all roles')+kp(G.production_blockers.length,'Production blockers','see Compliance')+kp(co.status,'Compliance review','Agentic CO (draft)')+kp(VINT.length,'Vintages','in this run');
  if(r==='compliance') k=kp(counts.FAIL,'Hard-limit FAILs','blocks approval')+kp(counts.WARN,'Warnings','need acknowledgment')+kp((co.attestations_pending||[]).length,'Attestations pending','need a named human')+kp(G.production_blockers.length,'Production blockers','unfilled roles etc.');
  if(r==='audit') k=kp(L.length,'Decision records','this run')+kp(D.ledger_verification.ok?'Intact':'Broken','Hash chain',esc(D.ledger_verification.message))+kp(new Set(L.map(x=>x.actor.id)).size,'Distinct actors','agents + system')+kp(G.retention_years+' yrs','Retention applied','strictest regime');
  const queue = ROLES[r].approverRole ? `<div class="card"><h2>My queue</h2>${myQueue.length?`<table><tr><th>Vintage</th><th>Proposal</th><th>Compliance</th><th></th></tr>${myQueue.map(v=>{const x=R.vintages[v];return `<tr><td>${v}</td><td>Equity ${pct(x.equity_final)} (${pp(x.equity_final-x.equity_neutral)} vs glide path), TE ${pct(x.te,2)}</td><td>${chip(x.compliance_summary.overall)}</td><td><button class="btn" data-open="${v}">Review</button></td></tr>`}).join('')}</table>`:'<div class="muted">Nothing waiting for you.</div>'}</div>`:'';
  const blockers = (r==='lead'||r==='compliance')?`<div class="card"><h2>Production blockers</h2><ul>${G.production_blockers.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>`:'';
  return `<p class="muted" style="margin-top:0">${intro}</p><div class="grid g4">${k}</div><div class="grid g2" style="margin-top:14px">${queue}${blockers}${vintageSummaryCard()}</div>`;
};
function vintageSummaryCard(){return `<div class="card"><h2>All vintages</h2><table><tr><th>Vintage</th><th class="num">Yrs</th><th class="num">Equity</th><th class="num">Tilt</th><th class="num">E[r]</th><th class="num">Vol</th><th>Status</th></tr>${VINT.map(v=>{const x=R.vintages[v];return `<tr class="click" data-open="${v}"><td>${v}</td><td class="num">${x.years_to_target.toFixed(1)}</td><td class="num">${pct(x.equity_final)}</td><td class="num">${pp(x.equity_final-x.equity_neutral)}</td><td class="num">${pct(x.exp_ret)}</td><td class="num">${pct(x.vol)}</td><td>${chip(x.compliance_summary.overall)}</td></tr>`}).join('')}</table></div>`}

function approvalForm(v,roleName){
  const done=state.approvals.find(a=>a.vintage===v&&a.role===roleName);

  return `<h3>Your decision (${esc(roleName)})</h3>
  <div class="small muted" style="margin-bottom:6px">Read the rationale and dissent first. A reason is required.</div>
  <label class="small"><input type="checkbox" id="ack" style="width:auto"> I read the rationale, dissent and compliance results</label>

  <div class="row"><button class="btn primary" data-decide="approve">Approve</button><button class="btn" data-decide="reject">Reject</button><button class="btn" data-decide="request_changes">Request changes</button></div>`;
}
function cmdFor(a){return `meridian approve runs/${R.run_id} --vintage ${a.vintage} --role ${a.role} --name "YOUR NAME" --decision ${a.decision} --reason "${a.reason.replace(/"/g,"'")}"`}

function bar(f){f=Math.max(0,Math.min(1.2,f||0));const c=f>1?'var(--crit)':f>0.8?'var(--warn)':'var(--good)';return `<div style="height:8px;background:var(--surface-2);border-radius:4px;min-width:90px" title="${Math.round(f*100)}% of limit"><div style="height:8px;width:${Math.min(f,1)*100}%;background:${c};border-radius:4px"></div></div>`}
function fmtRule(r){const m=r.measured,l=r.limit;if(/BAND-/.test(r.rule_id))return `${(+m).toFixed(2)}pp / ${l}pp`;if(r.kind==='volatility_vs_neutral')return `${(+m).toFixed(2)}× / ${l}×`;return `${pct(m,2)} / ${pct(l,2)}`}

// ---- adjustment editor: same minimum-norm math as meridian.analytics.positioning.apply_adjustment
const NODES = (()=>{ if(!M) return []; const s=[]; M.taxonomy.forEach(l=>{for(let i=1;i<=l.path.length;i++){const n=l.path.slice(0,i).join('/'); if(!s.includes(n)) s.push(n);}}); return s; })();
function nodeRow(n){ const A=M.assets; if(n.startsWith('asset:')){const a=n.slice(6);return A.map(x=>x===a?1:0);} const r=A.map(()=>0); M.taxonomy.forEach(l=>{const p=l.path.join('/'); if(p===n||p.startsWith(n+'/')) r[A.indexOf(l.asset)]+=l.fraction}); return r; }
const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
function solveSym(K,y){ const n=y.length, A=K.map((r,i)=>[...r,y[i]]); for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r; [A[c],A[p]]=[A[p],A[c]]; if(Math.abs(A[c][c])<1e-14) return null; for(let r=0;r<n;r++){ if(r===c) continue; const f=A[r][c]/A[c][c]; for(let k=c;k<=n;k++) A[r][k]-=f*A[c][k]; } } return A.map((r,i)=>r[n]/r[i]); }
function independent(rows){ // keep rows that add rank (Gram-Schmidt)
  const basis=[], keep=[]; rows.forEach((r,i)=>{ let v=r.slice(); basis.forEach(b=>{const c=dot(v,b);v=v.map((x,k)=>x-c*b[k])}); const nr=Math.sqrt(dot(v,v)); if(nr>1e-9){basis.push(v.map(x=>x/nr)); keep.push(i);} }); return keep; }
function applyAdj(w,a){ const r=nodeRow(a.node), cur=dot(r,w), delta=a.mode==='absolute'?a.value-cur:a.value; const rows=[r], b=[cur+delta];
  if(a.funded){ const f=nodeRow(a.funded); if(delta>dot(f,w)+1e-12) throw new Error('Funding node has only '+pct(dot(f,w))+' to give'); rows.push(f); b.push(dot(f,w)-delta);
    ['Equity','Fixed Income','Real Assets'].forEach(t=>{const tr=nodeRow(t); if(!tr.some((x,i)=>x&&r[i])&&!tr.some((x,i)=>x&&f[i])){rows.push(tr);b.push(dot(tr,w));}}); }
  if(cur+delta<-1e-12) throw new Error('Cannot reduce '+a.node+' below zero');
  rows.push(w.map(()=>1)); b.push(1);
  const zero=[]; // active set: funds that would go negative are pinned at zero and the problem re-solved
  for(let it=0; it<30; it++){
    const R2=rows.concat(zero.map(i=>w.map((_,j)=>j===i?1:0))), B2=b.concat(zero.map(()=>0));
    const k=independent(R2); const A=k.map(i=>R2[i]), bb=k.map(i=>B2[i]);
    const K=A.map(x=>A.map(y=>dot(x,y))), res=bb.map((v,i)=>v-dot(A[i],w)), lam=solveSym(K,res); if(!lam) throw new Error('Could not solve this combination');
    const out=w.map((x,j)=>x+A.reduce((s,row,i)=>s+row[j]*lam[i],0));
    const neg=out.map((x,i)=>x<-1e-10&&!zero.includes(i)?i:-1).filter(i=>i>=0);
    if(!neg.length){ return out.map(x=>Math.max(0,x)); } zero.push(...neg);
  }
  throw new Error('Not achievable with long-only weights'); }
function teOf(w,n){ const C=M.cov, d=w.map((x,i)=>x-n[i]); return Math.sqrt(Math.max(0,d.reduce((s,di,i)=>s+di*C[i].reduce((t,c,j)=>t+c*d[j],0),0))); }
function adjustPanel(v){
  const x=R.vintages[v], A=M.assets, base=(x.adjusted&&x.adjusted.final)||x.final, w0=A.map(a=>base[a]), n=A.map(a=>x.neutral[a]);
  let w=w0.slice(), err='';
  try{ state.adj.forEach(a=>{ w=applyAdj(w,a) }); }catch(e){ err=e.message; }
  const te=teOf(w,n), used=te/x.risk_budget;

  const prev=NODES.filter(k=>k.split('/').length<=2).map(k=>({k,b:dot(nodeRow(k),w0),a:dot(nodeRow(k),w)}));
  return `<div class="card" style="margin-top:14px"><h2>Adjust weights (${state.role==='pm'?'Portfolio Manager':'Analyst'})</h2>
  <p class="small muted">Set a group or fund to an <b>absolute</b> weight, or move it by a <b>relative</b> amount (pp). Optionally fund the move from another group — e.g. move fixed income from <i>Long-dated</i> to <i>Short-dated</i>. Weights change as little as possible; untouched top-level groups stay put. The preview is indicative; the command re-runs the compliance engine and risk budget and records your change for approval.</p>
  <div class="row"><select id="adjNode" style="width:auto;max-width:320px">${opts}</select>
   <select id="adjMode" style="width:auto"><option value="relative">Relative (± pp)</option><option value="absolute">Absolute (%)</option></select>

   <button class="btn" id="adjAdd">Add</button>${state.adj.length?'<button class="btn" id="adjClear">Clear</button>':''}</div>
  <div style="margin-top:10px">${state.adj.map(a=>`<span class="chip info" style="margin:2px">${esc(a.node)} ${a.mode==='absolute'?'= '+pct(a.value):(a.value>=0?'+':'')+(a.value*100).toFixed(2)+'pp'}${a.funded?' from '+esc(a.funded):''}</span>`).join('')||'<span class="muted small">No adjustments yet.</span>'}</div>
  ${err?`<div class="banner" style="margin-top:10px">${esc(err)}</div>`:''}
  ${state.adj.length&&!err?`<div class="grid g2" style="margin-top:12px"><div><table><tr><th>Group</th><th class="num">Before</th><th class="num">After</th><th class="num">Change</th></tr>${prev.map(p=>`<tr><td style="padding-left:${8+(p.k.split('/').length-1)*16}px">${esc(p.k.split('/').pop())}</td><td class="num">${pct(p.b)}</td><td class="num">${pct(p.a)}</td><td class="num">${dpp(p.a-p.b)}</td></tr>`).join('')}</table></div>
   <div><div class="kpi"><div class="l">Tracking error vs glide path (indicative)</div><div class="v">${pct(te,2)}</div><div class="s">${(used*100).toFixed(0)}% of ${pct(x.risk_budget,2)} budget</div></div>${rbBar(used)}

   <h3>Record it (re-checked by the compliance engine)</h3><pre id="cmd">${esc(cmd)}</pre><button class="btn" id="copyCmd">Copy command</button></div></div>`:''}

function glideChart(){
  const el=$('#glideChart'); if(!el) return; const W=el.clientWidth||900,H=330,m={l:44,r:16,t:10,b:44};
  const grp=[['Equity',P.groups.equity,'--s1'],['Real assets',P.groups.real_assets,'--s2'],['Fixed income',P.groups.fixed_income,'--s3'],['Cash',['cash'],'--s4']];
  const an=[...P.anchors].sort((a,b)=>a[0]-b[0]); const ys=[]; for(let y=45;y>=-7;y-=0.5) ys.push(y);
  const interp=(y)=>{const yy=Math.max(an[0][0],Math.min(an[an.length-1][0],y));let i=0;while(i<an.length-2&&an[i+1][0]<yy)i++;const a=an[i],b=an[i+1];const t=(yy-a[0])/((b[0]-a[0])||1);return P.assets.map((_,j)=>(a[j+1]+(b[j+1]-a[j+1])*t)/100)};
  const comp=y=>{const w=interp(y);return grp.map(g=>g[1].reduce((s,a)=>s+w[P.assets.indexOf(a)],0))};
  const X=y=>m.l+(45-y)/(52)*(W-m.l-m.r), Y=v=>m.t+(1-v)*(H-m.t-m.b);
  let svg=`<svg width="${W}" height="${H}" role="img" aria-label="Glide path stacked area chart">`;
  for(const g of [0,.25,.5,.75,1]) svg+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${m.l-6}" y="${Y(g)+4}" text-anchor="end">${g*100}%</text>`;
  for(const t of [40,30,20,10,0,-7]) svg+=`<text x="${X(t)}" y="${H-m.b+16}" text-anchor="middle">${t}</text>`;
  svg+=`<text x="${(W)/2}" y="${H-1}" text-anchor="middle">Years to target date</text>`;
  const C=ys.map(comp); let base=ys.map(()=>0);
  grp.forEach((g,gi)=>{const top=base.map((b,i)=>b+C[i][gi]);
    const d='M'+ys.map((y,i)=>`${X(y)},${Y(top[i])}`).join('L')+'L'+[...ys].reverse().map((y,i)=>`${X(y)},${Y(base[ys.length-1-i])}`).join('L')+'Z';
    svg+=`<path d="${d}" fill="var(${g[2]})" stroke="var(--surface)" stroke-width="2"/>`; base=top;});
  VINT.forEach(v=>{const y=R.vintages[v].years_to_target, eq=R.vintages[v].equity_neutral;svg+=`<circle cx="${X(y)}" cy="${Y(eq)}" r="5" fill="var(--surface)" stroke="var(--text)" stroke-width="2"/><text x="${X(y)}" y="${Y(eq)-9}" text-anchor="middle" style="fill:var(--text);font-weight:600">${v}</text>`});
  svg+=`<line id="gx" y1="${m.t}" y2="${H-m.b}" stroke="var(--text-2)" stroke-dasharray="3 3" style="display:none"/><rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent" id="ghit"/></svg><div class="tip" id="gtip"></div>`;
  el.innerHTML=svg; const hit=el.querySelector('#ghit'),tip=el.querySelector('#gtip'),gx=el.querySelector('#gx');
  hit.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect();const px=e.clientX-r.left;const y=Math.round((45-(px-m.l)/(W-m.l-m.r)*52)*2)/2;const c=comp(y);
    gx.setAttribute('x1',X(y));gx.setAttribute('x2',X(y));gx.style.display='';tip.style.display='block';tip.style.left=Math.min(px+12,W-170)+'px';tip.style.top='20px';
    tip.innerHTML=`<b>${y} yrs to target</b>${grp.map((g,i)=>`<div><i style="display:inline-block;width:8px;height:8px;background:var(${g[2]});border-radius:2px;margin-right:6px"></i>${g[0]}: ${pct(c[i])}</div>`).join('')}`});
  hit.addEventListener('mouseleave',()=>{tip.style.display='none';gx.style.display='none'});
}
function activeChart(){
  const el=$('#activeChart'); if(!el) return; const x=R.vintages[state.vintage];
  const rows=P.assets.map(a=>({a,d:x.final[a]-x.neutral[a],n:x.neutral[a],f:x.final[a]})).sort((p,q)=>q.d-p.d);
  const W=el.clientWidth||520,rh=22,H=rows.length*rh+20,lw=205,max=Math.max(0.03,...rows.map(r=>Math.abs(r.d)));
  const cx=lw+(W-lw-10)/2, S=v=>v/max*((W-lw-10)/2);
  let svg=`<svg width="${W}" height="${H}" role="img" aria-label="Active weights bar chart"><line x1="${cx}" x2="${cx}" y1="0" y2="${H-14}" stroke="var(--mid)"/>`;
  rows.forEach((r,i)=>{const y=i*rh+4,w=Math.abs(S(r.d)),x0=r.d>=0?cx:cx-w;
    svg+=`<text x="${lw-8}" y="${y+12}" text-anchor="end" style="fill:var(--text-2)">${esc(nm(r.a))}</text><rect x="${x0}" y="${y+2}" width="${Math.max(w,1)}" height="14" rx="4" fill="var(${r.d>=0?'--pos':'--neg'})"/>
    <rect x="${lw}" y="${y}" width="${W-lw}" height="${rh}" fill="transparent" data-i="${i}" class="ah"/>`});
  svg+=`<text x="${cx}" y="${H-2}" text-anchor="middle">0</text><text x="${W-10}" y="${H-2}" text-anchor="end">${pp(max)}</text><text x="${lw}" y="${H-2}">${pp(-max)}</text></svg><div class="tip" id="atip"></div>`;
  el.innerHTML=svg; const tip=el.querySelector('#atip');
  el.querySelectorAll('.ah').forEach(h=>{h.addEventListener('mousemove',e=>{const r=rows[+h.dataset.i],b=el.getBoundingClientRect();tip.style.display='block';tip.style.left=Math.min(e.clientX-b.left+12,W-170)+'px';tip.style.top=(e.clientY-b.top+10)+'px';tip.innerHTML=`<b>${esc(nm(r.a))}</b>Glide path ${pct(r.n)}<br>Proposed ${pct(r.f)}<br>Active ${pp(r.d)}`});h.addEventListener('mouseleave',()=>tip.style.display='none')});
}

// --------------------------------------------------------------- markdown (subset)
function md(src){const out=[];const lines=src.split('\n');let i=0;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  while(i<lines.length){const l=lines[i];
    if(/^#{1,4} /.test(l)){const n=l.match(/^#+/)[0].length;out.push(`<h${n}>${inl(l.slice(n+1))}</h${n}>`);i++;continue}
    if(l.startsWith('|')){const t=[];while(i<lines.length&&lines[i].startsWith('|')){t.push(lines[i]);i++}const cells=r=>r.split('|').slice(1,-1).map(c=>c.trim());
      out.push('<table><tr>'+cells(t[0]).map(c=>`<th>${inl(c)}</th>`).join('')+'</tr>'+t.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</table>');continue}
    if(l.startsWith('- ')){const t=[];while(i<lines.length&&lines[i].startsWith('- ')){t.push(`<li>${inl(lines[i].slice(2))}</li>`);i++}out.push('<ul>'+t.join('')+'</ul>');continue}
    if(l.startsWith('> ')){out.push(`<blockquote>${inl(l.slice(2))}</blockquote>`);i++;continue}
    if(l.trim()){out.push(`<p>${inl(l)}</p>`)}i++}
  return out.join('')}

// --------------------------------------------------------------- render + events
function render(){renderShell();$('#view').innerHTML=V[state.tab]();bind();glideChart();activeChart()}
document.addEventListener('click',e=>{const b=e.target.closest('#copyCmd');if(!b)return;});
function bind(){
  document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{state.vintage=+e.dataset.open;state.tab=ROLES[state.role].tabs.includes('portfolios')?'portfolios':ROLES[state.role].tabs.includes('risk')?'risk':state.tab;render()});
  document.querySelectorAll('[data-vt]').forEach(e=>e.onclick=()=>{state.vintage=+e.dataset.vt;render()});
  document.querySelectorAll('[data-dr]').forEach(e=>e.onclick=(ev)=>{ev.preventDefault();if(!e.dataset.dr||e.dataset.dr==='null')return;
    if(!ROLES[state.role].tabs.includes('ledger')){toast('The ledger opens in the Compliance and Audit workspaces. Record: '+e.dataset.dr);return}
    state.ledgerSel=e.dataset.dr;state.tab='ledger';render()});
  document.querySelectorAll('[data-cma]').forEach(e=>e.onclick=()=>{const a=e.dataset.cma;const r=L.find(x=>x.step===`ac-${a}.cma-judge`);
    $('#cmaWhy').innerHTML=r?`<h3>${esc(nm(a))} — judge reasoning</h3><div class="why">${esc(r.rationale)}</div><div class="small" style="margin-top:6px">Method weights: ${Object.entries(r.output.weights).map(([k,v])=>`${esc(k)} ${(v*100).toFixed(0)}%`).join(' · ')} · path: ${esc(r.output.judge_path)} · record <span class="mono">${r.dr_id}</span></div>`:''});
  const lf=$('#lf'); if(lf){lf.oninput=()=>{state.ledgerFilter=lf.value;const pos=lf.selectionStart;render();const n=$('#lf');n.focus();n.setSelectionRange(pos,pos)}}
  document.querySelectorAll('[data-decide]').forEach(b=>b.onclick=()=>{const reason=$('#reason').value.trim();
    if(!$('#ack').checked){toast('Confirm you read the rationale, dissent and compliance results.');return}
    if(reason.length<10){toast('Please give a reason (at least 10 characters).');return}
    if(b.dataset.decide==='approve'&&R.vintages[state.vintage].compliance_summary.FAIL>0){toast('Blocked: a hard limit FAILED. Approval is not possible.');return}
    state.approvals.push({vintage:state.vintage,role:ROLES[state.role].approverRole,decision:b.dataset.decide,reason});toast('Decision recorded in this session.');render()});
  document.querySelectorAll('.caret[data-node]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const n=b.dataset.node;state.collapsed[n]=!state.collapsed[n];render()});
  const vs=$('#viewSel'); if(vs) vs.onchange=()=>{state.view=vs.value;render()};
  document.querySelectorAll('[data-prod]').forEach(e=>e.onclick=()=>{state.prodOpen.mtrs=state.prodOpen.mtrs===false?true:false;render()});
  document.querySelectorAll('[data-pv]').forEach(e=>e.onclick=(ev)=>{if(ev.target.closest('[data-goto-pos]'))return;const k='v'+e.dataset.pv;state.prodOpen[k]=!state.prodOpen[k];render()});
  document.querySelectorAll('[data-goto-pos]').forEach(e=>e.onclick=(ev)=>{ev.stopPropagation();state.vintage=+e.dataset.gotoPos;state.tab='positioning';render()});
  document.querySelectorAll('[data-rbv]').forEach(e=>e.onclick=()=>{state.vintage=+e.dataset.rbv;render()});
  document.querySelectorAll('[data-mv]').forEach(e=>e.onclick=()=>{state.vintage=+e.dataset.mv;render()});
  document.querySelectorAll('[data-mwin]').forEach(e=>e.onclick=()=>{state.mwin=e.dataset.mwin;render()});
  const aa=$('#adjAdd'); if(aa) aa.onclick=()=>{const val=parseFloat($('#adjVal').value);if(isNaN(val)){toast('Enter a value');return}
    state.adj.push({node:$('#adjNode').value,mode:$('#adjMode').value,value:val/100,funded:$('#adjFund').value||null});render()};
  const ac=$('#adjClear'); if(ac) ac.onclick=()=>{state.adj=[];render()};
  const rbTe=$('#rbTe'), rbV=$('#rbV');
  const rbPreview=()=>{if(!rbTe)return;const b=parseFloat(rbTe.value)/100;const vv=rbV.value;const list=vv==='default'?VINT.filter(x=>!(D.risk_budget_policy.vintages||{})[x]):[+vv];
    $('#rbPrev').innerHTML=b>D.risk_budget_policy.hard_max+1e-9?'<span class="chip crit">Above IPS hard limit — needs an IPS amendment</span>':list.map(x=>`${x}: ${(R.vintages[x].risk.te/b*100).toFixed(0)}% used`).join(' · ')};
  if(rbTe){rbTe.oninput=rbPreview;rbV.onchange=rbPreview;rbPreview();}
  const rg=$('#rbGo'); if(rg) rg.onclick=()=>{const r=$('#rbReason').value.trim();if(r.length<10){toast('Please give a reason (10+ characters).');return}
    const role=state.role==='pm'?'portfolio_manager':'risk';const c=$('#rbCmd');c.style.display='block';
    c.textContent=`meridian risk-budget set --vintage ${rbV.value} --te ${parseFloat(rbTe.value).toFixed(2)}% --name "YOUR NAME" --role ${role} --reason "${r.replace(/"/g,"'")}"`};
  const cc=$('#copyCmd'); if(cc) cc.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($('#cmd').textContent).then(()=>toast('Copied'),()=>toast('Select the text to copy'))};
}
window.addEventListener('resize',()=>{glideChart();activeChart()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(ROLES[h]&&h!==state.role){state.role=h;state.tab=null;render()}});
render();
</script>
