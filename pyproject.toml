[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.1.0"
description = "Meridian — agentic multi-asset portfolio management with policy-as-code and an immutable decision ledger"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "cvxpy>=1.4",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "jsonschema>=4.20",
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
snowflake = ["snowflake-connector-python>=3.6"]
bloomberg = ["blpapi"]          # install from Bloomberg's package index
factset = ["requests>=2.31"]
app = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "pyjwt[crypto]>=2.8",
       "itsdangerous>=2.1", "httpx>=0.27", "python-multipart>=0.0.9", "anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "sqlalchemy>=2.0", "pyjwt[crypto]>=2.8", "itsdangerous>=2.1",
       "httpx>=0.27", "python-multipart>=0.0.9"]
e2e = ["pytest-playwright>=0.5", "playwright>=1.45", "uvicorn[standard]>=0.29"]
notebooks = ["jupyterlab>=4", "matplotlib>=3.8", "nbformat>=5", "nbclient>=0.10"]

[project.scripts]
meridian = "meridian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meridian = ["ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
