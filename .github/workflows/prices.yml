name: prices
# Daily closing prices for the home-screen performance table. Weekdays after the US close: fetches adjusted closes
# from Yahoo Finance (free, unofficial endpoint; replace with a licensed source before production) for every ETF
# held and each asset class's proxy ETF, then posts them to the Meridian app. Uses free GitHub Actions minutes; it
# adds no AWS resources. Skips quietly if the app isn't deployed.
on:
  schedule:
    - cron: "17 22 * * 1-5"      # 22:17 UTC Mon-Fri (after the 4pm ET close)
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency: {group: prices, cancel-in-progress: false}
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - name: Fetch daily closes
        run: meridian prices fetch --out prices.json --days 400
      - name: Connect to the Meridian app
        id: aws
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Post prices to the app
        if: steps.aws.outcome == 'success'
        run: |
          set -euo pipefail
          APP=$(aws cloudformation describe-stacks --stack-name Meridian --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text)
          ARN=$(aws cloudformation describe-stacks --stack-name Meridian --query "Stacks[0].Outputs[?OutputKey=='IngestTokenSecretArn'].OutputValue" --output text)
          TOKEN=$(aws secretsmanager get-secret-value --secret-id "$ARN" --query SecretString --output text)
          echo "::add-mask::$TOKEN"
          curl -fsS -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @prices.json "$APP/api/ingest/prices" | tee posted.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p = json.load(open("prices.json")); r = json.load(open("posted.json"))
          print(f"## Prices to {p['as_of']}\n\n{len(p['series'])} tickers posted ({r})")
          if p["errors"]: print("\nNot fetched: " + ", ".join(f"{k} ({v[:80]})" for k, v in p["errors"].items()))
          PY
