name: agent-run
# Runs the target-date pipeline with live LLM judgment. The API key is read from the
# encrypted repository secret ANTHROPIC_API_KEY and never printed. Outputs are uploaded
# as a build artifact and summarized on the run page.
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "As-of date (YYYY-MM-DD)"
        default: "2026-10-31"
        required: true
      model:
        description: "Model ID"
        default: "claude-opus-5-5"
        required: true
      backend:
        description: "sdk = Claude Agent SDK agents with tools; messages = single-shot calls (older, cheapest)"
        type: choice
        options: [sdk, messages]
        default: sdk
      budget_usd:
        description: "Spend cap for this run in USD (sdk backend). When used up, remaining judgments use the deterministic policy"
        default: "3.00"
        required: true
      publish:
        description: "Publish the run to the Meridian app (untick for test runs)"
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[llm,app,agents]"
      - name: Connect to the Meridian app (if deployed)
        id: aws
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        continue-on-error: true            # run still works (artifact only) if the app is not reachable yet
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Pull approved positions, recorded risk history and policy overrides from the app
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          APP=$(aws cloudformation describe-stacks --stack-name Meridian --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text)
          ARN=$(aws cloudformation describe-stacks --stack-name Meridian --query "Stacks[0].Outputs[?OutputKey=='IngestTokenSecretArn'].OutputValue" --output text)
          TOKEN=$(aws secretsmanager get-secret-value --secret-id "$ARN" --query SecretString --output text)
          echo "::add-mask::$TOKEN"
          echo "APP_URL=$APP" >> "$GITHUB_ENV"; echo "INGEST_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          mkdir -p data/positions
          curl -fsS -H "Authorization: Bearer $TOKEN" "$APP/api/export/positions.csv" -o data/positions/history.csv
          curl -fsS -H "Authorization: Bearer $TOKEN" "$APP/api/export/policy-overrides" -o overrides.json
          mkdir -p data/risk
          curl -fsS -H "Authorization: Bearer $TOKEN" "$APP/api/export/risk-history.csv" -o data/risk/history.csv || rm -f data/risk/history.csv
          python - <<'PY'
          import json
          from ruamel.yaml import YAML
          from meridian.app.store import apply_overrides
          y = YAML(); y.preserve_quotes = True
          p = "policies/target_date_series.yaml"
          doc = y.load(open(p)); ov = json.load(open("overrides.json")); apply_overrides(doc, ov)
          y.dump(doc, open(p, "w")); print("applied overrides:", ov)
          PY
      - name: Check secret is configured
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::ANTHROPIC_API_KEY secret is not set"; exit 1; fi
      - name: Run pipeline (live LLM judgment)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MERIDIAN_MODEL: ${{ inputs.model }}
          MERIDIAN_LLM: "on"
          MERIDIAN_AGENT_BACKEND: ${{ inputs.backend }}
          MERIDIAN_RUN_BUDGET_USD: ${{ inputs.budget_usd }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          meridian run target-date --as-of "${{ inputs.as_of }}" | tee run.txt
          RUN=$(ls -td runs/run_* | head -1)
          meridian ui "$RUN"
          meridian verify "$RUN/ledger.jsonl"
          echo "RUN_DIR=$RUN" >> "$GITHUB_ENV"
      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          d = os.environ["RUN_DIR"]
          recs = [json.loads(l) for l in open(f"{d}/ledger.jsonl")]
          usage = next((r["output"] for r in recs if r["step"] == "llm.usage"), {})
          paths = {}
          for r in recs:
              p = (r.get("output") or {}).get("judge_path")
              if p: paths[p] = paths.get(p, 0) + 1
          print("## Model usage\n")
          print(f"- backend: {usage.get('backend', 'messages')}; judgments requested: {usage.get('calls')}, failures (fell back): {usage.get('failures')}, input tokens: {usage.get('input_tokens')}, output tokens: {usage.get('output_tokens')}")
          if "cost_usd" in usage:
              print(f"- cost: ${usage['cost_usd']:.2f} of ${usage['budget_usd']:.2f} run budget; agent turns: {usage.get('turns')}, tool calls: {usage.get('tool_calls')}, skipped over budget: {usage.get('skipped_over_budget')}")
          if usage.get("disabled"): print(f"- **agent backend switched off:** {usage['disabled']}")
          print(f"- judgment paths: {paths}")
          for e in usage.get("errors", [])[:10]: print(f"- error: `{e}`")
          print("\n---\n")
          print(open(f"{d}/board_memo.md").read())
          print("\n---\n")
          print(open(f"{d}/compliance_report.md").read())
          PY
      - name: Publish run to the Meridian app
        if: inputs.publish && env.APP_URL != '' && env.INGEST_TOKEN != ''
        run: |
          set -euo pipefail
          cd "$(dirname "$RUN_DIR")"
          tar czf /tmp/run.tgz "$(basename "$RUN_DIR")/results.json" "$(basename "$RUN_DIR")/ledger.jsonl" \
            "$(basename "$RUN_DIR")/board_memo.md" "$(basename "$RUN_DIR")/compliance_report.md"
          curl -fsS -H "Authorization: Bearer $INGEST_TOKEN" -F bundle=@/tmp/run.tgz "$APP_URL/api/ingest"
          echo "" >> "$GITHUB_STEP_SUMMARY"; echo "**Published to the app:** $APP_URL/runs/$(basename "$RUN_DIR")" >> "$GITHUB_STEP_SUMMARY"
      - name: Model usage (job log)
        if: env.RUN_DIR != ''
        run: |
          python - <<'PY'
          import json, os, collections
          recs = [json.loads(l) for l in open(os.environ["RUN_DIR"] + "/ledger.jsonl")]
          usage = next((r["output"] for r in recs if r["step"] == "llm.usage"), {})
          print("usage:", json.dumps({k: v for k, v in usage.items() if k != "errors"}))
          for e in usage.get("errors", [])[:10]: print("error:", e)
          paths, tools = collections.Counter(), collections.Counter()
          for r in recs:
              o = r.get("output") or {}
              if o.get("judge_path"):
                  paths[(r["step"].split(".")[-1] if r["step"].startswith("ac-") else r["step"]) + ":" + o["judge_path"]] += 1
              for c in (o.get("agent_trace") or {}).get("tool_calls", []):
                  tools[c["tool"] + (":error" if c.get("error") else "")] += 1
          print("judgment paths:", dict(paths))
          print("tool calls:", dict(tools))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: meridian-${{ env.RUN_DIR != '' && 'run' || 'failed' }}-${{ github.run_number }}
          path: runs/
          retention-days: 90
