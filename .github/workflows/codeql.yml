# Code scanning for security bugs in Python and the pages' JavaScript (NIST SP 800-53 SA-11, RA-5;
# SP 800-218 PW.7). Free for public repositories; results appear under Security -> Code scanning.
name: codeql
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  schedule:
    - cron: "41 6 * * 1"        # weekly, Monday 06:41 UTC
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix: {language: [python, javascript-typescript]}
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with: {languages: "${{ matrix.language }}", queries: security-extended}
      - uses: github/codeql-action/analyze@v3
        with: {category: "/language:${{ matrix.language }}"}
