name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Golden pipeline run (synthetic data, offline judgment)
        env: {MERIDIAN_LLM: "off"}
        run: meridian run target-date --as-of 2026-10-31
